<script>
(function(){
 var D=[{"label": "Title", "notes": "CUE: The story in one line. One person just knows. {{That knowledge leaves.}} AI needs it. Five layers capture it as context. The chat tool lets a person Ask, Act, Tell. The Zone sets how AI helps. The water call shows it. Research and adoption prove it.\nZUBIA:\n- Hands up: who has watched The Mandalorian? \"This is the way.\"\n- A rule with no reason attached. The newest member learns it by watching.\n- Your best person has a way too. \"That is just how we do it here.\" {{That is}} tacit knowledge.\n- {{So}} tonight's one idea: the person who just knows hands off the routine and keeps the judgment.\n- Agent, defined once: in the title it means the whole AI system that takes steps. Layer 3 uses it for the step-running part only.\nBRIDGE: {{Before we start}}, who is talking to you tonight."}, {"label": "Speakers", "notes": "ZUBIA:\n- Dr. Zubia Mughal, Dr. Data. IT, then training design, then doctoral research on why training does not reach the job.\nMARCOS:\n- Marcos Ramos, change management coach. I help teams put a new system in place and standardize it.\nZUBIA:\n- {{So}} I build the systems. Marcos makes sure people use them.\nBRIDGE: {{Marcos}}, walk us through tonight."}, {"label": "Agenda", "notes": "MARCOS:\n- We start with a phone quiz to find your Zone.\n- {{Then}}: who holds the knowledge, why now, what the tool does, how we capture it, it in use, adoption.\n- Questions at the end.\nBRIDGE: {{Zubia}}, let's find your Zone."}, {"label": "Section: Place yourself", "notes": "ZUBIA:\n- Phones out. Scan the code, or type drdataevents.netlify.app/join.\n- 12 questions, 3 minutes, anonymous. Answer how you really work today.\n- You see your own result on your phone. The screen shows the room only.\n- {{When everyone is in}}, right arrow starts question 1."}, {"label": "Quiz question 1", "notes": "CUE: Right arrow moves the quiz. No key needed. People can keep answering while you talk.\nZUBIA:\n- Read the question out loud. Give the room about 15 seconds.\n- {{Then}} right arrow."}, {"label": "Quiz question 2", "notes": "ZUBIA:\n- Read it out loud. 15 seconds. {{Then}} right arrow."}, {"label": "Quiz question 3", "notes": "ZUBIA:\n- Read it out loud. 15 seconds. {{Then}} right arrow."}, {"label": "Quiz question 4", "notes": "ZUBIA:\n- Read it out loud. 15 seconds. {{Then}} right arrow."}, {"label": "Quiz question 5", "notes": "ZUBIA:\n- Read it out loud. 15 seconds. {{Then}} right arrow."}, {"label": "Quiz question 6", "notes": "ZUBIA:\n- Read it out loud. 15 seconds. {{Then}} right arrow."}, {"label": "Quiz question 7", "notes": "ZUBIA:\n- Read it out loud. 15 seconds. {{Then}} right arrow."}, {"label": "Quiz question 8", "notes": "ZUBIA:\n- Read it out loud. 15 seconds. {{Then}} right arrow."}, {"label": "Quiz question 9", "notes": "ZUBIA:\n- Read it out loud. 15 seconds. {{Then}} right arrow."}, {"label": "Quiz question 10", "notes": "ZUBIA:\n- Read it out loud. 15 seconds. {{Then}} right arrow."}, {"label": "Quiz question 11", "notes": "ZUBIA:\n- Read it out loud. 15 seconds. {{Then}} right arrow."}, {"label": "Quiz question 12", "notes": "ZUBIA:\n- Last one. Give them a few seconds.\nBRIDGE: {{Now}} the room's results. Right arrow."}, {"label": "Where the room landed", "notes": "ZUBIA:\n- Read the biggest group out loud.\n- Four Zones. We explain each one in a few minutes. {{Hold on to}} where you landed.\n- These questions touched four of the five layers: how you write, how you do the work, where the line sits, how you check it.\nBRIDGE: {{That was you.}} {{Now}} the person behind every business: the one who just knows."}, {"label": "One person who just knows", "notes": "ZUBIA:\n- Every team has one person who just knows. Tribal knowledge, secret sauce, judgment.\n- Picture yours. Hand up if it is you. Keep it up if you answered work questions on vacation.\n- {{And}} that person has two jobs.\nBRIDGE: {{Here they are.}}"}, {"label": "Decide and train", "notes": "ZUBIA:\n- Job one: make the calls. Pricing, exceptions, judgment never written down.\n- Job two: train everyone else. Every new hire, every question, every day. It never ends.\n- {{So}} the business has one need.\nBRIDGE: {{Marcos}}, what does that need look like in a franchise?"}, {"label": "Work the same way", "notes": "MARCOS:\n- A franchise works because every location makes the same food. A burger in Milwaukee tastes like Madison.\n- Consistency is the product.\nZUBIA:\n- {{One expert needs the same thing}}: same answers, same standards, expert in the room or not.\nBRIDGE: {{So}} why does this matter for AI, and why now?"}, {"label": "Section: The Why", "notes": "ZUBIA:\n- The why: the expert's knowledge is the missing piece for AI.\nBRIDGE: {{First}}, what is that knowledge?"}, {"label": "Knowledge walks out", "notes": "ZUBIA:\n- Polanyi, The Tacit Dimension, 1966, p. 4: \"We can know more than we can tell.\"\n- The estimator who spots a bad estimate at a glance, {{but}} cannot state the rule.\n- {{Companies are the same.}} Amanda Kelly, Streamlit co-founder, Snowflake 2026: \"a lot of companies don't really know how they make decisions.\"\nMARCOS:\n- The book Clone: a person built AI tools to clone himself and cut hours of mundane work. Tonight is that idea, done safely.\nBRIDGE: {{Marcos}}, where does that knowledge go when it leaves?"}, {"label": "Where knowledge leaves", "notes": "MARCOS:\n- Five exits: retirements, downsizing, consultants who finish, teams that stopped writing things down, a sale or handoff.\n- A consultant leaves after 3, 6, 12 months, and takes the knowledge with them.\nZUBIA:\n- {{Can we get it back?}} Yes. It is spread everywhere. Organize it into five layers and AI can help.\nMARCOS:\n- {{So how else}} is knowledge leaving? Zubia has the numbers.\nBRIDGE: {{Zubia}}, how else is it leaving? Sensitive data going into public AI tools."}, {"label": "Founders share data", "notes": "ZUBIA:\n- {{That is the how else}}: people putting sensitive, proprietary data into public AI tools.\n- Startups.co.uk with Sage, July 2026. 400+ UK founders, owners, executives.\n- 90% of SMBs using AI worry their data trains global models. {{Yet}} half shared sensitive company data with public AI tools last month. Over a quarter, weekly.\n- UK survey, so the behavior is the point. Small businesses cannot hide behind size.\nBRIDGE: {{Marcos}}, what happens to companies when they do adopt AI?"}, {"label": "Jobs not redesigned", "notes": "MARCOS:\n- Deloitte, State of AI in the Enterprise 2026. 3,235 leaders, 24 countries, Aug to Sep 2025.\n- 84% have not redesigned jobs around AI. Many build AI fluency and leave the work as it was.\n- {{So}} companies keep using AI on top of their older processes. There is a disconnect between how the work is written down and how the expert thinks.\n- {{As a result}}, people use AI around the old process. The tool never gets the expert's way of working.\nBRIDGE: {{Zubia}}, we have to bridge that gap: how work is done, how processes and tasks are written down, and how an expert thinks. {{Your doctoral research is about bridging it.}} Can you tell us more?"}, {"label": "Doctoral research", "notes": "ZUBIA:\n- Doctoral research, UW-Stout, 2023. A support team, 200+ slides, four experts tuning. {{Yet}} performance dipped. The content did not match how the work was done.\n- {{So}} the method: capture the expert's tacit knowledge and its context, then answer at the moment of need. A performance support tool. Our example is a chat tool.\n- Five layers make up an AI agent system: Prompts (how we talk), Skills (how we do it), Agents (what happens next), Contracts (where the lines are), Evaluation (how we check).\n- {{The STZ}}, Skills Threshold Zone: knowledge elicitation fills those layers with the expert's knowledge, and shows how humans work with AI.\n- Caution: one team, method design only, no AI tool built then.\nBRIDGE: {{But}} a tool answers only from what it is given. {{That is context.}}"}, {"label": "Context engineering", "notes": "ZUBIA:\n- Prompt engineering: word each request well. Context engineering: build what the tool knows before anyone asks.\n- {{The thread}}: elicitation captures the expert's context. The five layers organize it. The chat tool answers from it. The Zone sets how much AI does with it.\n- Gartner, Jul 28 2025: \"context engineering is in, and prompt engineering is out.\"\n- Anthropic, Sep 29 2025: \"the natural progression of prompt engineering.\"\n- Snowflake 2026: prompting is now a basic skill.\n- Like a franchise recipe: the tool grabs this first, then that.\nBRIDGE: {{And}} what does the person want from that tool? Gartner names three verbs."}, {"label": "Ask Act Tell", "notes": "ZUBIA:\n- Gartner's three verbs. Ask: what we want to know. Act: decisions and actions. Tell: insights and communication.\n- In our chat tool, the novice: {{Ask}}: \"What do I do?\" {{Act}}: gets the steps, and the tool books the next move with approval. {{Tell}}: gets the words to say to the customer.\n- {{But}} Gartner leaves one out: Stop. The human in the loop. The tool stops and checks with the supervisor.\n- {{The thread}}: the verbs are what the person wants. The five layers supply it. Ask and Act: Skills and Agents. Tell: Prompts. Stop: Contracts. Evaluation checks all of it.\nBRIDGE: {{So}} what is that context actually made of?"}, {"label": "Section: The What", "notes": "ZUBIA:\n- The what: what the finished chat tool does.\nBRIDGE: {{Start with}} what it works from."}, {"label": "Context equation", "notes": "ZUBIA:\n- Intent times everything the tool is given equals context. Building it on purpose is context engineering.\n- The model brings general knowledge. Your systems bring data, state, history. Semantics gives each business term one meaning.\n- {{The one box}} with no system behind it is tacit knowledge. It lives in the expert's head.\n- {{That box}} is the rest of tonight. The five layers fill it, and the words and rules we capture feed semantics too.\nBRIDGE: {{So}} how do the five layers turn expertise into context?"}, {"label": "Capture to context", "notes": "ZUBIA:\n- Five kinds of questions to the expert. Output: context in their words, approved by them, rechecked when things change.\n- Marcos, say the layers back as if you were the expert.\nMARCOS:\n- Prompts: how we talk here. Skills: how we do it here. Agents: what happens next. Contracts: where the lines are. Evaluation: how we check the work.\nZUBIA:\n- Contracts is a flowchart decision diamond with a stop line. Evaluation is quality control.\nBRIDGE: {{Now}} where does each layer live in the chat tool? Think of a body."}, {"label": "Five parts of chat tool", "notes": "ZUBIA:\n- Brain: the model. General and swappable. Everything that makes it yours is in the other five.\n- Prompts: voice. Skills: muscle memory. Agents: nervous system. Contracts: immune system. Evaluation: senses.\n- Layer 3 \"Agents\" is only the step-running part, not the whole system.\nBRIDGE: {{Let's watch the body work.}} Marcos, walk us through a real call."}, {"label": "Chat tool answers", "notes": "MARCOS:\n- A novice at a property management company gets a call. Opens the chat tool. Never hunts for the expert.\nZUBIA:\n- The water call: tenant says water under the sink. We stay with it all night.\n- Each row came from a layer. Check and steps: Skills. Booking: Agents. Wording: Prompts. Stop: Contracts. Evaluation checks before it leaves.\n- Verbs: check, do, say, stop. {{Same as slide 28}}: check is Ask, do is Act, say is Tell. Stop is the human in the loop.\nBRIDGE: {{And}} that same context feeds more than one tool."}, {"label": "One context many tools", "notes": "ZUBIA:\n- Five layers build one context. One context feeds many tools.\n- Chat tool: all five. AI application: layers 3 and 4. Training course: layers 1, 2, 5.\n- From training: it trains people, {{and}} it trains machines to help people.\nBRIDGE: {{Now}} the how. Marcos, read us the four steps."}, {"label": "Section: The How", "notes": "MARCOS:\n- 1 List the tasks. 2 Pick the right ones. 3 Place each task in a Zone. 4 Capture the five layers.\nZUBIA:\n- Step 1: for each task, how often, how much it matters, how hard, where mistakes happen. Triage a maintenance call: daily, high, medium, missed water damage. Vendor invoice: weekly, medium, low, paying twice.\n- Step 2: frequent and lower risk first. Frequent and high risk: expert decides, tool brings sources. Rare and high risk: stays with the expert. Rare and lower risk: later.\n- {{Step 3}} you already did tonight: you placed yourselves.\nBRIDGE: {{So}} here is where the room landed."}, {"label": "Where the room landed (step 3)", "notes": "ZUBIA:\n- Same screen as the start. The room's Zones.\n- Step 3 applies the Zone to tasks.\nBRIDGE: {{But first}}, why the Zone is useful."}, {"label": "Why the Zone matters", "notes": "ZUBIA:\n- Find your Zone is a diagnostic. Any person, task, process, or step. A training needs tool and an assistance needs tool.\n- {{Ask}}: the person says how they do the task. {{Place}}: Above, Oscillating, Below, or Inside. {{Respond}}: training, practice, automation, protected judgment.\n- Goal: Inside. A new hire starts Above (training, AI in Research), {{then}} Oscillating (practice, Learn), {{then}} Inside (Assist).\n- Below is routine the expert can state step by step. Encode it. AI runs the rules.\n- {{The link}}: the five layers capture how the expert works, so AI gives that help the same way every time.\nBRIDGE: {{Now}} the four Zones, one at a time."}, {"label": "Four Zones", "notes": "ZUBIA:\n- Below: knows the rules, does it by hand. AI mode: Encode.\n- Inside: you and AI in harmony, judgment protected. AI mode: Assist. AI gathers and drafts, you decide.\n- Above: leaning on AI for what you lack. AI mode: Research. Cited sources.\n- Oscillating: learning. Some days you decide, some days you lean. AI mode: Learn.\n- Work rarely sits in one Zone. Your mix matters more than your label.\nBRIDGE: {{Now}} the same Zones on one task, with the expert."}, {"label": "Zone check", "notes": "ZUBIA:\n- Same four Zones, now on one task, with the expert in the room.\n- Below: \"Here is the rule.\" Encode it. Inside: \"This is my judgment.\" Assist it. Above: \"Past what I can call.\" Research it. Oscillating: \"Still forming.\" Learn it.\n- Zones expire. Recheck when the work, the staff, or the business changes.\nBRIDGE: {{And}} the Zone also tells the chat tool how to behave."}, {"label": "Zone sets the mode", "notes": "ZUBIA:\n- Encode: runs the rule, never changes it. Assist: gathers, drafts, shows past cases, never makes the call.\n- Research: cited sources, states uncertainty, never presents a conclusion as a decision. Learn: shows reasoning, asks you to decide and say why, never decides silently.\n- The Zone sets how far the tool may go. The five layers set what it knows.\nBRIDGE: {{So}} here is the water call, two people. Watch the novice move through the modes."}, {"label": "Same call two Zones", "notes": "ZUBIA:\n- Expert: handled it hundreds of times. Below. Encode: her steps run in her order. She gets her time back.\n- Novice, at first: handled it twice. Above. Research: expert's rules and past cases. Says what it does not know, supply line or drain.\n- {{Then}} he oscillates. Some days he decides. Learn: shows the expert's reasoning, he says why.\n- {{Later}} he is Inside. Calls hold steady. Assist.\n- One chat tool. Apprenticeship every day, even when the expert is out.\nBRIDGE: {{So}} what goes into the expert's rules? Five things, the same five you teach a new hire."}, {"label": "Five layers defined", "notes": "ZUBIA:\n- This is step four: capture the five layers.\n- Each layer is a question to the expert, a body part, and a part of the chat tool.\n- 1 Prompts: voice. 2 Skills: muscle memory. 3 Agents: nervous system. 4 Contracts: immune system. 5 Evaluation: senses.\nBRIDGE: {{Let's build it one layer at a time}}, on the water call."}, {"label": "Layer 1 Talk", "notes": "ZUBIA:\n- Novice: \"Tenant says water under the sink. What do I do?\"\n- Expert: \"We never say emergency. We say: we are sending someone today.\"\n- The tool sounds like you, including the words you never use. That is the voice.\nBRIDGE: {{Voice is right. Now}} the steps."}, {"label": "Layer 2 Do", "notes": "ZUBIA:\n- Supply line or drain? Water spreading? Shut off the supply valve. Book the plumber today.\n- Muscle memory: trained steps in the expert's order.\nBRIDGE: {{Steps done. So}} what happens next?"}, {"label": "Layer 3 Next", "notes": "ZUBIA:\n- Plumber booked. Tenant told. Ticket logged. Follow up tomorrow.\n- New hires fix the problem and forget the follow-up. The expert knows the chain. The tool proposes each next move, nothing dropped.\n- Nervous system. Layer 3 is the step-running part only.\nBRIDGE: {{And}} where does the tool stop?"}, {"label": "Layer 4 Lines", "notes": "ZUBIA:\n- Four answers: do it, do it smaller, bring it to me, stop. Ceiling damage is the line. The expert inspects that.\n- {{This is what keeps the system safe.}} Prompts, Skills, Agents propose. Only Contracts authorize. Evaluation can block.\n- A person approves what matters. Stop means check with the supervisor. Approvals expire. Rules are rechecked when the model, data, or business changes.\n- AI automates the written workflow. The expertise stays with the expert.\nBRIDGE: {{Last}}: how do we know it stays right?"}, {"label": "Layer 5 Check", "notes": "ZUBIA:\n- You check a new hire's work for months. The tool gets the same.\n- An answer that drifts from the expert's is blocked and fixed before it reaches anyone.\n- Senses. The whole body is lit: five layers, one expert.\nBRIDGE: {{Now}} three more jobs, same pattern: check, do, say, stop."}, {"label": "Section: In Use", "notes": "ZUBIA:\n- Three more jobs. Same pattern each time: check, do, say, stop.\nBRIDGE: {{First}}, a home builder. Marcos, you know this one."}, {"label": "Estimator", "notes": "MARCOS:\n- Client wants to move a window. How do we price it?\n- Check: is the framing up? Do: price as a change order, labor and material split. Say: adds cost and schedule, approval before work. Stop: touches the structure, goes to the estimator.\nZUBIA:\n- Senior estimator: Below, Encode. New estimator: starts Above, tool brings sources, {{then}} shows why the split matters.\nBRIDGE: {{Next}}, an energy assessor."}, {"label": "Energy assessor", "notes": "ZUBIA:\n- Assessor still training on the job, private AI app with the expert's rules.\n- Check: blower door reading, attic access. Do: sealing steps in order. Say: plain wording for the homeowner. Stop: combustion appliance involved, call the expert.\nBRIDGE: {{And one more}}: an IT desk."}, {"label": "IT support desk", "notes": "ZUBIA:\n- User cannot log in after a password reset.\n- Check: account locked? Which device? Do: clear the lockout, sign in again. Say: \"Your account was locked after several tries. It is unlocked now.\" Stop: new location, go to the lead.\n- One context, many applications.\nBRIDGE: {{So}} what does the novice get from all this?"}, {"label": "What the novice gets", "notes": "ZUBIA:\n- Answers without pulling the expert away. Fewer repeat discussions. Work continues when the expert is out.\n- Help at the moment of the task. Apprenticeship every day.\nBRIDGE: {{Is there research behind this?}} Yes."}, {"label": "Research", "notes": "ZUBIA:\n- Brynjolfsson, Li, Raymond, Quarterly Journal of Economics, 2025. 5,179 customer chat support analysts got real-time suggested replies.\n- 14% more issues resolved per hour on average. {{But}} 34% for novice and low-skilled. Minimal for experienced.\n- Authors: suggestive evidence the tool spreads what top performers do to newer analysts.\n- Caveat: outside evidence, other people's tool. It says nothing about our systems.\nBRIDGE: {{Building is half. Adoption is the other half.}} Marcos, how does a team actually use it?"}, {"label": "Section: Adoption", "notes": "MARCOS:\n- Adoption.\nBRIDGE: {{Start with}} why tools fail."}, {"label": "Adoption (Marcos)", "notes": "MARCOS:\n- Prosci studied 1,107 professionals. 63% of AI implementation challenges stem from human factors.\n- User proficiency alone is 38% of the failure points.\n- Building is easy. Use is the hard part.\nBRIDGE: {{So}} what helps people use it?"}, {"label": "Managers and AI use", "notes": "MARCOS:\n- Gallup, May 2026, employees in organizations that have AI. Only 36% strongly agree their manager supports their team's use.\n- Those who do are 1.7 times as likely to use AI a few times a week or more.\n- {{A link, not proof of cause.}} We coach managers, and coach the team.\nBRIDGE: {{Which brings us to one rule.}}"}, {"label": "Build around the job", "notes": "MARCOS:\n- \"The tool\" is the AI software itself: the chat tool, or any product a business is thinking of buying.\n- Businesses buy the tool and bend the work around it. {{Flip it}}: start from the task (the water call: the expert's steps and stop points), {{then}} pick the tool.\n- Deloitte's 84%: starting with the tool leaves the work as it was.\n- Zubia's five layers capture the task side.\nBRIDGE: {{Zubia}}, bring it home."}, {"label": "Recap", "notes": "ZUBIA:\n- The expert's knowledge becomes a tool the whole team can use.\n- 1 List tasks: the maintenance call, daily, hidden water damage. 2 Pick: frequent and lower risk first. 3 Zone check, the Find your Zone diagnostic: training, practice, or automation. 4 Capture the five layers: \"we are sending someone today,\" stop at ceiling damage.\n- {{Then}} adoption: managers back it, people use it daily, the tool fits the job.\n- {{The thread}}: the expert's knowledge, five layers, context, a chat tool where the person can Ask, Act, Tell, and Stop.\n- Value tracked in Layer 5: hours per week on the task, KPIs, a 90-day success measure.\nBRIDGE: {{So}} back to the person who just knows."}, {"label": "Close", "notes": "ZUBIA:\n- You started tonight by finding your own Zone. {{Same diagnostic}}, run on a task with the expert.\n- The person who just knows: her rules run the routine, her judgment is protected, the novice learns from her every day. Next time, she takes the vacation.\n- The right knowledge, in the right place, at the right time.\n- Marcos, why do you do this work?\nMARCOS:\n- \"Because it works.\" (rest in your own words. Draft: building is easy, use is hard, a tool that follows the expert gets used, and it gives time back.)\nZUBIA:\n- Thank you, Marcos. Missed the quiz? The link is on the slide. SPIN will share the slides.\nBRIDGE: {{Questions.}}"}, {"label": "Questions", "notes": "ZUBIA:\n- We would love your questions."}]; var i=0, t0=Date.now(), fs=24, linked=false, lastSeq=null, remoteOk=false; if(window.innerWidth<600) fs=19;

  (d.notes||"No notes for this slide.").split("\n").forEach(function(line){
   if(!line.trim()) return; var m=/^(ZUBIA|MARCOS):\s*(.*)$/.exec(line), b=/^- (.*)$/.exec(line), r=/^BRIDGE:\s*(.*)$/.exec(line), c=/^CUE:\s*(.*)$/.exec(line), row;
   if(m){ row=el("div","ln"); row.appendChild(el("span","tag "+m[1], m[1])); if(m[2]) row.appendChild(rich(m[2])); }
   else if(b){ row=el("div","bl"); row.appendChild(rich(b[1])); }
   else if(r){ row=el("div","br"); row.appendChild(el("span","tag","BRIDGE")); row.appendChild(rich(r[1])); }
   else if(c){ row=el("div","cue"); row.textContent=c[1]; }
   else { row=el("div","ln"); row.appendChild(rich(line)); }
   box.appendChild(row); });
  var n=D[i+1]; $("next").textContent=""; if(n){var b=el("b","", "Next: "+n.label); $("next").appendChild(b);}
  document.documentElement.style.setProperty("--fs",fs+"px"); }
 function setStatus(t,warn){ $("status").textContent=t; $("status").className="status"+(warn?" warn":""); }
 var bc=null;
 try{ bc=new BroadcastChannel("fyz-deck");
  bc.onmessage=function(e){ if(e.data&&typeof e.data.slide==="number"){ i=Math.min(e.data.slide,D.length-1); linked=true; setStatus(LEAD?"Linked to the deck in this browser":"Following Zubia"); show(); } };
  bc.postMessage({hello:true});
 }catch(e){}
 function keyVal(){ return $("key").value.trim(); }
 function goTo(n){ if(!LEAD) return; n=Math.max(0,Math.min(D.length-1,n)); i=n; show();
  if(bc){ try{ bc.postMessage({goto:n}); }catch(e){} }
  fetch("/api/live/host/remote",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({slide:n})}).then(function(r){ remoteOk=r.ok; setStatus(r.ok?"Leading. The deck and Marcos follow you.":"Could not reach the deck",!r.ok); }).catch(function(){ setStatus("No connection to the server",true); }); }
 function poll(){ if(linked) return;
  fetch("/api/live/remote/state",{cache:"no-store"}).then(function(r){return r.json()}).then(function(s){ if(!s.fresh){ setStatus("Waiting for the deck. Open it with ?remote=1.",true); return; } if(typeof s.slide==="number"&&s.total>0){ if(lastSeq===null||s.slide!==i){ i=Math.min(s.slide,D.length-1); show(); } lastSeq=s.seq; setStatus(LEAD?"Leading. Arrow keys or the buttons move the deck.":"Following Zubia"); } }).catch(function(){ setStatus("No connection to the server",true); }); }
 setInterval(poll,1200); poll();
 $("prev").onclick=function(){ goTo(i-1); }; $("first").onclick=function(){ goTo(0); }; $("nx").onclick=function(){ goTo(i+1); };
 $("sm").onclick=function(){ fs=Math.max(16,fs-2); show(); }; $("lg").onclick=function(){ fs=Math.min(60,fs+2); show(); };
 $("rst").onclick=function(){ t0=Date.now(); };
 $("key").addEventListener("change",function(){ try{ localStorage.setItem(KS,keyVal()); }catch(e){} setStatus("Key saved on this device"); });
 document.addEventListener("keydown",function(e){ if(e.target&&e.target.id==="key") return; if(!LEAD) return; if(e.key==="ArrowRight") $("nx").click(); if(e.key==="ArrowLeft") $("prev").click(); });
 setInterval(function(){ var s=Math.floor((Date.now()-t0)/1000), m=Math.floor(s/60); $("clock").textContent=(m<10?"0":"")+m+":"+(s%60<10?"0":"")+(s%60); },1000);
 show();
})();
