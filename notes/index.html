<style>
 body{padding:24px 5vw;min-height:100vh}
 .top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:12px;gap:16px;flex-wrap:wrap}

</style></head><body>
<div class="top"><div><div class="brand"><img src="/live/mascot.png" alt=""><div><div class="name">Dr. Data Decision Intelligence</div><div class="tag">Presenter notes</div></div></div></div>

<div class="next" id="next"></div>
<div class="ctl"><button id="prev" type="button">Previous</button><button id="nx" type="button">Next</button><button id="sm" type="button">Smaller text</button><button id="lg" type="button">Larger text</button><button id="rst" type="button">Reset timer</button></div>
<script>
(function(){
 var D=[{"label": "Title", "notes": "Tonight you will learn how to encode an expert in a private chat tool. Every example is one task, start to finish."}, {"label": "Speakers", "notes": "Bios are still unconfirmed with Derek. Keep each to two sentences. Marcos introduces himself."}, {"label": "Agenda", "notes": "This is a lecture. Questions come at the end. There is one hands-up quiz in the middle."}, {"label": "One person who just knows", "notes": "Ask the room to picture that person on their own team. This person holds the proficiency and the excellence."}, {"label": "Decide and train", "notes": "Two jobs, and the second one never ends. Every new hire, every question, every day."}, {"label": "Work the same way", "notes": "A franchise works because every location makes the same food. A business with one expert needs the same consistency."}, {"label": "Section: The Why", "notes": "Transition. One breath, then move on."}, {"label": "Knowledge walks out", "notes": "Verify the quote and page before the talk. Tacit means known but never written down. Say it once in plain words. Wording check: the published sentence is \"We can know more than we can tell.\" (page 4 in the University of Chicago Press edition). The slide uses that published wording."}, {"label": "Where knowledge leaves", "notes": "This is Marcos's slide. No statistics here. He can tell the story of the consultant who leaves after a year and takes the knowledge with them. For this audience, note that agile teams often keep no documentation."}, {"label": "Founders leak data", "notes": "People are already putting business knowledge into public tools. Check the survey region and sample on the page before quoting. Say nothing about whether paid tiers train on inputs."}, {"label": "Old workflows", "notes": "Fieldwork was Aug to Sep 2025, published Jan 2026. Most companies add AI to the old way of working. This is why the tool needs the expert's way of working built in."}, {"label": "Context engineering", "notes": "Prompt engineering means you word each request. Context engineering means you build what the tool knows before anyone asks. The forecast is about semantics, the agreed meaning of your business terms and data. Capturing your expert supplies part of that. Do not say the five layers produce Gartner's 80%. Confirm the First Take wording first. Checked: the 80% and 60% figures match the Gartner press release of May 11, 2026."}, {"label": "Gartner heat map", "notes": "Two uses sit closest to tonight: knowledge management and search, and conversational AI. In plain words: finding what the business knows and asking it questions. The graphic is shown unaltered."}, {"label": "Ask Act Tell", "notes": "Ask is what we want to know. Act is decisions and actions. Tell is insights and communication. A tool that works in all three has data, semantics and AI behind it. We use this as a picture later."}, {"label": "How AI gets context", "notes": "Intent is what the person is trying to get done. Walk the boxes left to right. Any AI already has the general knowledge. Your systems hold your data."}, {"label": "Tacit is missing", "notes": "Your systems hold the records, but the expert's judgment is in their head. People are already pasting that knowledge into public tools, which is the gap we just saw."}, {"label": "Section: The How", "notes": "Transition. Steps 1 to 3 first, then the quiz, then step 4, the five layers."}, {"label": "Step 1 List", "notes": "Triage a maintenance call: daily, high, medium, mistake is missing hidden water damage. Approve a vendor invoice: weekly, medium, low, mistake is paying the same bill twice. It sounds simple. Writing it down in this detail is the work."}, {"label": "Step 2 Pick", "notes": "Frequent and lower risk is where you start. Frequent and high risk: the expert decides and the tool brings sources. Rare and high risk stays with the expert."}, {"label": "Step 3 Zone check", "notes": "The check is on the task, not on the person. Inside is the only state we build. Zone assignments expire and get rechecked because the work changes. Your rehearsal explained Below three different ways. Settle one sentence."}, {"label": "Two zones", "notes": "Two tools with similar names. Keep them apart. The quiz result uses the word \"zone\" too. Either call the quiz result \"your starting point\" in the room or match the website wording. Marcos has a note on this too."}, {"label": "Section: The quiz", "notes": "Transition into the live quiz. Tell the room to get their phones out. The next slide has the QR code."}, {"label": "Scan to start the quiz", "notes": "Ask everyone to take out their phones and scan the code, or type the link. Before the talk, open drdataevents.netlify.app/screen in a second browser tab, press C, and enter the host key. Switch to that tab: it shows the same QR code and the joined count. Press the right arrow for each question and give the room a few seconds to answer. The bars move as people tap. After question 12, press the Results button. Each person sees their own result on their own phone, and the screen shows the room totals. Three questions line up with the layers: Q5 (does it sound like you) is Layer 1, Q6 (do you check the result) is Layer 5, Q7 (is there a clear line) is Layer 4. When you are done, return to the deck and say: \"Now I will show you how that one job gets captured.\""}, {"label": "Section: Five layers", "notes": "Transition into the heart of the talk. Slow down from here."}, {"label": "Five things", "notes": "This is the heart of the talk. You already teach people these five things. Tonight we write them down so a tool can use them."}, {"label": "Layer 1 Talk", "notes": "Prompts are voice and words. Include the words you never use."}, {"label": "Layer 2 Do", "notes": "Skills are named steps, in the expert's order. Give the tool the steps and the tool follows them."}, {"label": "Layer 3 Next", "notes": "New hires drop the ball after the fix. The expert knows the chain. The tool proposes each next move so nothing is dropped."}, {"label": "Layer 4 Lines", "notes": "This is where you tell the tool what it may do alone. Ceiling damage means the expert inspects it personally. Approvals expire because the business changes, so each one has an end date and gets reviewed."}, {"label": "Layer 5 Check", "notes": "This is how you check a new hire's work for the first few months. If an answer drifts, it is blocked and fixed before it reaches anyone. An error raises an alert. The tool never continues silently."}, {"label": "Who decides", "notes": "Suggesting and approving are separate jobs. That is why the tool cannot talk itself into something risky."}, {"label": "Your turn", "notes": "Give them a full minute of quiet. Take one volunteer."}, {"label": "Section: The What", "notes": "Transition. From how we capture to what it does."}, {"label": "Check Do Say", "notes": "Every answer the tool gives follows this order. First it checks, then it says what to do, then it gives the words to say."}, {"label": "Chat assistant mapping", "notes": "I took Gartner's circles and mapped our layers onto them. This also gives you a glass box: you can see why the tool answered the way it did, and the answer shows its source."}, {"label": "One context many tools", "notes": "This split is a design, not something shown in a client engagement yet. Say so. The same knowledge that trains people also trains a machine to help people work the same way."}, {"label": "Section: In Use", "notes": "Transition. Four short examples."}, {"label": "Property manager", "notes": "This is a chat. The junior never has to find the expert."}, {"label": "Estimator", "notes": "This is a chat. The junior never has to find the expert."}, {"label": "Energy assessor", "notes": "This is a chat. The junior never has to find the expert."}, {"label": "IT support desk", "notes": "This is a chat. The junior never has to find the expert."}, {"label": "What the junior gets", "notes": "This is performance support at the moment of the task. It saves expert time and saves discussions."}, {"label": "Research", "notes": "This was a customer support chat tool, not ours. It matches tonight's idea: capture what the best people do, and the newest people gain the most."}, {"label": "Section: Adoption", "notes": "Transition. Hand over to Marcos."}, {"label": "Adoption (Marcos)", "notes": "Marcos: Frontline employees, team leaders and executives. Building the tool is the easy part. Getting people to use it is the hard part. Marcos reviews. Checked: Prosci reports 63% of AI implementation challenges stem from human factors, from research with 1,107 professionals."}, {"label": "Managers set the pace", "notes": "Marcos: You told him \"only 36 percent strongly agree their manager supports this.\" Checked: Gallup's AI indicator says that as of May 2026, 36% of employees in AI-integrating organizations strongly agree their manager supports their team's use of AI, so he can say it. Your benchmark of five days a week for three to four weeks as adoption success is your own working number. Label it that way."}, {"label": "Fit with the work", "notes": "Marcos: Systems built around the job get used. Checked: Gallup's wording is employees who \"strongly agree that AI integrates well with the systems and processes they use at work\" (88% frequent use) versus those who \"do not strongly agree\" (55%). The bar labels match."}, {"label": "Build around the job", "notes": "Marcos: Short close for his section. This links adoption back to the capture method. A tool built from the expert's own way of working gets used."}, {"label": "Close", "notes": "Marcos said other speakers had their websites on almost every slide. Check with Derek on Oct 26 anyway."}, {"label": "Questions", "notes": "5 minutes."}]; var i=0, t0=Date.now(), fs=30, linked=false;
 var $=function(x){return document.getElementById(x)};
 function show(){ var d=D[i]||{label:"",notes:""};
  $("pos").textContent="Slide "+(i+1)+" of "+D.length; $("title").textContent=d.label; $("notes").textContent=d.notes||"No notes for this slide.";
  var n=D[i+1]; $("next").textContent=""; if(n){var b=document.createElement("b");b.textContent="Next: "+n.label;$("next").appendChild(b);$("next").appendChild(document.createTextNode(n.notes?"  |  "+n.notes.slice(0,140)+(n.notes.length>140?"...":""):""));}
  document.documentElement.style.setProperty("--fs",fs+"px"); }
 try{ var bc=new BroadcastChannel("fyz-deck");
  bc.onmessage=function(e){ if(e.data&&typeof e.data.slide==="number"){ i=Math.min(e.data.slide,D.length-1); linked=true; $("status").textContent="Linked to the deck"; $("status").className="status"; show(); } };
  bc.postMessage({hello:true});
  setTimeout(function(){ if(!linked){ $("status").textContent="Not linked. Open the deck in another window on the same site, or use the buttons."; $("status").className="status warn"; } },2500);
 }catch(e){ $("status").textContent="Linking is not supported in this browser. Use the buttons."; $("status").className="status warn"; }
 $("prev").onclick=function(){ i=Math.max(0,i-1); show(); }; $("nx").onclick=function(){ i=Math.min(D.length-1,i+1); show(); };
 $("sm").onclick=function(){ fs=Math.max(16,fs-2); show(); }; $("lg").onclick=function(){ fs=Math.min(64,fs+2); show(); };
 $("rst").onclick=function(){ t0=Date.now(); };
 document.addEventListener("keydown",function(e){ if(e.key==="ArrowRight"&&!linked) $("nx").click(); if(e.key==="ArrowLeft"&&!linked) $("prev").click(); });
 setInterval(function(){ var s=Math.floor((Date.now()-t0)/1000), m=Math.floor(s/60); $("clock").textContent=(m<10?"0":"")+m+":"+(s%60<10?"0":"")+(s%60); },1000);
 show();
})();
</script></body></html>
