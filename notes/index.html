<script>
(function(){
 var D=[{"label": "Title", "notes": "ZUBIA: Good evening, everyone. Before we start, a quick show of hands: who here has watched The Mandalorian?\nZUBIA: In that series, whenever someone asks why they do something a certain way, the answer is always \"This is the way,\" and that is the whole explanation. It is a rule with no reason attached, they follow it without being able to say why, and the newest member learns it just by watching everyone else.\nZUBIA: Your best person on your team has a way too. If you ask them why they did it like that, you get \"That is just how we do it here,\" and that, right there, is tacit knowledge.\nZUBIA: So tonight has one idea, which is that the person who just knows can hand off the routine work and keep the judgment for themselves, and every example you see tonight is one task, followed from start to finish.\nZUBIA: One thing before we go on, because the title has the word agents in it and I want to define it once so there is no confusion. In the title, an agent means an AI system that takes steps on a task, so it does more than answer a question, it checks, it does, and it hands off to the next step, and the five layers sit between the expert and that system.\nZUBIA: Later tonight you will see Layer 3, which is also called Agents, and there the word means only one part of the system, the part that runs the steps. The title uses the word for the finished system, Layer 3 uses it for the step-running part, and the example we will use all night is a chat tool."}, {"label": "Speakers", "notes": "ZUBIA: I am Dr. Zubia Mughal, and I go by Dr. Data. I started out in IT, moved into training design, and my doctoral research asked a simple question, which was why training does not reach the job.\nZUBIA: Marcos, why don't you introduce yourself?\nMARCOS: I am Marcos Ramos, and I am a change management coach. I work with my clients from beginning to end to help them put a new system in place and standardize it for their environment.\nZUBIA: So Marcos and I come at this from two sides, because I build the systems and Marcos helps teams actually use them, and you will hear both tonight."}, {"label": "Agenda", "notes": "MARCOS: Here is what we will cover tonight. We start with a quick phone quiz so you can find your Zone, and then we move into who holds the knowledge in your business, why it matters now, what the finished chat tool does, how we capture the knowledge, what it looks like in use, and how teams adopt it.\nMARCOS: Questions come up at the end, so keep your phones close for the quiz.\nMARCOS: Zubia, let's find your Zone."}, {"label": "Section: Place yourself", "notes": "ZUBIA: Before we begin, let's find your Zone, because it helps us connect to tonight's topic. Phones out, and scan the code on the screen, or type the link underneath it. Answer for how you actually work today, and be honest, because there are no wrong answers. Your answers are anonymous, you will see your own result on your phone, and the screen shows only the room's totals. Give me a moment while everyone joins, and when you are in, press the right arrow to start question one."}, {"label": "Quiz question 1", "notes": "ZUBIA: This is the live quiz. Each question appears here and on your phones, and the bars fill as the room answers. [Press the right arrow for each question. The quiz follows the slide. No key is needed, and people can keep answering while you talk.] Read the question out loud and give the room about fifteen seconds."}, {"label": "Quiz question 2", "notes": "ZUBIA: Read the question out loud, give the room about fifteen seconds, and press the right arrow."}, {"label": "Quiz question 3", "notes": "ZUBIA: Read the question out loud, give the room about fifteen seconds, and press the right arrow."}, {"label": "Quiz question 4", "notes": "ZUBIA: Read the question out loud, give the room about fifteen seconds, and press the right arrow."}, {"label": "Quiz question 5", "notes": "ZUBIA: Read the question out loud, give the room about fifteen seconds, and press the right arrow."}, {"label": "Quiz question 6", "notes": "ZUBIA: Read the question out loud, give the room about fifteen seconds, and press the right arrow."}, {"label": "Quiz question 7", "notes": "ZUBIA: Read the question out loud, give the room about fifteen seconds, and press the right arrow."}, {"label": "Quiz question 8", "notes": "ZUBIA: Read the question out loud, give the room about fifteen seconds, and press the right arrow."}, {"label": "Quiz question 9", "notes": "ZUBIA: Read the question out loud, give the room about fifteen seconds, and press the right arrow."}, {"label": "Quiz question 10", "notes": "ZUBIA: Read the question out loud, give the room about fifteen seconds, and press the right arrow."}, {"label": "Quiz question 11", "notes": "ZUBIA: Read the question out loud, give the room about fifteen seconds, and press the right arrow."}, {"label": "Quiz question 12", "notes": "ZUBIA: Last question. Give the room a few more seconds, then press the right arrow to see where the room landed."}, {"label": "Where the room landed", "notes": "ZUBIA: This is where the room landed, live, from your answers. Read the biggest group off the screen out loud. We will come back to what each Zone means in a few minutes, and for now keep in mind where you placed yourself. Those twelve questions touched four of the five layers: how you write, how you do the work, where the line sits, and how you check it. Now let's start with who holds the knowledge in your business."}, {"label": "One person who just knows", "notes": "ZUBIA: Every team has one person who just knows. That person holds the tribal knowledge, the secret sauce, and the judgment, so picture that person on your own team.\nZUBIA: Raise your hand if you are that person on your team, and keep it up if you answered work questions on your last vacation.\nZUBIA: That person actually has two jobs."}, {"label": "Decide and train", "notes": "ZUBIA: The first job is that they are trusted to decide, so they make the calls on pricing, exceptions, and all of the judgment that was never written down. The second job is that they are required to train everyone else, and that one never ends, because it is every new hire, every question, every single day.\nZUBIA: And the business has one need coming out of that, so Marcos, what does that look like in a franchise?"}, {"label": "Work the same way", "notes": "MARCOS: A franchise works because every location makes the same food. If you have a burger in Milwaukee, it should taste the same as one in Madison.\nMARCOS: Zubia, what does a business with one expert need?\nZUBIA: It needs the same thing, which is consistency. Same answers and same standards, whether the expert is in the room or not, and that is the whole point of a franchise.\nZUBIA: So why does this matter for AI, and why now?"}, {"label": "Section: The Why", "notes": "ZUBIA: Let's start with the why, which is why the expert's knowledge is the missing piece when it comes to AI."}, {"label": "Knowledge walks out", "notes": "ZUBIA: Michael Polanyi wrote in The Tacit Dimension, in 1966, on page 4, \"We can know more than we can tell.\" Tacit knowledge is knowledge we have but have never written down, and often could not write down if we tried.\nZUBIA: Think about the person who looks at an estimate and spots a bad one at a glance, and then cannot tell you the rule they used. That is tacit knowledge.\nZUBIA: Snowflake's 2026 predictions report says the same thing about companies. Amanda Kelly, a co-founder of Streamlit, says a lot of companies don't really know how they make decisions, which tells you where those decisions live, in people's heads.\nZUBIA: Marcos has a story that fits right here.\nMARCOS: I read a book called Clone, about a person who built AI tools to clone himself and cut hours and days out of work he found mundane. That is the idea tonight, done in a safe way.\nZUBIA: Marcos, where does that knowledge go when it leaves?"}, {"label": "Where knowledge leaves", "notes": "MARCOS: Knowledge leaves a business in five ways. People retire, companies downsize, consultants finish a project and walk out with everything they learned, teams stop writing things down, and businesses get sold or passed on. A consultant comes in for three months, six months, or a year, and when they leave, the knowledge goes with them.\nMARCOS: Zubia, can you get it back?\nZUBIA: Yes, we can, because the knowledge is spread everywhere, and once it is organized into five layers you can build an AI system that helps. Marcos, what are people doing in the meantime?\nMARCOS: They are pouring business knowledge into public tools, and Zubia has the numbers."}, {"label": "Founders share data", "notes": "ZUBIA: Startups.co.uk and Sage surveyed more than 400 UK founders, owners, and executives, and the report is called The Startup AI Paradox, from July 2026.\nZUBIA: The article says 90% of the small and medium businesses using AI worry that their private data is used to train global models, and yet half of them are leaking sensitive data anyway. Half said they shared sensitive company information with public AI tools in the past month, and for over a quarter of them it is a weekly habit.\nZUBIA: This is a UK survey, so the behavior is the point. People are putting business knowledge into public tools and doing it the wrong way, and small businesses cannot hide behind size and funding the way large companies can.\nZUBIA: Marcos, what happens when companies do adopt AI?"}, {"label": "Jobs not redesigned", "notes": "MARCOS: Deloitte's State of AI in the Enterprise 2026 surveyed 3,235 leaders, from director level up to the C-suite, in 24 countries, in August and September 2025.\nMARCOS: What they found is that 84% of the companies have not redesigned jobs around AI. Deloitte says many of them focus on building AI fluency and leave the work itself exactly as it was.\nMARCOS: So put simply, companies add AI on top of the old way of working, and that is why the tool needs the expert's way of working built into it.\nMARCOS: Zubia, you studied what happens to training after the class ends."}, {"label": "Skills are the barrier", "notes": "ZUBIA: This is my doctoral research at UW-Stout, which I finished in 2023, and I studied one technical support team.\nZUBIA: The managers told me that performance dropped within a few days of training, and when I looked at the training itself, it was 200 slides in one full-day class, which the analysts could not leave the desk to attend for that long.\nZUBIA: Four experts from the team helped me design the fix, and we started with their tasks, their skills, and what good looks like at each level, and they rated the collaboration excellent.\nZUBIA: That is where the five layers began, because the method was always the same: ask the expert, write it down in their words, and check it back with them. I have been working on that problem my whole career, and today I run Dr. Data on those same five layers, so one chat tool answers the same way for every employee.\nZUBIA: It was one team, so I treat it as where the method began. Now let's look at why prompting alone is not enough."}, {"label": "Context engineering", "notes": "ZUBIA: Prompt engineering means you word each request carefully, while context engineering means you build what the tool knows before anyone asks.\nZUBIA: Gartner's First Take from July 28, 2025 is titled Lead the Shift to Context Engineering as Prompt Engineering Fades, and its line is that context engineering is in, and prompt engineering is out. Then Gartner's Avivah Litan followed on October 6, 2025 with an article headlined Context Engineering Is the New Prompt Engineering, and its lead is that it is time to prioritize context over prompts, with context-aware architectures, dynamic data, and reimagined human-AI interfaces.\nZUBIA: Anthropic's engineering team wrote on September 29, 2025 that they view context engineering as the natural progression of prompt engineering, so you have two different organizations pointing in the same direction. And Snowflake's 2026 predictions report says prompting was once talked about as a job and is now a basic skill everyone needs.\nZUBIA: Engineering here just means organizing in layers, so the tool grabs this first, then that, and then it listens to you, which is a lot like a franchise recipe, so remember Marcos's burger. Gartner also groups what people need from AI into three verbs."}, {"label": "Ask Act Tell", "notes": "ZUBIA: Ask, Act, and Tell. Ask is what we want to know, Act is decisions and actions, and Tell is insights and communication, so a well-built system can prepare you for a meeting, answer a question, or give you a report to hand to someone else, and semantics sits in the center where all three overlap.\nZUBIA: We use a chat tool as tonight's example because asking a question is the simplest way to see all of this at work.\nZUBIA: Gartner's three verbs leave something out, though, so we add a fourth, which is stop. Stop is the human in the loop, where the tool stops and checks with the supervisor, and the answer comes back in a few minutes."}, {"label": "Section: The What", "notes": "ZUBIA: So what is context actually made of? That is what we will look at next."}, {"label": "Context equation", "notes": "ZUBIA: Here is what context is made of. Intent, times everything the chat tool is given, equals context, and building all of that on purpose is what we call context engineering.\nZUBIA: The model brings the general knowledge, your systems bring the data, the state, and the history, and then there are semantic structures, which give every business term one agreed meaning, so an active client or a closed job means the same thing everywhere, and Gartner puts semantics right at the center of its picture.\nZUBIA: Gartner's own framework lists tacit knowledge as one of the six, and it is the one with no system behind it, because it lives in the expert's head, so the rest of tonight is about that box.\nZUBIA: The five layers are how we get tacit knowledge out of the expert, by asking how we talk here, how we do it here, what happens next, where the lines are, and how we check the work, and those layers also write down meaning, because they capture the expert's words, including the words they never use, and the expert's rules and lines, which feeds semantics too.\nZUBIA: So hold on to three sentences. Context engineering is the whole equation, semantics is one term in it, which is the shared meaning of your terms, and the five layers fill the tacit term, while the words and rules we capture feed semantics as well."}, {"label": "Capture to context", "notes": "ZUBIA: We ask the expert five kinds of questions, and the output is context in the expert's own words, approved by the expert, and rechecked whenever conditions change.\nZUBIA: Marcos, I would like you to say these back to me in your own words, as if you were the expert, because when you explain it back it helps the audience grasp it better.\nMARCOS: Prompts is how we talk here, so it is what you say and how you ask when you pass knowledge on. Skills is how we do it here, which is your expertise and the steps you would teach. Agents is what happens next, the sequence after each step. Contracts is where the lines are, so those are your guardrails. And Evaluation is how we check the work, which is making sure it is complete and came out right.\nZUBIA: That is it exactly. For contracts, think of a flowchart with a decision diamond, yes or no, and when the answer is stop, you draw a line that says do not do anything more, come back to me, and evaluation is simply the quality check, the quality control.\nZUBIA: Before we capture the layers for any task, we run a Zone check on that task, and you placed yourself in a Zone with the quiz at the start. So where does each layer go inside the chat tool? Think of a body."}, {"label": "Five parts of chat tool", "notes": "ZUBIA: Think of the chat tool as a body, and the expert fills five parts of it. The brain is the model, which could be any large language model you choose, and it stays general and is the only part you can swap, because everything that makes it yours lives in the other five.\nZUBIA: Prompts are the voice, which is how we talk here, the words we use and the words we never use, so it sounds like the expert. Skills are muscle memory, trained steps done in the expert's order without thinking.\nZUBIA: Layer 3 is called Agents, and in the title the word means the whole system, while here it means one part, the part that runs the steps. It is the nervous system, which sequences what happens next so nothing gets dropped.\nZUBIA: Contracts are the immune system, which knows what to reject and when to stop, like kill switches that protect the whole system, and Evaluation is the senses, which notice when something is off, the way you scan the room and gauge before you go ahead.\nZUBIA: Now let's see the body at work on a real call, and Marcos, I will let you walk us through it."}, {"label": "Chat tool answers", "notes": "MARCOS: A novice at a property management company gets a call, he opens the chat tool, and he never has to go find the expert.\nMARCOS: Zubia, what is the chat tool doing while he waits?\nZUBIA: We will call this the water call, where a tenant says there is water under the sink, and we will stay with it for the rest of the night. The chat tool reads the expert's context, and it checks, does, and says what the expert would, and it stops where the expert stops.\nZUBIA: Each row on the screen came from a layer, so the check and the steps come from Skills, the booking comes from Agents, the wording comes from Prompts, and the stop comes from Contracts. Before the answer leaves, Evaluation checks it against the expert's standard and can send the work back.\nZUBIA: In the chat tool the verbs read check, do, say, and stop, where check is ask, do is act, and say is tell. Stop is the one Gartner's three leave out, the human in the loop where the tool stops and checks with the supervisor, and that is the difference between a generic chatbot and a tool built on your expert.\nZUBIA: And once you have this context, it feeds more than one tool."}, {"label": "One context many tools", "notes": "ZUBIA: Five layers build one context, and that one context can feed many tools. I come from the training industry, so I see it this way: this knowledge trains people, and it also trains machines to help people.\nZUBIA: A chat tool uses all five layers, an AI application leans mostly on layers 3 and 4, and a training course leans on layers 1, 2, and 5.\nZUBIA: Now let's talk about the how, and Marcos, would you read us the four steps?"}, {"label": "Section: The How", "notes": "MARCOS: There are four steps. Step one, list the tasks. Step two, pick the right ones. Step three, the Zone check, where we place each task in a Zone. And step four, capture the five layers.\nZUBIA: Step one is listing the tasks, so think about a new hire's first month and what you would teach them: what to do next, what not to touch, and what success looks like. For each task you write down how often it happens, how much it matters, how hard it is, and where mistakes happen. In a property management office, triaging a maintenance call happens daily, matters a lot, is medium difficulty, and the mistake is missing hidden water damage, while approving a vendor invoice happens weekly, has medium importance, is low difficulty, and the mistake is paying the same bill twice.\nZUBIA: Step two is picking the right tasks, because you cannot build everything at once, so we put the tasks on a risk and frequency grid and start with the ones that are frequent and lower risk. When a task is frequent and high risk, the expert decides and the tool brings the sources, a rare and high risk task stays with the expert, and a rare and lower risk task comes later.\nZUBIA: Step three places a task in a Zone, and you already placed yourselves at the start of the night, so let's look at where the room landed."}, {"label": "Where the room landed (step 3)", "notes": "ZUBIA: Step three is the Zone check, where we place each task in a Zone. You placed yourselves at the start of the night, so here is where the room landed again. Now we use the same four Zones on a task, with the expert."}, {"label": "Four Zones", "notes": "ZUBIA: Look at the results on the last slide, the room's totals from the quiz, and let's say what each Zone means. The share of the room that landed Below the Zone knows the rules and still does the work by hand, and reflexes are what we hand to the machine, so the mode is Encode.\nZUBIA: Inside the Zone is where you and AI work in harmony, and that is skilled judgment, which we protect, so the mode is Assist, where AI gathers and drafts and you decide.\nZUBIA: Above the Zone is where you lean on AI for knowledge you do not have yet, which is fair as long as you can see its sources, and the mode is Research.\nZUBIA: Oscillating means you are learning, so some days you decide and some days you lean on AI, a bit clumsy at first and then smoother, and that is a good place to be, and the mode is Learn.\nZUBIA: Read the biggest group off the screen out loud. A new hire starts Above, oscillates while learning, and ends up Inside, and we will watch one do exactly that in a few minutes. Look at your own phone too, because your mix matters more than your label, since work rarely sits in one Zone. The quiz placed you, and now we place a task, with the expert."}, {"label": "Zone check", "notes": "ZUBIA: These are the same four Zones, but now we use them on one task, with the expert in the room. Below means the expert can state the rule and does it the same way every time, so we encode it.\nZUBIA: Inside is the expert's judgment, so the tool gathers and drafts and the expert decides, and we assist it. Above goes past what the expert can call with confidence, so the tool brings cited research and we research it, and Oscillating means the expert's answer is still forming, so the tool shows its reasoning and asks for a reason, and we help the person learn it.\nZUBIA: Every Zone gets built, each in its own mode, and Zones expire and get rechecked, because the work, the staff, and the business all change. The Zone also does one more job, which is that it tells the chat tool how to behave."}, {"label": "Zone sets the mode", "notes": "ZUBIA: Encode runs the expert's rule and never changes it, and Assist gathers, drafts, and shows past cases but never makes the judgment call. Research brings cited sources and says what it does not know, and never presents a conclusion as a decision, and Learn shows its reasoning and examples and asks the person to decide and say why, and never decides silently.\nZUBIA: So the Zone tells the chat tool how far it may go, and the five layers tell it what to know. Now the part I want you to take home, which is the water call, with two people, and I want you to watch the novice move through the modes."}, {"label": "Same call two Zones", "notes": "ZUBIA: The same water call sits in two different Zones depending on who takes it. For the expert it is routine, because she has handled it hundreds of times, so it is Below the Zone, and in Encode mode the expert's steps run in the expert's order and she gets her time back.\nZUBIA: For the novice it is past his skills today, because he has handled it twice, so he starts Above the Zone, and in Research mode the chat tool brings the expert's rules and past cases and tells him what it does not know, for example whether the leak is a supply line or a drain.\nZUBIA: Then he begins to oscillate, so some days he decides and some days he leans on the tool, and in Learn mode the chat tool shows the expert's reasoning and he decides and says why. Over time his calls hold steady, he is Inside the Zone, and the chat tool moves to Assist, where it gathers and drafts and he decides.\nZUBIA: He upskills while he uses the chat tool, and that is apprenticeship every day, even when the expert is out, and one chat tool serves both of them, built on the expert's rules. So what goes into the expert's rules? Five things, and they are the same five things you teach a new hire."}, {"label": "Five layers defined", "notes": "ZUBIA: Each of the five layers is a question you ask the expert, a part of the body, and a part of the chat tool. Layer 1 is Prompts, how do we talk here, which is the voice, and in the chat tool it is its voice and the words it never uses. Layer 2 is Skills, how do we do it here, which is muscle memory, and in the chat tool it is the steps and rules it can run.\nZUBIA: Layer 3 is Agents, what happens next, which is the nervous system, and in the chat tool it is the sequence and the hand-offs between steps. Layer 4 is Contracts, where are the lines, which is the immune system, and in the chat tool it is approvals, limits, privacy, and stop. Layer 5 is Evaluation, how do we check the work, which is the senses, and in the chat tool it is checks against the expert's standard.\nZUBIA: Now we will build the body one layer at a time, using the water call."}, {"label": "Layer 1 Talk", "notes": "ZUBIA: Layer 1 is Prompts, how we talk here, and the novice calls the manager and says, \"Tenant says water under the sink. What do I do?\" The expert says, \"We never tell a tenant it is an emergency, we say we are sending someone today.\"\nZUBIA: So the tool sounds like you, and that includes the words you never use, and in the body this is the voice. The voice is right, so now we need the steps."}, {"label": "Layer 2 Do", "notes": "ZUBIA: Layer 2 is Skills, how we do it here, and the steps are, is it the supply line or the drain, is the water spreading, shut off the supply valve, and book the plumber for today. In the body this is muscle memory, trained steps done in order without thinking, and now that the steps are done, what happens next?"}, {"label": "Layer 3 Next", "notes": "ZUBIA: Layer 3 is Agents, what happens next, so the plumber is booked, the tenant is told, the ticket is logged, and there is a follow-up tomorrow. New hires fix the problem and forget the follow-up, while the expert knows the whole chain, so the tool proposes each next move and nothing gets dropped.\nZUBIA: In the body this is the nervous system, and remember that Layer 3 means the part that runs the steps, which is one part of the system and not the whole thing. And now, where does the tool stop?"}, {"label": "Layer 4 Lines", "notes": "ZUBIA: Layer 4 is Contracts, where the lines are, and there are four answers, which are do it, do it smaller, bring it to me, and stop. Ceiling damage is the line in this example, because the expert inspects that personally, and in the body this is the immune system, the place where the fourth verb lives, stop.\nZUBIA: This layer is also what keeps the whole system safe, so let me explain how. Prompts, Skills, and Agents can only propose, and only Contracts can authorize, with Evaluation able to block, which means the tool cannot talk itself into something risky, because suggesting and approving are separate jobs.\nZUBIA: A person approves what matters, and the expert decides what the tool may do alone. When the tool reaches a line it stops and checks with the supervisor, which is the human in the loop, and stop is the verb Gartner's three leave out. Approvals also have an end date and each one is reviewed before it expires, and the rules get rechecked when the model, the data, or the business changes.\nZUBIA: AI automates the workflow once it is written down, and the expertise stays with the expert. Now the last layer: how do we know it stays right?"}, {"label": "Layer 5 Check", "notes": "ZUBIA: Layer 5 is Evaluation, how we check the work, and you check a new hire's work for the first few months, so the tool gets the same treatment. If an answer drifts from the expert's, it is blocked and fixed before it reaches anyone, so the tool never continues silently.\nZUBIA: In the body these are the senses, and now the whole body is lit, which is the chat tool, five layers built from one expert. Now let's look at three more jobs with the same pattern: check, do, say, stop."}, {"label": "Section: In Use", "notes": "ZUBIA: Three more jobs, and the pattern is the same each time: check, do, say, and stop."}, {"label": "Estimator", "notes": "ZUBIA: Marcos, you have sat in meetings with home builders, so I will let you explain this one.\nMARCOS: Say a client is building a custom home and decides they want to move a window, and they ask how to price it. Before putting a price on it, the estimator checks whether the framing is already up. Then the change gets priced as a change order, with the labor and material split out, and the client hears that the change adds cost and schedule impact and needs approval before work starts.\nMARCOS: And if the move touches the structure, it goes to the estimator, because there are too many things that can go wrong, and that is the stop line.\nZUBIA: For the senior estimator this is routine, so it is Below the Zone and Encode, while a new estimator starts Above, where the chat tool brings the sources, and as they learn, it shows why the split matters."}, {"label": "Energy assessor", "notes": "ZUBIA: Next is an energy assessor who is still training on the job and has a private AI application with the expert's rules encoded in it. The house came back high on air leakage, so the question to the chat tool is whether to recommend sealing first, and the tool checks the blower door reading and attic access.\nZUBIA: It then lists the sealing steps in order and gives a plan in plain wording the homeowner can follow, and the stop line is that if a combustion appliance is involved, the tool says stop and call the expert. That is the immune system again."}, {"label": "IT support desk", "notes": "ZUBIA: The third one is an IT support desk, where a user types that they cannot log in after a password reset. The tool checks whether the account is locked and which device is trying, and then it says to clear the lockout and have them sign in again, which gets them an answer in live chat without waiting on a supervisor.\nZUBIA: The stop line is that a login from a new location goes to the lead, and that is one context feeding many applications. So what does the novice get from all this?"}, {"label": "What the novice gets", "notes": "ZUBIA: The novice gets answers without pulling the expert away, repeated discussions drop, and the work continues even when the expert is out. This is help at the moment of the task, it is apprenticeship every day, and it is continuous learning and growth.\nZUBIA: Now, is there research behind this? Yes, there is."}, {"label": "Research", "notes": "ZUBIA: This study is by Brynjolfsson, Li, and Raymond, in the Quarterly Journal of Economics in 2025. A generative AI assistant was rolled out in stages to 5,179 customer chat support analysts at a Fortune 500 software company, and it suggested replies in real time. The paper calls these analysts agents, so there the word means people.\nZUBIA: On average the analysts resolved 14% more issues per hour, and for novice and low-skilled analysts the gain was 34%, while for experienced and highly skilled analysts the effect was minimal.\nZUBIA: The authors describe suggestive evidence that the tool spreads what stronger performers do to newer analysts and helps them gain experience faster. They also report better customer sentiment, with fewer requests to escalate to a manager, and fewer analysts left, mostly among those with under six months of tenure.\nZUBIA: That matches tonight's idea, because the newest people gained the most when the way the best people work was built into the tool. This was a customer support chat tool built by other people, so it is outside evidence and says nothing about our systems.\nZUBIA: Building the tool is only half of the job, and the other half is adoption, so Marcos, how do you get a team to actually use it?"}, {"label": "Section: Adoption", "notes": "MARCOS: That brings us to adoption."}, {"label": "Adoption (Marcos)", "notes": "MARCOS: Prosci studied 1,107 professionals, including frontline employees, team leaders, and executives, and their headline is that 63% of AI implementation challenges stem from human factors.\nMARCOS: The biggest single piece Prosci names is user proficiency, which accounts for 38% of the failure points, so building the tool is the easy part and getting people to use it is the hard part. So what helps people use it?"}, {"label": "Managers and AI use", "notes": "MARCOS: Gallup's AI indicator, as of May 2026, looks at employees in organizations that have put AI in place, and only 36% of them strongly agree that their manager supports their team's use of AI. The employees who do strongly agree are 1.7 times as likely to use AI a few times a week or more.\nMARCOS: Gallup shows a link there, and it does not show that manager support causes the use. What we do is coach managers to support their team and coach the team to use the tool, and that brings us to one rule."}, {"label": "Build around the job", "notes": "MARCOS: Let me explain this slide, because the word tool can be confusing. Here the tool is the AI software itself, so it is the chat tool, or any AI product a business is thinking about buying or turning on.\nMARCOS: What I see happen is that a business hears about a new AI product, buys it, and then asks the team to bend their work around it. This slide says to do it in the other order. Step one is to start from the task, which means the actual job a person does, like the water call tonight, with the steps the expert takes and the places where the expert stops. Step two is to pick the tool that can do that job.\nMARCOS: Remember the Deloitte finding from earlier, where 84% of the companies had not redesigned jobs around AI. That is what it looks like when you start with the tool and leave the work as it was.\nMARCOS: Zubia has been showing you the task side all night, because the five layers capture how the expert does the job, and only after that do we build the tool from it. So the tool works the way your people already work, which gives the team a better chance of actually using it.\nMARCOS: Zubia, can you bring it home?"}, {"label": "Recap", "notes": "ZUBIA: So the expert's knowledge becomes a tool the whole team can use, and that works when the knowledge is captured the right way before the tool is built, so let us put the whole story together, from the expert to the chat tool in four steps, and then adoption.\nZUBIA: Step one is to list the tasks, what it is, how often it happens, how much it matters, how hard it is, and where mistakes happen, and in our example that is triaging a maintenance call, which is daily, and the risk is hidden water damage. Step two is to pick the right tasks, frequent and lower risk first, so the daily call comes early and ceiling damage stays with the manager.\nZUBIA: Step three is the Zone check, where we place each task in a Zone with the expert, so the expert sits Below the Zone in Encode, while the new hire starts Above and then oscillates. Step four is to capture the five layers in the expert's words, which fills in the tacit knowledge in the context, so in our example the tool says we are sending someone today, and it stops at ceiling damage.\nZUBIA: Then the team adopts it, which is what Marcos covered, where managers back it, people use it daily, and the tool fits the job, so the novice gets the answer without pulling the expert away.\nZUBIA: And once the system is in place, the value is tracked in Layer 5, with the hours per week on the task today, the KPIs, and a 90-day success measure. The expert's knowledge becomes a tool the whole team can use."}, {"label": "Close", "notes": "ZUBIA: Remember the person who just knows, the one who answered questions on vacation? Her rules now run the routine work, her judgment is protected, and the novice learns from her every day, even when she is out. Next time, she takes the vacation.\nZUBIA: The right knowledge, in the right place, at the right time. Marcos, why do you do this work?\nMARCOS: Because it works. Building the tool is the easy part, and getting people to actually use it is the hard part, and I have watched that happen in the work I do with teams. When the tool follows the way the expert already works, people use it, and that is why I do this.\nMARCOS: Time is funny, because everyone says they have none, and a tool that answers in the expert's own way gives some of it back every single day.\nZUBIA: Thank you, Marcos. If you missed the quiz, the link is on the slide, and SPIN will share the slides."}, {"label": "Questions", "notes": "ZUBIA: We would love your questions."}]; var i=0, t0=Date.now(), fs=24, linked=false, lastSeq=null, remoteOk=false; if(window.innerWidth<600) fs=19;
 var $=function(x){return document.getElementById(x)};
 var KS="fyz-notes-key"; try{ $("key").value=localStorage.getItem(KS)||""; }catch(e){}

  var box=$("notes"); box.textContent="";
  (d.notes||"No notes for this slide.").split("\n").forEach(function(line){
   if(!line.trim()) return; var m=/^(ZUBIA|MARCOS):\s*(.*)$/.exec(line); var row=el("div","ln");
   if(m){ var chip=el("span","tag "+m[1], m[1]); row.appendChild(chip); row.appendChild(el("span","txt",m[2])); }
   else row.appendChild(el("span","txt",line));
   box.appendChild(row); });
  var n=D[i+1]; $("next").textContent=""; if(n){var b=el("b","", "Next: "+n.label); $("next").appendChild(b);}
  document.documentElement.style.setProperty("--fs",fs+"px"); }
 function setStatus(t,warn){ $("status").textContent=t; $("status").className="status"+(warn?" warn":""); }
 var bc=null;
 try{ bc=new BroadcastChannel("fyz-deck");

  bc.postMessage({hello:true});
 }catch(e){}
 function keyVal(){ return $("key").value.trim(); }
 function goTo(n){ n=Math.max(0,Math.min(D.length-1,n)); i=n; show();
  if(bc){ try{ bc.postMessage({goto:n}); }catch(e){} }
  var k=keyVal();
  if(k){ fetch("/api/live/host/remote",{method:"POST",headers:{"content-type":"application/json","x-host-key":k},body:JSON.stringify({slide:n})}).then(function(r){ remoteOk=r.ok; if(r.status===401) setStatus("Wrong host key",true); else if(r.status===503) setStatus("Host key is not set on the server",true); else if(r.ok) setStatus(linked?"Linked to the deck in this browser":"Controlling the deck through the server"); }).catch(function(){ setStatus("No connection to the server",true); }); }
  else if(!linked) setStatus("Enter the host key to control the deck from this device",true); }
 function poll(){ if(linked||document.hidden) return;
  fetch("/api/live/remote/state",{cache:"no-store"}).then(function(r){return r.json()}).then(function(s){ if(!s.fresh){ if(!remoteOk) setStatus(keyVal()?"The deck has not reported in the last 30 minutes. Open it with ?remote=1.":"The deck has not reported in the last 30 minutes. Enter the host key to control it.",true); return; } if(typeof s.slide==="number"&&s.total>0){ if(lastSeq===null||s.slide!==i){ i=Math.min(s.slide,D.length-1); show(); } lastSeq=s.seq; if(!keyVal()) setStatus("Following the deck. Enter the host key to control it."); else if(!remoteOk) setStatus("Following the deck through the server"); } }).catch(function(){ setStatus("No connection to the server",true); }); }
 setTimeout(function(){ if(!linked){ setStatus("Not linked in this browser. Using the server. The deck must be open with ?remote=1",true); } },2500);

 setInterval(function(){ var s=Math.floor((Date.now()-t0)/1000), m=Math.floor(s/60); $("clock").textContent=(m<10?"0":"")+m+":"+(s%60<10?"0":"")+(s%60); },1000);
