<script>
(function(){
 var D=[{"label": "Title", "notes": "SAY: Tonight you will learn how to encode an expert in a private chat tool. Every example is one task, start to finish.\nSAY: Introduce yourself, then hand to Marcos to introduce himself. Marcos asked for larger type on his slides because small text is hard for him to read on screen.\nCHECK: Marcos's name is in bold with his business name.\nPREP: Date confirmed by Derek on the Oct 26 walkthrough: Wednesday, November 18, 2026. Networking and pizza 5:30 to 6:30, you are on about 6:30 to 7:30. Most likely at Concurrency, Brookfield (Bishop's Woods). The official invite comes from Derek.\nPREP: Derek's review: the content is strong. Keep one hands-on piece, the quiz. Everything else comes from the two of you.\nPREP: Promotion: SPIN posts first on LinkedIn and tags both of you. Repost from there, and do not post your own announcement before SPIN does. SPIN takes speaker photos during the session and sends them afterward. SPIN will post the slides on its website if you agree. Derek pulls your photos from LinkedIn. You offered to send him the deck link by email; he does not require it.\nSAY: Tonight has one idea. The person who just knows can hand off the routine and keep the judgment.\nDO: Time 0:00. Your part ends by about 0:56. Questions run after that with no time box.\nDO: Smile, slow down, and let the title sit for two seconds before you speak."}, {"label": "Speakers", "notes": "SAY: Two sentences each. Zubia first, then Marcos introduces himself in his own words.\nCHECK: Both bios are drafts. Confirm them with Marcos and Derek. Marcos's first sentence is a best reading of his business.\nSAY: Transition: Marcos and I come at this from two sides. I build the systems. Marcos helps teams actually use them.\nDO: Time check: about 1:30.\nSAY: I have built and installed 12 private AI systems across 10 industries since March 2026. Say this number the same way every time."}, {"label": "Agenda", "notes": "SAY: This is a lecture. Questions come at the end. There is one phone quiz in the middle. Keep your phones close.\nSAY: I keep the slides simple and clean on purpose, so we can talk through each one.\nSAY: Six parts. Who holds the knowledge. Why it matters now. What the finished tool does. How we capture it. What it looks like in use. And how teams adopt it.\nSAY: Transition: Let us start with the who.\nDO: Time check: about 3:00."}, {"label": "One person who just knows", "notes": "SAY: Every team has one person who just knows. That person holds the tribal knowledge, the secret sauce, and the judgment. Picture that person on your own team.\nSAY: Hold for a few seconds. Let the room think of a name.\nSAY: Raise your hand if you are that person on your team.\nSAY: Keep it up if you answered work questions on your last vacation.\nDO: Pause. Let the room look around and laugh. Remember this moment. The close comes back to it.\nSAY: Transition: That person has two jobs."}, {"label": "Decide and train", "notes": "SAY: That person is trusted to decide, and is required to train everyone else. Two jobs, and the second one never ends. Every new hire, every question, every day.\nSAY: Experts are special because they can call the shots and because they can train other people. Expertise runs from beginner to advanced to expert.\nSAY: Transition: And the business has one need."}, {"label": "Work the same way", "notes": "SAY: A franchise works because every location makes the same food. Marcos's example: a burger in Milwaukee should taste the same as one in Madison.\nSAY: A business with one expert needs the same consistency. Same answers, same standards, whether the expert is in the room or not.\nCHECK: Marcos tells the McDonald's example in his own words. Use a generic restaurant if you prefer not to name a brand on the slide.\nSAY: Transition: So why does this matter for AI, and why now?\nDO: Time check: about 7:00."}, {"label": "Section: The Why", "notes": "SAY: Transition. One breath, then move on. The Why comes first: why the expert's knowledge is the missing piece.\nDO: Time check: about 7:00. The Why runs to about 15:00."}, {"label": "Knowledge walks out", "notes": "SAY: Michael Polanyi wrote: \"We can know more than we can tell.\" Tacit knowledge is known but never written down. Say that once in plain words.\nSAY: Marcos can add a story. He has read a book called Clone, about a person who built agents to clone himself and cut hours and days of mundane work. That is the idea tonight, done in a safe way.\nCHECK: Confirm the title and author of the Clone book with Marcos before naming either.\nCHECK: The quote \"We can know more than we can tell\" is from The Tacit Dimension (1966). The page number is NOT confirmed, so do not cite a page on stage.\nSAY: Transition: Marcos, where does that knowledge go when it leaves?"}, {"label": "Where knowledge leaves", "notes": "SAY: This is Marcos's slide. No statistics. Knowledge leaves in three ways: people retire, companies downsize, and consultants finish a project and walk out with what they learned.\nSAY: Marcos can tell the consultant story. A consultant comes in for three months, six months, or a year, and leaves with the knowledge. Agile teams often keep little documentation. Waterfall documented everything. Much of that knowledge is now gone.\nSAY: It is spread everywhere. Once it is organized into five layers, you can build an AI system that helps.\nSAY (Marcos): Transition: And while it leaves, people are already pouring business knowledge into public tools."}, {"label": "Founders leak data", "notes": "SAY: Half of founders leak sensitive data to AI tools. People are already putting business knowledge into public tools. They are doing it the wrong way.\nSAY: Small businesses cannot hide behind size and funding the way large companies can. They cannot afford the same mistakes.\nCHECK: Confirmed on the source page: the survey is UK founders, 400+ respondents, and 1 in 2 admitted leaking sensitive information via chatbots in the last 30 days. Say \"UK founders\" out loud. Say nothing about whether paid tiers train on inputs.\nSAY: Transition: And when companies do adopt AI, they bolt it onto the old way of working."}, {"label": "Old workflows", "notes": "SAY: Most companies add AI to the old way of working. That is why a tool needs the expert's way of working built into it.\nCHECK: Confirmed on Deloitte State of AI in the Enterprise 2026: 3,235 leaders in 24 countries, fieldwork Aug to Sep 2025, published Jan 2026. 84% have not redesigned jobs around AI.\nSAY: Transition: The same Deloitte report names the biggest barrier."}, {"label": "Skills are the barrier", "notes": "SAY: Deloitte surveyed 3,235 leaders in 24 countries. Their finding: insufficient worker skills are the biggest barrier to integrating AI into existing workflows.\nSAY: Read it slowly. Skills. Not the tools. The people using them.\nSAY: That is why tonight starts with the expert. The knowledge has to be captured before it can be taught, to people or to machines.\nCHECK: This is the exact sentence from the report. Do not add a percentage. The report gives none for this line.\nCHECK: The event write-up says 2025 survey. Fieldwork ran Aug to Sep 2025 and the report was published Jan 2026. Both are true. Say: surveyed in 2025.\nSAY: Transition: So how do you capture it? Gartner says the fix is context, not clever prompts."}, {"label": "Context engineering", "notes": "SAY: Prompt engineering means you word each request. Context engineering means you build what the tool knows before anyone asks.\nSAY: Engineering here means organizing in layers. The tool grabs this first, then that, then listens to you. Think of a franchise recipe: the layers make the food taste the same every time.\nSAY: Gartner's forecast is about semantics, the agreed meaning of your business terms and data. Capturing your expert supplies part of that.\nCHECK: Confirmed: Gartner First Take, 28 July 2025, \"Lead the Shift to Context Engineering as Prompt Engineering Fades\".\nCHECK: Confirmed: Gartner press release, 11 May 2026. Organizations that prioritize semantics: up to 80% accuracy and 60% cost reduction by 2027 (analyst Rita Sallam). It is a prediction, so say \"Gartner predicts\". Do not say the five layers produce it.\nSAY: Transition: Where are companies using AI most today?"}, {"label": "Gartner heat map", "notes": "SAY: This graphic is Gartner's, shown unaltered. It shows where companies use generative AI most, by industry.\nSAY: Two uses sit closest to tonight: knowledge management and search, and conversational AI. In plain words: finding what the business knows and asking it questions.\nSAY: Real estate, marketing, and media services use AI heavily for content and flyers. Many of your own customers sit in these rows.\nCHECK: Read the color legend off the source before explaining the shading. Do not guess it.\nCHECK: The Gartner chart pages are paywalled, so the legend and chart ID could not be verified. Read the legend from your own licensed copy before the talk.\nSAY: Transition: Gartner groups what people need from AI into three verbs."}, {"label": "Ask Act Tell", "notes": "SAY: Gartner's Ask, Act, Tell. Ask is what we want to know. Act is decisions and actions. Tell is insights and communication.\nSAY: A well-built system can prepare you for a meeting, answer a question, or give you a report to hand to someone else. It uses data, semantics, and AI. We use this as a picture later.\nSAY: Gartner names three needs: Ask, Act and Tell. Semantics sits at the center where they overlap. Next: what context is made of.\nSAY: Every request to an AI is one of three things. Ask, act, or tell. Remember these three verbs. They come back in a few minutes with a fourth one.\nSAY: Transition: So what is context made of?"}, {"label": "Section: The What", "notes": "SAY: Transition. From how we capture to what it does.\nDO: Time check: about 15:00. The What runs to about 23:00."}, {"label": "Context equation", "notes": "SAY: Gartner says context engineering is in. Here is what context is made of. Intent times everything the agent is given equals context.\nSAY: The model brings general knowledge. Your systems bring data, state and history. Semantic structures give every term one shared meaning.\nSAY: One ingredient has no system behind it: tacit knowledge. It lives in the expert's head. The rest of tonight is about that box.\nDO: Point to the coral dashed box.\nCHECK: Gartner's framework names tacit knowledge itself. Do not say it is our addition. The redraw is ours.\nCHECK: The line about semantics giving every term one shared meaning is our reading of Gartner's diagram. The 80% and 60% on slide 12 are a Gartner prediction for 2027, not a measured result.\nSAY: Transition: Five layers are how we get that sixth ingredient out of the expert."}, {"label": "Capture to context", "notes": "SAY: This is how tribal knowledge gets into the equation. We ask the expert five kinds of questions. How we talk here. How we do it here. What happens next. Where the lines are. How we check the work.\nSAY: The output is context in the expert's own words, approved by the expert, and rechecked when conditions change.\nCHECK: Rechecked means revalidation: a model change, a prompt change, a data change, a rule change or elapsed time sends a rule back for re-approval.\nDO: Do not teach the layers here. Say we will build each one with a single example.\nSAY: We place each task in a Zone first. You will place yourself in one with the quiz in a few minutes.\nSAY: Transition: Where does each layer go in the agent? Think of a body."}, {"label": "Five parts of agent", "notes": "SAY: Think of the agent as a body. The expert fills five parts of it.\nSAY: Prompts are the voice. How we talk here, the words we use and the words we never use.\nSAY: Skills are muscle memory. Trained steps, done in the expert's order, without thinking.\nSAY: Agents are the nervous system. They sequence what happens next, so nothing gets dropped.\nSAY: Contracts are the immune system. They know what to reject and when to stop.\nSAY: Evaluation is the senses. They notice when something is off.\nSAY: The brain is the model. It stays general. The only part you can swap is the brain. Everything that makes it yours lives in the other five.\nSAY: Prompts, Skills and Agents may propose. Only Contracts authorize. Evaluation may block. Together, the five parts are the agent.\nPREP: If asked why Layer 3 is called Agents when the whole body is the agent: Layer 3 is the sequence, the nervous system. The agent is all five parts working together.\nPREP: If asked whether swapping the brain changes anything: yes, every rule goes back for re-approval when the model changes. That is revalidation.\nCHECK: The body idea follows an AI anatomy diagram of unknown source. The drawing is ours. Credit it if you find the source.\nDO: Hold this picture in your head. The body comes back for the four Zones.\nSAY: Transition: Here is the body at work on one call."}, {"label": "Agent answers", "notes": "SAY (Marcos): Marcos tells this as a story from the field. A junior at a property management company gets the call, opens the chat tool, and never has to find the expert.\nSAY: The agent reads the expert's context. It checks, does and says what the expert would. It stops where the expert stops.\nSAY: Each row came from a layer. The check and the steps from Skills. The booking from Agents. The wording from Prompts. The stop from Contracts.\nSAY: Before the answer leaves, Evaluation checks it against the expert's standard. It can send the work back.\nSAY: Same answers, same standards, expert in the room or not. That is the problem from the start of the talk, answered.\nCHECK: No dollar figures on this slide. Value is tracked in Layer 5: hours per week on the task today, KPIs and a 90 day success measure. Any number you add needs a source.\nDO: Tell them the next slides build this answer one layer at a time.\nSAY: Remember the three verbs. Ask, act, tell. Gartner gives three verbs. The expert adds a fourth: stop.\nSAY: Stop comes from Contracts, the immune system. That is the difference between a generic chatbot and a tool built on your expert.\nDO: Pause after the word stop. This is a line the room will repeat.\nSAY: Transition: And once you have this context, it feeds more than one tool."}, {"label": "One context many tools", "notes": "SAY: Five layers build one context. One context feeds many tools. The same knowledge that trains people also trains a machine to help people work the same way.\nSAY: I come from the training industry. This knowledge is not only for training humans. It is used to train machines to help humans.\nCHECK: This split is a design, not something shown in a client engagement yet. Say so. In rehearsal you said an AI application leans on layers 3 and 4 and a training course leans on layers 1, 2, and 5. Match that to the slide before saying it.\nSAY: Same five layers, many tools. A chat tool uses all five. An AI application leans on layers 3 and 4. A training course leans on layers 1, 2 and 5. This is how it works for all kinds of agents.\nSAY: Now the how: four steps to capture what your expert knows.\nDO: Time check: about 23:00. The How runs to about 47:00, including the quiz."}, {"label": "Section: The How", "notes": "SAY: Four steps. Step 1, list the tasks. Step 2, pick the right ones. Then you place yourself with the quiz. Step 3, the Zone check places each task. Step 4, the five layers.\nDO: Time check: about 23:00."}, {"label": "Step 1 List", "notes": "SAY: Think about a new hire's first month. What do you teach them? What to do next. What not to touch. What success looks like. How they know they are doing a good job.\nSAY: For each task, write down how often it happens, how much it matters, how hard it is, and where mistakes happen.\nSAY: Example 1. A property management office triages a maintenance call. Daily. High importance. Medium difficulty. The mistake is missing hidden water damage.\nSAY: Example 2. Approve a vendor invoice. Weekly. Medium importance. Low difficulty, you just sign. The mistake is paying the same bill twice.\nSAY: It sounds deceptively simple. Writing it down in this detail is the work.\nSAY: Transition: You cannot build everything at once. So which tasks go first?\nSAY: How hard means how long it took the expert to get good at it. That is the question from the invite."}, {"label": "Step 2 Pick", "notes": "SAY: Put the tasks on a risk and frequency matrix. Start with frequent and lower risk.\nSAY: Frequent and high risk: the expert decides and the tool brings sources. Rare and high risk stays with the expert. Rare and lower risk comes later.\nSAY: Not every task gets automated. This matrix is why. Rare and high risk stays with the expert.\nSAY: Transition: We have the right tasks. Before we place a task in a Zone, I want you to place yourself."}, {"label": "Section: Place yourself", "notes": "SAY: We just picked the right tasks. Before we place a task, place yourself.\nSAY: Answer for how you actually work today, not how you wish you worked. There are no wrong answers.\nSAY: Your answers are anonymous. Each of you sees your own result on your phone. The screen shows only the room's totals.\nDO: Time check: about 27:00. The quiz takes about six minutes with the room.\nSAY: Transition: Phones out. Here is the code."}, {"label": "Scan to start the quiz", "notes": "SAY: Scan the code or type the link. Twelve questions. Your answers are anonymous.\nDO: Before the talk, open drdataevents.netlify.app/screen in a second tab, press C, and enter the host key. Reset the session there before the room joins.\nDO: Switch to the screen tab. Wait until the joined count stops climbing. Press the right arrow for each question. Give the room a few seconds. The bars move as people tap.\nSAY: Watch the bars. This is the room, live.\nSAY: While they answer Q4: this one asks if you could write down your rules. That is Layer 2, Skills.\nSAY: Q5 asks if AI meets your standard. That is Layer 1, the voice. Q6 asks how you check it. That is Layer 5, the senses. Q7 asks where the line is. That is Layer 4, the immune system.\nSAY: You just answered questions from four of the five layers without knowing it.\nDO: After question 12, press Results. Read the four Zone percentages and write them down before you switch back.\nPREP: If someone joins late, their phone says it needs the first eight answers and links to the full quiz on the website.\nPREP: If the live quiz fails, send the room to drdatadecisionintelligence.com/find-your-zone and keep going. The next slide works without numbers.\nSAY: Transition: Let us see where this room landed."}, {"label": "Four Zones", "notes": "DO: Read the room's numbers from the live screen. Fill in the brackets out loud.\nSAY: [n] percent of this room is Below the Zone. You know the rules, and you still do the work by hand. That is time an expert should not spend. Below the Zone is reflex. Reflexes are what we hand to the machine. The mode is Encode.\nSAY: [n] percent is Inside. You and AI work in harmony. That is skilled judgment. We protect it. The mode is Assist: AI gathers and drafts, you decide.\nSAY: [n] percent is Above. You lean on AI for knowledge you do not have yet. That is calling a specialist. Fair, as long as you see its sources. The mode is Research.\nSAY: [n] percent is Oscillating. You are learning. Clumsy at first, then smoother. That is a good place to be. The mode is Learn.\nSAY: Look at your own phone. Your mix matters more than your label. Work rarely sits in one Zone.\nPREP: If asked whether Below is bad: no. Below means you know the rules. It is the easiest work to hand off, and the fastest win.\nPREP: If asked whether the quiz is scientific: it is a self-check, not a test. The Zone check with the expert is the real placement, task by task.\nSAY: Transition: The quiz placed you. Now we place a task, with the expert."}, {"label": "Step 3 Zone check", "notes": "SAY: Same four Zones. Now we use them on one task, with the expert in the room.\nSAY: Below means the expert can state the rule, and does it the same way every time. That is what we automate first. Encode it.\nSAY: Inside is the expert's judgment. We protect it. The tool gathers and drafts. The expert decides. Assist it.\nSAY: Above goes past what the expert can call with confidence. The tool brings cited research. Research it.\nSAY: Oscillating means the expert's answer is still forming. The tool shows the past choices side by side and asks for a reason. Learn it.\nSAY: Every Zone gets built, each in its own mode. Nothing is left out because it is hard. It is just built more carefully.\nSAY: Zones expire and get rechecked, because the work, the staff and the business change.\nPREP: If asked who decides the Zone: the expert, in the interview. We ask them to state the rule, the exceptions and recent examples, and we ask again in a later session to see if the answer holds.\nSAY: Transition: The Zone does one more job. It tells the agent how to behave."}, {"label": "Zone sets the mode", "notes": "SAY: The title tonight is five layers between expertise and agents. This is where they meet.\nSAY: Encode runs the expert's rule. It never changes the rule.\nSAY: Assist gathers, drafts, shows past cases. It never makes the judgment call.\nSAY: Research brings cited sources and says what it does not know. It never presents a conclusion as a decision.\nSAY: Learn shows its reasoning and examples, and asks the person to decide and say why. It never decides silently.\nSAY: The Zone tells the agent how far it may go. The five layers tell it what to know.\nPREP: If asked whether the expert can let a task run further: yes. The expert sets how far each task may run, and signs it. The tool never decides that for itself.\nSAY: Transition: Now the part I want you to take home. Same call. Two people."}, {"label": "Same call two Zones", "notes": "SAY: Here is the turn. The same call sits in two Zones, depending on who takes it.\nSAY: For the expert, it is routine. She has handled it hundreds of times. Below the Zone. Her steps run, in her order. She gets her time back.\nSAY: For the junior, it is past his skills. He has handled it twice. Above the Zone. The tool teaches him with her reasoning, and he makes the call.\nSAY: Over time he moves to Oscillating, then Inside. That is apprenticeship, every day, even when she is out.\nSAY: One system serves both of them, built on her rules.\nDO: Pause on this slide. Let it land. It is the idea the room takes home.\nSAY: You will see in a few minutes that research found the newest people gain the most from a tool like this.\nSAY: Transition: So what goes into her rules? Five things. The same five you teach a new hire.\nDO: Time check: about 40:00."}, {"label": "Section: Five layers", "notes": "SAY: Transition into the heart of the talk. Slow down from here. Think about a new hire's first month. What do you teach them? How we talk to customers. How we do the job. What happens next. Where the lines are. How we check the work.\nSAY: You know how far the agent may go. Now, what it needs to know."}, {"label": "Five layers defined", "notes": "SAY: This is the slide you came for. Five layers. Each one is a question you ask the expert, a part of the body, and a part of the agent.\nSAY: Layer 1, Prompts. How do we talk here? The voice. In the agent, its voice and the words it never uses.\nSAY: Layer 2, Skills. How do we do it here? Muscle memory. In the agent, the steps and rules it can run.\nSAY: Layer 3, Agents. What happens next? The nervous system. In the agent, the sequence and the hand-offs between steps.\nSAY: Layer 4, Contracts. Where are the lines? The immune system. In the agent, approvals, limits, privacy, and stop.\nSAY: Layer 5, Evaluation. How do we check the work? The senses. In the agent, checks against the expert's standard.\nSAY: Point to the footer. Layers 3 and 4 are what make many agents safe later. Every hand-off is written down, and every agent shares the same immune system.\nCHECK: Say 'later'. Today a person or a signed sequence sits between agents. Do not say agents hand work to each other on their own.\nSAY: You teach a new hire these same five things in their first month. Tonight we write them down so a tool can use them.\nSAY: Transition: Now we build the body, one layer at a time, with one call.\nDO: Time check: about 41:00."}, {"label": "Layer 1 Talk", "notes": "SAY: Layer 1, Prompts: how we talk here. The junior calls the manager: \"Tenant says water under the sink. What do I do?\"\nSAY: The expert says: \"We never tell a tenant it is an emergency. We say we are sending someone today.\"\nSAY: The tool sounds like you, not like a robot. Explain the nine or ten things customers call about. Include the words you never use.\nSAY: In the body, this is the voice.\nSAY: Transition: The voice is right. Now the steps.\nDO: Point to the body in the corner. One more part lights up on each layer slide."}, {"label": "Layer 2 Do", "notes": "SAY: Layer 2, Skills: how we do it here. Named steps, in the expert's order. Is it the supply line or the drain? Is the water spreading? Shut off the supply valve. Book the plumber for today.\nSAY: Six or seven steps. Whatever tool you build the agent in needs the steps, in order.\nSAY: In the body, this is muscle memory. Trained steps, in order, without thinking. That is Below the Zone work for the expert.\nSAY: Transition: The leak is handled. What happens next?\nDO: Point to the body in the corner. One more part lights up on each layer slide."}, {"label": "Layer 3 Next", "notes": "SAY: Layer 3, Agents: what happens next. Plumber booked. Tenant told. Ticket logged. Follow up tomorrow.\nSAY: New hires fix the problem and forget the follow-up. The expert knows the whole chain. The tool proposes each next move so nothing is dropped.\nSAY: In the body, this is the nervous system. It carries the work from one step to the next.\nSAY: Transition: And where does the tool stop?\nDO: Point to the body in the corner. One more part lights up on each layer slide."}, {"label": "Layer 4 Lines", "notes": "SAY: Layer 4, Contracts: where the lines are. Four answers: do it, do it smaller, bring it to me, stop.\nSAY: Ceiling damage is the line here. The expert inspects it personally. Approvals expire because the business changes, so each one has an end date and gets reviewed.\nSAY: In the body, this is the immune system. This is where the fourth verb lives. Stop.\nSAY: Transition: Last layer. How do we know it stays right?\nDO: Point to the body in the corner. One more part lights up on each layer slide."}, {"label": "Layer 5 Check", "notes": "SAY: Layer 5, Evaluation: how we check the work. You check a new hire's work for the first few months. The tool gets the same treatment.\nSAY: Check the answer against the expert. If it matches, fine. If an answer drifts, it is blocked and fixed before it reaches anyone.\nSAY: An error raises an alert. The tool never continues silently, as if nothing happened.\nSAY: In the body, these are the senses. They notice when something is off.\nSAY: Transition: One rule ties all five together.\nDO: Point to the body in the corner. One more part lights up on each layer slide.\nSAY: The whole body is lit. That is the agent. Five layers, built from one expert."}, {"label": "Who decides", "notes": "SAY: One rule ties the layers together. Prompts, Skills, and Agents may propose. Only Contracts may authorize. Evaluation may block.\nSAY: The check layer may say no at any time. That is why the tool cannot talk itself into something risky. Suggesting and approving are separate jobs.\nSAY: Human in the loop. Suggesting and approving are separate jobs, so nobody steps on anyone's toes.\nSAY: Transition: Same pattern, three more jobs."}, {"label": "Section: In Use", "notes": "SAY: Three more jobs, same pattern: check, do, say, stop. The property manager one you already saw.\nDO: Time check: about 47:00. In Use runs to about 51:00."}, {"label": "Estimator", "notes": "SAY: Estimator. The client wants to move a window. How do I price it? The tool checks whether the framing is already up.\nSAY: It says: price it as a change order with a labor and material split. Say this change affects cost and schedule, and approval is needed before work.\nSAY: Stop line: if it touches the structure, bring it to the estimator.\nSAY: A contractor or subcontracting team. The client says move the window. The tool shows what to check, what to say, and where to stop: if it touches the structure, bring it to the estimator. You cannot decide that on your own.\nSAY: For the senior estimator, pricing a change order is routine. Below the Zone. Encode. For a new estimator it is Above. The tool shows why the labor and material split matters."}, {"label": "Energy assessor", "notes": "SAY: Energy assessor. The house came back high on air leakage. Do I recommend sealing first? The tool checks the blower door reading and attic access.\nSAY: It lists the sealing steps in order and gives a plan the homeowner can follow.\nSAY: Stop line: if a combustion appliance is involved, stop. Do not do anything. Call me.\nSAY: Add trade jargon here if it helps the room. The stop line: combustion appliances involved, stop and call me.\nSAY: The stop line is the immune system again. Combustion appliances. Stop and call me."}, {"label": "IT support desk", "notes": "SAY: IT support desk. The user cannot log in after a password reset. The tool checks whether the account is locked and which device is trying.\nSAY: It says: clear the lockout and have them sign in again. This is live chat without waiting on a manager or supervisor.\nSAY: Same context, a different application. If the bot can handle it, it handles it. Login from a new location goes to the lead.\nSAY: One context, many applications.\nSAY: Transition: So what does the junior get from all this?"}, {"label": "What the junior gets", "notes": "SAY: What the junior gets: answers without pulling the expert away. Repeated discussions drop. Work continues. It is apprenticeship, every day.\nSAY: This is performance support at the moment of the task. It saves expert time and saves discussions.\nSAY: The word is apprenticeship. Derek's reaction: continuous learning and growth. Use that.\nSAY: This is the same call, two Zones, at team scale. The expert's Below work becomes the junior's Learn.\nSAY: Transition: Is there research behind this? Yes."}, {"label": "Research", "notes": "SAY: A study of 5,179 customer support agents. An AI tool built from top agents' conversations raised productivity 34% for the newest agents, with little change for the most experienced. The tool passed the experts' know-how to the newcomers. If asked: the average gain across everyone was 14%.\nSAY: This was a customer support chat tool, not ours. It matches tonight's idea: capture what the best people do, and the newest people gain the most.\nSAY: The gap between the 34% and the average explains the knowledge gap between newer and more experienced agents. Where there is a gap, capture from a very good expert, and everyone learns from each other.\nCHECK: Derek found the first version confusing until it was explained out loud, so the slide was reworded. Say the average of 14% only if asked. The study dates from 2023 as a working paper. Zubia offered to look for something more recent.\nCHECK: Confirmed: Brynjolfsson, Li and Raymond, \"Generative AI at Work\", NBER w31161, published in the Quarterly Journal of Economics 140(2), 889-942, 2025. 5,179 agents, 14% average gain, 34% for novices, minimal effect on experienced agents.\nSAY: The newest people gained the most. That is the Learn mode at work: the expert's know-how passed to newcomers.\nCHECK: This was a customer support tool in a published study, not a Dr. Data system. Say that plainly.\nSAY: Transition: Building the tool is half the job. Marcos, how do teams actually adopt it?"}, {"label": "Section: Adoption", "notes": "SAY: Transition. Hand over to Marcos for adoption.\nCHECK: Marcos asked for larger type on his slides.\nDO: Time check: about 51:00. Marcos's section runs to about 56:00."}, {"label": "Adoption (Marcos)", "notes": "SAY (Marcos): Prosci studied 1,107 professionals across frontline employees, team leaders, and executives. 63% of AI implementation challenges stem from human factors, not technical limitations. The slide says 6 in 10.\nSAY (Marcos): Building the tool is the easy part. Getting people to use it is the hard part.\nCHECK: Confirmed on the Prosci page: 1,107 professionals, 63% of AI implementation challenges stem from human factors, and user proficiency at 38% is the largest single category. No fieldwork dates are given, so do not quote one.\nCHECK: A related Prosci page words the 63% differently. Read from the page the slide cites. Do not use the walkthrough paraphrase about onboarding support.\nSAY (Marcos): Transition: So who sets the pace?"}, {"label": "Managers set the pace", "notes": "SAY (Marcos): Gallup's AI indicator, as of May 2026. Employees whose manager strongly supports their team's use of AI are 1.7 times as likely to use it a few times a week or more. Only 36% strongly agree their manager does.\nSAY (Marcos): Competent teams often know how to use the tool. Accountability is what makes the difference. Track adoption: how many days a week people use it.\nSAY (Marcos): Working benchmark: five days a week for three to four weeks. Call it a working number, not a study result.\nSAY (Marcos): Marcos's onboarding means working with the managers and the team members. Coach managers to support their team, and coach the team to use the tool daily. The application itself should prompt a small daily check, five things to do each day.\nCHECK: Marcos asked where adoption sits. It is near the end. The notes for Marcos's section are on these slides.\nCHECK: Confirmed on Gallup AI indicator, May 2026: 36% strongly agree their manager supports AI use, and those employees are 1.7 times as likely to use AI a few times a week or more.\nSAY (Marcos): Transition: And fit with the work matters just as much."}, {"label": "Fit with the work", "notes": "SAY (Marcos): Systems built around the job get used. Gallup, February 2026. Among employees who strongly agree that AI integrates well with the systems and processes they use at work, 88% use AI frequently. Among those who do not strongly agree, 55%. Read it as two groups. They do not add to 100.\nSAY (Marcos): Design around the job, not around the tool. Tool-centered subscriptions wear people out. A tool built for how a person works is the one they keep using. We have a real estate client who loves hers for exactly that reason.\nCHECK: Derek asked, 88% of what population and 55% of what? The slide now says two different groups, so they do not add to 100. Be ready to say it in one sentence.\nCHECK: Confirmed: Gallup study fielded Feb 4 to 19, 2026, published Apr 12, 2026. 23,717 U.S. employees, margin of error plus or minus 0.9. 88% vs 55% frequent use, split by whether AI integrates well with systems and processes.\nSAY (Marcos): Transition: Which brings us to one rule."}, {"label": "Build around the job", "notes": "SAY (Marcos): Short close for his section. A tool built from the expert's own way of working gets used.\nSAY: The expert's knowledge becomes a tool the whole team can use. That only works when the knowledge is elicited the right way before the tool is built.\nSAY (Marcos): Start from the task, then pick the tool. Do not start by picking a tool and then looking for a task.\nSAY (Marcos): Transition: Zubia, bring it home."}, {"label": "Safe from the start", "notes": "SAY: The invite promised we would close on safety. Here it is. The immune system is built in from the start, not added after.\nSAY: Private models on your own machine. Remember the founders who leak data to public tools? Your expert's rules never go there.\nSAY: Sensitive fields are marked and masked before anything is analyzed.\nSAY: A person approves what matters. Every decision is logged with a record you can check. One switch stops every agent.\nSAY: And rules go back for re-approval when the model, the data, or the business changes.\nSAY: AI automates the workflow once it is written down. It does not replace the expertise that built it.\nCHECK: Do not say compliant with any named regulation. Describe what the system does.\nDO: Time check: about 55:00.\nSAY: Transition: Let us put the whole story together."}, {"label": "Recap", "notes": "SAY: Five steps. We pick the task and run the Zone check. We capture it in five layers. The tacit knowledge joins the rest of the context. The chat tool answers as the expert would. The team adopts it.\nSAY: The expert's knowledge becomes a tool the whole team can use.\nSAY: Value is tracked in Layer 5, so the owner sees the result.\nDO: Walk left to right and use the property manager row.\nDO: Hand back to Marcos only if he has a closing point. Otherwise go to thank you.\nSAY: In our example, the maintenance call is Below the Zone for the expert. She can state the rule. So it runs in Encode.\nDO: Time check: about 56:00."}, {"label": "Close", "notes": "SAY: Remember the person who just knows? The one who answered questions on vacation?\nSAY: Her rules now run the routine work. Her judgment is protected. The junior learns from her every day, even when she is out.\nSAY: Next time, she takes the vacation.\nDO: Pause. Smile. Let the room react.\nSAY: Thank you. If you missed the quiz, the link is on the slide. It takes three minutes.\nSAY: SPIN will share the slides.\nSAY: Marcos closes with his own reason for doing this work, in his own words.\nSAY: Why this matters for a small business. Owners are understaffed and overworked, and a lot of admin is repetitive. Encoding the expert keeps the knowledge when an owner sells the business, hands it to family, or takes a vacation."}, {"label": "Questions", "notes": "SAY: Open the floor. No time box. Derek asked to remove the five minutes so questions can run as long as they need.\nPREP: Likely questions from rehearsal. What is the difference between context engineering and prompt engineering? Why does this matter for small businesses? Could a recruiting company use this? Answer: yes, some firms capture knowledge well but do not build the tool, and we do both.\nPREP: Marcos's rehearsal feedback: steady pace, it guides the audience to a picture of the five layers, and it is simple to explain to almost anyone.\nPREP: Can one person be in different Zones? Yes. Work rarely sits in one Zone. Your quiz result shows your mix. The Zone check places each task.\nPREP: Why not automate the Inside work too? Inside is the expert's judgment. We protect it. The expert can choose to let a task run further, task by task, and signs that choice.\nPREP: Is Above the Zone dangerous? Only when you act on answers you cannot check. In Research mode the tool shows its sources and its uncertainty, and you decide.\nPREP: What happens if the expert leaves before the capture? Start with the highest-frequency tasks now. Every captured rule stays with the business.\nPREP: Does our data leave the building? Our systems run on private, local models. Say what the system does. Do not claim compliance with any named regulation.\nPREP: How long does capture take? Say it depends on the number of tasks. Do not give a number you cannot source."}]; var i=0, t0=Date.now(), fs=24, linked=false, lastSeq=null, remoteOk=false; if(window.innerWidth<600) fs=19;
