<div class="top"><div class="brand"><img src="/live/mascot.png" alt=""><div><div class="name">Dr. Data Decision Intelligence</div><div class="tag2" style="font-size:11px;letter-spacing:.12em;color:var(--teal);font-weight:600;text-transform:uppercase">Presenter notes</div></div></div>

<script>
(function(){
 var D=[{"label": "Title", "notes": "SAY: Tonight you will learn how to encode an expert in a private chat tool. Every example is one task, start to finish.\nSAY: Introduce yourself, then hand to Marcos to introduce himself. Marcos asked for larger type on his slides because small text is hard for him to read on screen.\nCHECK: Marcos's name is in bold with his business name."}, {"label": "Speakers", "notes": "SAY: Two sentences each. Zubia first, then Marcos introduces himself in his own words.\nCHECK: Both bios are drafts. Confirm them with Marcos and Derek. Marcos's first sentence is a best reading of his business."}, {"label": "Agenda", "notes": "SAY: This is a lecture. Questions come at the end. There is one hands-up quiz in the middle, and it runs on your phones.\nSAY: I keep the slides simple and clean on purpose, so we can talk through each one."}, {"label": "One person who just knows", "notes": "SAY: Every team has one person who just knows. That person holds the tribal knowledge, the secret sauce, and the judgment. Picture that person on your own team.\nSAY: Hold for a few seconds. Let the room think of a name."}, {"label": "Decide and train", "notes": "SAY: That person is trusted to decide, and is required to train everyone else. Two jobs, and the second one never ends. Every new hire, every question, every day.\nSAY: Experts are special because they can call the shots and because they can train other people. Expertise runs from beginner to advanced to expert."}, {"label": "Work the same way", "notes": "SAY: A franchise works because every location makes the same food. Marcos's example: a burger in Milwaukee should taste the same as one in Madison.\nSAY: A business with one expert needs the same consistency. Same answers, same standards, whether the expert is in the room or not.\nCHECK: Marcos tells the McDonald's example in his own words. Use a generic restaurant if you prefer not to name a brand on the slide."}, {"label": "Section: The Why", "notes": "SAY: Transition. One breath, then move on. The Why comes first: why the expert's knowledge is the missing piece."}, {"label": "Knowledge walks out", "notes": "SAY: Michael Polanyi wrote: \"We can know more than we can tell.\" Tacit knowledge is known but never written down. Say that once in plain words.\nSAY: Marcos can add a story. He has read a book called Clone, about a person who built agents to clone himself and cut hours and days of mundane work. That is the idea tonight, done in a safe way.\nCHECK: Verify the quote and page before the talk. The published sentence is \"We can know more than we can tell.\" (page 4, University of Chicago Press edition). The slide uses that wording.\nCHECK: Confirm the title and author of the Clone book with Marcos before naming either."}, {"label": "Where knowledge leaves", "notes": "SAY: This is Marcos's slide. No statistics. Knowledge leaves in three ways: people retire, companies downsize, and consultants finish a project and walk out with what they learned.\nSAY: Marcos can tell the consultant story. A consultant comes in for three months, six months, or a year, and leaves with the knowledge. Agile teams often keep little documentation. Waterfall documented everything. Much of that knowledge is now gone.\nSAY: It is spread everywhere. Once it is organized into five layers, you can build an AI system that helps."}, {"label": "Founders leak data", "notes": "SAY: Half of founders leak sensitive data to AI tools. People are already putting business knowledge into public tools. They are doing it the wrong way.\nSAY: Small businesses cannot hide behind size and funding the way large companies can. They cannot afford the same mistakes.\nCHECK: Check the survey region and sample on the source page before quoting the figure. Say nothing about whether paid tiers train on inputs."}, {"label": "Old workflows", "notes": "SAY: Most companies add AI to the old way of working. That is why a tool needs the expert's way of working built into it.\nCHECK: Fieldwork was Aug to Sep 2025, published Jan 2026. Quote the figure exactly as the slide shows it."}, {"label": "Context engineering", "notes": "SAY: Prompt engineering means you word each request. Context engineering means you build what the tool knows before anyone asks.\nSAY: Engineering here means organizing in layers. The tool grabs this first, then that, then listens to you. Think of a franchise recipe: the layers make the food taste the same every time.\nSAY: Gartner's forecast is about semantics, the agreed meaning of your business terms and data. Capturing your expert supplies part of that.\nCHECK: Do not say the five layers produce Gartner's 80%. Confirm the Gartner First Take wording first.\nCHECK: The 80% accuracy and 60% cost figures match the Gartner press release of May 11, 2026."}, {"label": "Gartner heat map", "notes": "SAY: This graphic is Gartner's, shown unaltered. It shows where companies use generative AI most, by industry.\nSAY: Two uses sit closest to tonight: knowledge management and search, and conversational AI. In plain words: finding what the business knows and asking it questions.\nSAY: Real estate, marketing, and media services use AI heavily for content and flyers. Many of your own customers sit in these rows.\nCHECK: Read the color legend off the source before explaining the shading. Do not guess it."}, {"label": "Ask Act Tell", "notes": "SAY: Gartner's Ask, Act, Tell. Ask is what we want to know. Act is decisions and actions. Tell is insights and communication.\nSAY: A well-built system can prepare you for a meeting, answer a question, or give you a report to hand to someone else. It uses data, semantics, and AI. We use this as a picture later."}, {"label": "How AI gets context", "notes": "SAY: Walk the boxes left to right. Intent is what the person is trying to get done. Any AI already has the general knowledge. Your systems hold your data.\nSAY: This talk is about how to build that context from your expert.\nCHECK: The formula is simplified from Gartner's. Say that it is simplified."}, {"label": "Tacit is missing", "notes": "SAY: Your systems hold the records. The judgment is in the expert's head. That is the biggest gap today.\nSAY: It is not only a gap. People are filling it the wrong way, by pasting what the expert knows into public tools.\nSAY: A chat tool built from captured knowledge gives continuity. The expert does not have to be in every conversation at the same time."}, {"label": "Section: The How", "notes": "SAY: Four steps. Steps 1 to 3 first: list the tasks, pick the right tasks, run the Zone check. Then the quiz. Then step 4, the five layers."}, {"label": "Step 1 List", "notes": "SAY: Think about a new hire's first month. What do you teach them? What to do next. What not to touch. What success looks like. How they know they are doing a good job.\nSAY: For each task, write down how often it happens, how much it matters, how hard it is, and where mistakes happen.\nSAY: Example 1. A restoration company triages a leak call. Daily. High importance. Medium difficulty. The mistake is missing hidden water damage.\nSAY: Example 2. Approve a vendor invoice. Weekly. Medium importance. Low difficulty, you just sign. The mistake is paying the same bill twice.\nSAY: It sounds deceptively simple. Writing it down in this detail is the work."}, {"label": "Step 2 Pick", "notes": "SAY: Put the tasks on a risk and frequency matrix. Start with frequent and lower risk.\nSAY: Frequent and high risk: the expert decides and the tool brings sources. Rare and high risk stays with the expert. Rare and lower risk comes later."}, {"label": "Step 3 Zone check", "notes": "SAY: The Zone check runs on a task, not on a person. We run it before the task goes to the tool, to see whether it is ready.\nSAY: Inside is ready to hand off. Above goes past what the expert can call with confidence. Oscillating means the answer changes from one session to the next. Below needs one plain sentence.\nSAY: If a task is not ready, capture more from the expert or leave it out. Inside is the only state we build. Zone assignments expire and get rechecked because the work and the business change.\nSAY: The goal is to bring your tasks inside the zone so you and AI work together.\nCHECK: Settle one sentence for Below. The rehearsal explained it three different ways. Do not improvise it on stage."}, {"label": "Two zones", "notes": "SAY: Two tools with similar names. Keep them apart. The quiz is for you and shows which job to hand off. The Zone check is for each task and shows whether it is ready.\nCHECK: The quiz result uses the word zone as well. In the room, either call the quiz result your starting point or match the website wording."}, {"label": "Section: The quiz", "notes": "SAY: Transition into the live quiz. Everyone take out your phones. Twelve questions, about three minutes. The next slide has the QR code."}, {"label": "Scan to start the quiz", "notes": "SAY: Scan the code or type the link. Your answers are anonymous. Each person sees their own result on their own phone. The screen shows only the room's totals.\nDO: Before the talk, open drdataevents.netlify.app/screen in a second browser tab, press C, and enter the host key. Switch to that tab. It shows the same QR code and the joined count.\nDO: Press the right arrow for each question. Give the room a few seconds to answer. The bars move as people tap. After question 12, press Results.\nSAY: A sample result reads: Below the zone. Your expertise is spending time on execution. A lot of your week goes to writing follow-ups, drafting proposals, and keeping up with content. Each of these can run on your rules in your voice. Start with one job.\nSAY: Three questions line up with the layers. Q5 (does it sound like you) is Layer 1. Q6 (do you check the result) is Layer 5. Q7 (is there a clear line) is Layer 4.\nSAY: When you are done, return to the deck and say: \"Now I will show you how that one job gets captured.\""}, {"label": "Section: Five layers", "notes": "SAY: Transition into the heart of the talk. Slow down from here. Think about a new hire's first month. What do you teach them? How we talk to customers. How we do the job. What happens next. Where the lines are. How we check the work."}, {"label": "Five things", "notes": "SAY: This is the heart of the talk. You already teach people these five things. Tonight we write them down so a tool can use them.\nSAY: Prompts, Skills, Agents, Contracts, Evaluation. When you teach a new hire, that is what you are doing."}, {"label": "Layer 1 Talk", "notes": "SAY: Layer 1, Prompts: how we talk here. The junior calls the manager: \"Tenant says water under the sink. What do I do?\"\nSAY: The expert says: \"We never tell a tenant it is an emergency. We say we are sending someone today.\"\nSAY: The tool sounds like you, not like a robot. Explain the nine or ten things customers call about. Include the words you never use."}, {"label": "Layer 2 Do", "notes": "SAY: Layer 2, Skills: how we do it here. Named steps, in the expert's order. Is it the supply line or the drain? Is the water spreading? Shut off the supply valve. Book the plumber for today.\nSAY: Six or seven steps. Whatever tool you build the agent in needs the steps, in order."}, {"label": "Layer 3 Next", "notes": "SAY: Layer 3, Agents: what happens next. Plumber booked. Tenant told. Ticket logged. Follow up tomorrow.\nSAY: New hires fix the problem and forget the follow-up. The expert knows the whole chain. The tool proposes each next move so nothing is dropped."}, {"label": "Layer 4 Lines", "notes": "SAY: Layer 4, Contracts: where the lines are. Four answers: do it, do it smaller, bring it to me, stop.\nSAY: Ceiling damage is the line here. The expert inspects it personally. Approvals expire because the business changes, so each one has an end date and gets reviewed."}, {"label": "Layer 5 Check", "notes": "SAY: Layer 5, Evaluation: how we check the work. You check a new hire's work for the first few months. The tool gets the same treatment.\nSAY: Check the answer against the expert. If it matches, fine. If an answer drifts, it is blocked and fixed before it reaches anyone.\nSAY: An error raises an alert. The tool never continues silently, as if nothing happened."}, {"label": "Who decides", "notes": "SAY: One rule ties the layers together. Prompts, Skills, and Agents may propose. Only Contracts may authorize. Evaluation may block.\nSAY: The check layer may say no at any time. That is why the tool cannot talk itself into something risky. Suggesting and approving are separate jobs."}, {"label": "Your turn", "notes": "SAY: Your turn. Pick one task your expert does every day or every week. What would they teach? How we talk, how we do it, what happens next, where the lines are, how we check.\nDO: Give them a full minute of quiet. Take one volunteer."}, {"label": "Section: The What", "notes": "SAY: Transition. From how we capture to what it does."}, {"label": "Check Do Say", "notes": "SAY: Every answer the tool gives follows this order. First it checks. Then it says what to do. Then it gives the words to say.\nSAY: Think of it as ask, act, tell. You ask. The tool checks the sources and gives you an answer. You act on it. You share the result with other people."}, {"label": "Chat assistant mapping", "notes": "SAY: This is our mapping, not Gartner's. I took Gartner's circles and mapped our layers onto them to show what happens behind a chat tool.\nSAY: The expert's own words sit at the center. The dashed ring is Evaluation, which checks all of it. Ask draws on sources and cues. Act uses skills, agents, and contracts. Prompts are voice and words.\nSAY: This gives you a glass box. You can see why the tool answered the way it did, and the answer shows its source."}, {"label": "One context many tools", "notes": "SAY: Five layers build one context. One context feeds many tools. The same knowledge that trains people also trains a machine to help people work the same way.\nSAY: I come from the training industry. This knowledge is not only for training humans. It is used to train machines to help humans.\nCHECK: This split is a design, not something shown in a client engagement yet. Say so. In rehearsal you said an AI application leans on layers 3 and 4 and a training course leans on layers 1, 2, and 5. Match that to the slide before saying it."}, {"label": "Section: In Use", "notes": "SAY: Transition. Four short examples. Each one is one task, same pattern: the question, what the tool checks, what it says to do, and where it stops."}, {"label": "Property manager", "notes": "SAY: Property manager. The tenant says water under the sink. The tool asks: supply line or drain? Is the water spreading? Then it says: shut off the supply valve, book the plumber for today.\nSAY: Stop line: if there is ceiling damage, bring it to the manager.\nSAY: This is a chat. The junior never has to find the expert."}, {"label": "Estimator", "notes": "SAY: Estimator. The client wants to move a window. How do I price it? The tool checks whether the framing is already up.\nSAY: It says: price it as a change order with a labor and material split. Say this change affects cost and schedule, and approval is needed before work.\nSAY: Stop line: if it touches the structure, bring it to the estimator."}, {"label": "Energy assessor", "notes": "SAY: Energy assessor. The house came back high on air leakage. Do I recommend sealing first? The tool checks the blower door reading and attic access.\nSAY: It lists the sealing steps in order and gives a plan the homeowner can follow.\nSAY: Stop line: if a combustion appliance is involved, stop. Do not do anything. Call me."}, {"label": "IT support desk", "notes": "SAY: IT support desk. The user cannot log in after a password reset. The tool checks whether the account is locked and which device is trying.\nSAY: It says: clear the lockout and have them sign in again. This is live chat without waiting on a manager or supervisor."}, {"label": "What the junior gets", "notes": "SAY: What the junior gets: answers without pulling the expert away. Repeated discussions drop. Work continues. It is apprenticeship, every day.\nSAY: This is performance support at the moment of the task. It saves expert time and saves discussions."}, {"label": "Research", "notes": "SAY: A study of 5,179 customer support agents. An AI tool built from top agents' conversations raised productivity 14% on average and 34% for novices, with minimal effect on experienced agents.\nSAY: This was a customer support chat tool, not ours. It matches tonight's idea: capture what the best people do, and the newest people gain the most.\nCHECK: Confirm the author names, the journal, and the year before saying them. In rehearsal you said it appeared in the Quarterly Journal of Economics last year."}, {"label": "Section: Adoption", "notes": "SAY: Transition. Hand over to Marcos for adoption.\nCHECK: Marcos asked for larger type on his slides."}, {"label": "Adoption (Marcos)", "notes": "SAY (Marcos): Prosci studied 1,107 professionals across frontline employees, team leaders, and executives. 63% of AI implementation challenges stem from human factors, not technical limitations.\nSAY (Marcos): Building the tool is the easy part. Getting people to use it is the hard part.\nCHECK: Prosci reports 63% from research with 1,107 professionals. In rehearsal the biggest single factor was read out as user proficiency at 38%. Confirm that figure against the source before Marcos says it."}, {"label": "Managers set the pace", "notes": "SAY (Marcos): Gallup's AI indicator, as of May 2026. Employees whose manager strongly supports their team's use of AI are 1.7 times as likely to use it weekly. Only 36% strongly agree their manager does.\nSAY (Marcos): Competent teams often know how to use the tool. Accountability is what makes the difference. Track adoption: how many days a week people use it.\nSAY (Marcos): Working benchmark: five days a week for three to four weeks. Call it a working number, not a study result.\nCHECK: Gallup's wording for 36% is confirmed. Confirm the 1.7 times wording against Gallup before quoting it."}, {"label": "Fit with the work", "notes": "SAY (Marcos): Systems built around the job get used. Gallup, February 2026. Among employees who strongly agree that AI integrates well with the systems and processes they use at work, 88% use AI frequently. Among those who do not strongly agree, 55%.\nSAY (Marcos): Design around the job, not around the tool. Tool-centered subscriptions wear people out. A tool built for how a person works is the one they keep using. We have a real estate client who loves hers for exactly that reason.\nCHECK: The bar labels match Gallup's wording. Confirm the sample size (rehearsal said 23,717 US employees) against the source."}, {"label": "Build around the job", "notes": "SAY (Marcos): Short close for his section. A tool built from the expert's own way of working gets used.\nSAY: The expert's knowledge becomes a tool the whole team can use. That only works when the knowledge is elicited the right way before the tool is built."}, {"label": "Close", "notes": "SAY: Take the full quiz later: Find Your Zone, 12 questions, about three minutes.\nSAY: Why this matters for a small business. Owners are understaffed and overworked, and a lot of admin is repetitive. Tasks can be delegated to a system, and a system can fill a seat on the org chart. It keeps hiring costs down.\nSAY: Small businesses cannot afford the same mistakes as large enterprises. Encoding the expert also helps when an owner sells the business, hands it to family, or takes a vacation. The knowledge stays.\nSAY: Marcos closes with his own reason for doing this work, in his own words.\nCHECK: In rehearsal Marcos said other speakers had their websites on almost every slide. Check with Derek on Oct 26 anyway."}, {"label": "Questions", "notes": "SAY: Five minutes for questions.\nPREP: Likely questions from rehearsal. What is the difference between context engineering and prompt engineering? Why does this matter for small businesses? Could a recruiting company use this? Answer: yes, some firms capture knowledge well but do not build the tool, and we do both.\nPREP: Marcos's rehearsal feedback: steady pace, it guides the audience to a picture of the five layers, and it is simple to explain to almost anyone."}]; var i=0, t0=Date.now(), fs=24, linked=false, lastSeq=null, remoteOk=false; if(window.innerWidth<600) fs=19;
 var $=function(x){return document.getElementById(x)};
 var KS="fyz-notes-key"; try{ $("key").value=localStorage.getItem(KS)||""; }catch(e){}
 function el(t,c,x){var n=document.createElement(t); if(c)n.className=c; if(x!==undefined)n.textContent=x; return n;}
 function show(){ var d=D[i]||{label:"",notes:""};
  $("pos").textContent="Slide "+(i+1)+" of "+D.length; $("title").textContent=d.label;
  var box=$("notes"); box.textContent="";
  (d.notes||"No notes for this slide.").split("\n").forEach(function(line){
   if(!line.trim()) return; var m=/^(SAY \(Marcos\)|SAY|CHECK|DO|PREP):\s*(.*)$/.exec(line); var row=el("div","ln");
   if(m){ var tg=m[1].indexOf("SAY")===0?"SAY":m[1]; var chip=el("span","tag "+tg, m[1]==="SAY (Marcos)"?"MARCOS":tg); row.appendChild(chip); row.appendChild(el("span","txt",m[2])); }
   else row.appendChild(el("span","txt",line));
   box.appendChild(row); });
  var n=D[i+1]; $("next").textContent=""; if(n){var b=el("b","", "Next: "+n.label); $("next").appendChild(b);}
  document.documentElement.style.setProperty("--fs",fs+"px"); }
 function setStatus(t,warn){ $("status").textContent=t; $("status").className="status"+(warn?" warn":""); }
 var bc=null;
 try{ bc=new BroadcastChannel("fyz-deck");
  bc.onmessage=function(e){ if(e.data&&typeof e.data.slide==="number"){ i=Math.min(e.data.slide,D.length-1); linked=true; setStatus("Linked to the deck in this browser"); show(); } };
  bc.postMessage({hello:true});
 }catch(e){}
 function keyVal(){ return $("key").value.trim(); }
 function goTo(n){ n=Math.max(0,Math.min(D.length-1,n)); i=n; show();
  if(bc){ try{ bc.postMessage({goto:n}); }catch(e){} }
  var k=keyVal();
  if(k){ fetch("/api/live/host/remote",{method:"POST",headers:{"content-type":"application/json","x-host-key":k},body:JSON.stringify({slide:n})}).then(function(r){ remoteOk=r.ok; if(r.status===401) setStatus("Wrong host key",true); else if(r.status===503) setStatus("Host key is not set on the server",true); else if(r.ok) setStatus(linked?"Linked to the deck in this browser":"Controlling the deck through the server"); }).catch(function(){ setStatus("No connection to the server",true); }); }
  else if(!linked) setStatus("Enter the host key to control the deck from this device",true); }
 function poll(){ if(linked||document.hidden) return;
  fetch("/api/live/remote/state",{cache:"no-store"}).then(function(r){return r.json()}).then(function(s){ if(typeof s.slide==="number"&&s.total>0){ if(lastSeq===null||s.slide!==i){ i=Math.min(s.slide,D.length-1); show(); } lastSeq=s.seq; if(!keyVal()) setStatus("Following the deck. Enter the host key to control it."); else if(!remoteOk) setStatus("Following the deck through the server"); } }).catch(function(){ setStatus("No connection to the server",true); }); }
 setTimeout(function(){ if(!linked){ setStatus("Not linked in this browser. Using the server. The deck must be open with ?remote=1",true); } },2500);
 setInterval(poll,2500); poll();
 $("prev").onclick=function(){ goTo(i-1); }; $("nx").onclick=function(){ goTo(i+1); };
 $("sm").onclick=function(){ fs=Math.max(16,fs-2); show(); }; $("lg").onclick=function(){ fs=Math.min(60,fs+2); show(); };
 $("rst").onclick=function(){ t0=Date.now(); };
 $("key").addEventListener("change",function(){ try{ localStorage.setItem(KS,keyVal()); }catch(e){} setStatus("Key saved on this device"); });
 document.addEventListener("keydown",function(e){ if(e.target&&e.target.id==="key") return; if(e.key==="ArrowRight") $("nx").click(); if(e.key==="ArrowLeft") $("prev").click(); });
 setInterval(function(){ var s=Math.floor((Date.now()-t0)/1000), m=Math.floor(s/60); $("clock").textContent=(m<10?"0":"")+m+":"+(s%60<10?"0":"")+(s%60); },1000);
 show();
})();
</script></body></html>
