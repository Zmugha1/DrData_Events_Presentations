<script>
(function(){
 var D=[{"label": "Title", "notes": "ZUBIA: Good evening. Tonight has one idea. The person who just knows can hand off the routine and keep the judgment.\nZUBIA: Every example tonight is one task, start to finish."}, {"label": "Speakers", "notes": "ZUBIA: I am Zubia Mughal, Dr. Data. I have built and installed 12 private AI systems across 10 industries since March 2026.\nMARCOS: [Marcos introduces himself in two sentences, in his own words.]\nZUBIA: Marcos and I come at this from two sides. I build the systems. Marcos helps teams actually use them."}, {"label": "Agenda", "notes": "ZUBIA: Six parts. Who holds the knowledge. Why it matters now. What the finished tool does. How we capture it. What it looks like in use. And how teams adopt it.\nZUBIA: Questions come at the end. There is one phone quiz in the middle, so keep your phones close.\nZUBIA: Let us start with the who."}, {"label": "One person who just knows", "notes": "ZUBIA: Every team has one person who just knows. That person holds the tribal knowledge, the secret sauce, and the judgment. Picture that person on your own team.\nZUBIA: Raise your hand if you are that person on your team.\nZUBIA: Keep it up if you answered work questions on your last vacation.\nZUBIA: That person has two jobs."}, {"label": "Decide and train", "notes": "ZUBIA: That person is trusted to decide, and is required to train everyone else. Two jobs, and the second one never ends. Every new hire, every question, every day.\nZUBIA: And the business has one need."}, {"label": "Work the same way", "notes": "MARCOS: A franchise works because every location makes the same food. A burger in Milwaukee should taste the same as one in Madison.\nZUBIA: A business with one expert needs the same consistency. Same answers, same standards, whether the expert is in the room or not.\nZUBIA: So why does this matter for AI, and why now?"}, {"label": "Section: The Why", "notes": "ZUBIA: The why comes first: why the expert's knowledge is the missing piece."}, {"label": "Knowledge walks out", "notes": "ZUBIA: Michael Polanyi wrote: \"We can know more than we can tell.\" Tacit knowledge is known, but never written down.\nMARCOS: I read a book called Clone, about a person who built agents to clone himself and cut hours and days of mundane work. That is the idea tonight, done in a safe way.\nZUBIA: Marcos, where does that knowledge go when it leaves?"}, {"label": "Where knowledge leaves", "notes": "MARCOS: Knowledge leaves in three ways. People retire. Companies downsize. And consultants finish a project and walk out with what they learned.\nMARCOS: A consultant comes in for three months, six months, or a year, and leaves with the knowledge. Agile teams often keep little documentation. Waterfall documented everything. Much of that knowledge is now gone.\nZUBIA: It is spread everywhere. Once it is organized into five layers, you can build an AI system that helps.\nMARCOS: And while it leaves, people are already pouring business knowledge into public tools."}, {"label": "Founders leak data", "notes": "ZUBIA: Half of founders leak sensitive data to AI tools. People are already putting business knowledge into public tools, the wrong way.\nZUBIA: Small businesses cannot hide behind size and funding the way large companies can. They cannot afford the same mistakes.\nZUBIA: And when companies do adopt AI, they bolt it onto the old way of working."}, {"label": "Old workflows", "notes": "ZUBIA: Most companies add AI to the old way of working. That is why a tool needs the expert's way of working built into it.\nZUBIA: The same Deloitte report names the biggest barrier."}, {"label": "Skills are the barrier", "notes": "ZUBIA: Deloitte surveyed 3,235 leaders in 24 countries. Their finding: insufficient worker skills are the biggest barrier to integrating AI into existing workflows.\nZUBIA: Skills. Not the tools. The people using them.\nZUBIA: That is why tonight starts with the expert. The knowledge has to be captured before it can be taught, to people or to machines.\nZUBIA: So how do you capture it? Gartner says the fix is context, not clever prompts."}, {"label": "Context engineering", "notes": "ZUBIA: Prompt engineering means you word each request. Context engineering means you build what the tool knows before anyone asks.\nZUBIA: Engineering here means organizing in layers. The tool grabs this first, then that, then listens to you. Like a franchise recipe, the layers make the food taste the same every time.\nZUBIA: Gartner's forecast is about semantics, the agreed meaning of your business terms and data. Capturing your expert supplies part of that.\nZUBIA: Where are companies using AI most today?"}, {"label": "Gartner heat map", "notes": "ZUBIA: This graphic is Gartner's, shown unaltered. It shows where companies use generative AI most, by industry.\nZUBIA: Two uses sit closest to tonight: knowledge management and search, and conversational AI. Finding what the business knows, and asking it questions.\nZUBIA: Real estate, marketing, and media services use AI heavily for content and flyers. Many of your own customers sit in these rows.\nZUBIA: Gartner groups what people need from AI into three verbs."}, {"label": "Ask Act Tell", "notes": "ZUBIA: Ask, Act, Tell. Ask is what we want to know. Act is decisions and actions. Tell is insights and communication.\nZUBIA: A well-built system can prepare you for a meeting, answer a question, or give you a report to hand to someone else. Semantics sits at the center where the three overlap.\nZUBIA: Remember these three verbs. They come back in a few minutes with a fourth one."}, {"label": "Section: The What", "notes": "ZUBIA: So what is context made of?"}, {"label": "Context equation", "notes": "ZUBIA: Here is what context is made of. Intent times everything the agent is given equals context.\nZUBIA: The model brings general knowledge. Your systems bring data, state, and history. Semantic structures give every term one shared meaning.\nZUBIA: One ingredient has no system behind it: tacit knowledge. It lives in the expert's head. The rest of tonight is about that box.\nZUBIA: Five layers are how we get that ingredient out of the expert."}, {"label": "Capture to context", "notes": "ZUBIA: We ask the expert five kinds of questions. How we talk here. How we do it here. What happens next. Where the lines are. How we check the work.\nZUBIA: The output is context in the expert's own words, approved by the expert, and rechecked when conditions change.\nZUBIA: We place each task in a Zone first. You will place yourself in one with the quiz in a few minutes.\nZUBIA: Where does each layer go in the agent? Think of a body."}, {"label": "Five parts of agent", "notes": "ZUBIA: Think of the agent as a body. The expert fills five parts of it.\nZUBIA: Prompts are the voice. How we talk here, the words we use and the words we never use.\nZUBIA: Skills are muscle memory. Trained steps, done in the expert's order, without thinking.\nZUBIA: Agents are the nervous system. They sequence what happens next, so nothing gets dropped.\nZUBIA: Contracts are the immune system. They know what to reject and when to stop.\nZUBIA: Evaluation is the senses. They notice when something is off.\nZUBIA: The brain is the model. It stays general, and it is the only part you can swap. Everything that makes it yours lives in the other five.\nZUBIA: Here is the body at work on one call."}, {"label": "Agent answers", "notes": "MARCOS: A junior at a property management company gets the call. He opens the chat tool, and he never has to find the expert.\nZUBIA: The agent reads the expert's context. It checks, does, and says what the expert would. It stops where the expert stops.\nZUBIA: Each row came from a layer. The check and the steps from Skills. The booking from Agents. The wording from Prompts. The stop from Contracts.\nZUBIA: Before the answer leaves, Evaluation checks it against the expert's standard. It can send the work back.\nZUBIA: Remember the three verbs. Ask, act, tell. The expert adds a fourth: stop. That is the difference between a generic chatbot and a tool built on your expert.\nZUBIA: And once you have this context, it feeds more than one tool."}, {"label": "One context many tools", "notes": "ZUBIA: Five layers build one context. One context feeds many tools.\nZUBIA: I come from the training industry. This knowledge is not only for training humans. It is used to train machines to help humans.\nZUBIA: A chat tool uses all five layers. An AI application leans on layers 3 and 4. A training course leans on layers 1, 2, and 5.\nZUBIA: Now the how: four steps to capture what your expert knows."}, {"label": "Section: The How", "notes": "ZUBIA: Four steps. Step 1, list the tasks. Step 2, pick the right ones. Then you place yourself with the quiz. Step 3, the Zone check places each task. Step 4, the five layers."}, {"label": "Step 1 List", "notes": "ZUBIA: Think about a new hire's first month. What do you teach them? What to do next. What not to touch. What success looks like.\nZUBIA: For each task, write down how often it happens, how much it matters, how hard it is, and where mistakes happen.\nZUBIA: A property management office triages a maintenance call. Daily. High importance. Medium difficulty. The mistake is missing hidden water damage.\nZUBIA: Approve a vendor invoice. Weekly. Medium importance. Low difficulty. The mistake is paying the same bill twice.\nZUBIA: It sounds simple. Writing it down in this detail is the work.\nZUBIA: You cannot build everything at once. So which tasks go first?"}, {"label": "Step 2 Pick", "notes": "ZUBIA: Put the tasks on a risk and frequency matrix. Start with frequent and lower risk.\nZUBIA: Frequent and high risk: the expert decides and the tool brings sources. Rare and high risk stays with the expert. Rare and lower risk comes later.\nZUBIA: Before we place a task in a Zone, I want you to place yourself."}, {"label": "Section: Place yourself", "notes": "ZUBIA: Answer for how you actually work today, not how you wish you worked. There are no wrong answers.\nZUBIA: Your answers are anonymous. You see your own result on your phone. The screen shows only the room's totals.\nZUBIA: Phones out. Here is the code."}, {"label": "Scan to start the quiz", "notes": "ZUBIA: Scan the code or type the link. Your answers are anonymous.\nZUBIA: Watch the bars. This is the room, live.\nZUBIA: You just answered questions from four of the five layers without knowing it.\nZUBIA: Let us see where this room landed."}, {"label": "Four Zones", "notes": "ZUBIA: [n] percent of this room is Below the Zone. You know the rules, and you still do the work by hand. Reflexes are what we hand to the machine. The mode is Encode.\nZUBIA: [n] percent is Inside. You and AI work in harmony. That is skilled judgment, and we protect it. The mode is Assist: AI gathers and drafts, you decide.\nZUBIA: [n] percent is Above. You lean on AI for knowledge you do not have yet. Fair, as long as you see its sources. The mode is Research.\nZUBIA: [n] percent is Oscillating. You are learning. Clumsy at first, then smoother. That is a good place to be. The mode is Learn.\nZUBIA: Look at your own phone. Your mix matters more than your label. Work rarely sits in one Zone.\nZUBIA: The quiz placed you. Now we place a task, with the expert."}, {"label": "Step 3 Zone check", "notes": "ZUBIA: Same four Zones. Now we use them on one task, with the expert in the room.\nZUBIA: Below means the expert can state the rule, and does it the same way every time. Encode it.\nZUBIA: Inside is the expert's judgment. The tool gathers and drafts. The expert decides. Assist it.\nZUBIA: Above goes past what the expert can call with confidence. The tool brings cited research. Research it.\nZUBIA: Oscillating means the expert's answer is still forming. The tool shows its reasoning and asks for a reason. Learn it.\nZUBIA: Every Zone gets built, each in its own mode. Zones expire and get rechecked, because the work, the staff, and the business change.\nZUBIA: The Zone does one more job. It tells the agent how to behave."}, {"label": "Zone sets the mode", "notes": "ZUBIA: Encode runs the expert's rule. It never changes the rule.\nZUBIA: Assist gathers, drafts, and shows past cases. It never makes the judgment call.\nZUBIA: Research brings cited sources and says what it does not know. It never presents a conclusion as a decision.\nZUBIA: Learn shows its reasoning and examples, and asks the person to decide and say why. It never decides silently.\nZUBIA: The Zone tells the agent how far it may go. The five layers tell it what to know.\nZUBIA: Now the part I want you to take home. Same call. Two people."}, {"label": "Same call two Zones", "notes": "ZUBIA: The same call sits in two Zones, depending on who takes it.\nZUBIA: For the expert, it is routine. She has handled it hundreds of times. Below the Zone. Her steps run, in her order. She gets her time back.\nZUBIA: For the junior, it is past his skills. He has handled it twice. Above the Zone. The tool teaches him with her reasoning, and he makes the call.\nZUBIA: Over time he moves to Oscillating, then Inside. That is apprenticeship, every day, even when she is out.\nZUBIA: One system serves both of them, built on her rules.\nZUBIA: So what goes into her rules? Five things. The same five you teach a new hire."}, {"label": "Section: Five layers", "notes": "ZUBIA: You know how far the agent may go. Now, what it needs to know."}, {"label": "Five layers defined", "notes": "ZUBIA: Five layers. Each one is a question you ask the expert, a part of the body, and a part of the agent.\nZUBIA: Layer 1, Prompts. How do we talk here? The voice. In the agent, its voice and the words it never uses.\nZUBIA: Layer 2, Skills. How do we do it here? Muscle memory. In the agent, the steps and rules it can run.\nZUBIA: Layer 3, Agents. What happens next? The nervous system. In the agent, the sequence and the hand-offs between steps.\nZUBIA: Layer 4, Contracts. Where are the lines? The immune system. In the agent, approvals, limits, privacy, and stop.\nZUBIA: Layer 5, Evaluation. How do we check the work? The senses. In the agent, checks against the expert's standard.\nZUBIA: Layers 3 and 4 are what make many agents safe later. Every hand-off is written down, and every agent shares the same immune system.\nZUBIA: Now we build the body, one layer at a time, with one call."}, {"label": "Layer 1 Talk", "notes": "ZUBIA: Layer 1, Prompts: how we talk here. The junior calls the manager: \"Tenant says water under the sink. What do I do?\"\nZUBIA: The expert says: \"We never tell a tenant it is an emergency. We say we are sending someone today.\"\nZUBIA: The tool sounds like you, not like a robot. Include the words you never use. In the body, this is the voice.\nZUBIA: The voice is right. Now the steps."}, {"label": "Layer 2 Do", "notes": "ZUBIA: Layer 2, Skills: how we do it here. Is it the supply line or the drain? Is the water spreading? Shut off the supply valve. Book the plumber for today.\nZUBIA: In the body, this is muscle memory. Trained steps, in order, without thinking.\nZUBIA: The leak is handled. What happens next?"}, {"label": "Layer 3 Next", "notes": "ZUBIA: Layer 3, Agents: what happens next. Plumber booked. Tenant told. Ticket logged. Follow up tomorrow.\nZUBIA: New hires fix the problem and forget the follow-up. The expert knows the whole chain. The tool proposes each next move so nothing is dropped.\nZUBIA: In the body, this is the nervous system.\nZUBIA: And where does the tool stop?"}, {"label": "Layer 4 Lines", "notes": "ZUBIA: Layer 4, Contracts: where the lines are. Four answers: do it, do it smaller, bring it to me, stop.\nZUBIA: Ceiling damage is the line here. The expert inspects it personally. Approvals expire, so each one has an end date and gets reviewed.\nZUBIA: In the body, this is the immune system. This is where the fourth verb lives. Stop.\nZUBIA: Last layer. How do we know it stays right?"}, {"label": "Layer 5 Check", "notes": "ZUBIA: Layer 5, Evaluation: how we check the work. You check a new hire's work for the first few months. The tool gets the same treatment.\nZUBIA: If an answer drifts from the expert's, it is blocked and fixed before it reaches anyone. The tool never continues silently.\nZUBIA: In the body, these are the senses. The whole body is lit. That is the agent. Five layers, built from one expert.\nZUBIA: One rule ties all five together."}, {"label": "Who decides", "notes": "ZUBIA: Prompts, Skills, and Agents may propose. Only Contracts may authorize. Evaluation may block.\nZUBIA: The check layer may say no at any time. That is why the tool cannot talk itself into something risky. Suggesting and approving are separate jobs.\nZUBIA: Same pattern, three more jobs."}, {"label": "Section: In Use", "notes": "ZUBIA: Three more jobs, same pattern: check, do, say, stop."}, {"label": "Estimator", "notes": "ZUBIA: Estimator. The client wants to move a window. How do I price it? The tool checks whether the framing is already up.\nZUBIA: It says: price it as a change order with a labor and material split. This change affects cost and schedule, and approval is needed before work.\nZUBIA: Stop line: if it touches the structure, bring it to the estimator.\nZUBIA: For the senior estimator, this is routine. Below the Zone. Encode. For a new estimator it is Above, and the tool shows why the split matters."}, {"label": "Energy assessor", "notes": "ZUBIA: Energy assessor. The house came back high on air leakage. Do I recommend sealing first? The tool checks the blower door reading and attic access.\nZUBIA: It lists the sealing steps in order and gives a plan the homeowner can follow.\nZUBIA: Stop line: if a combustion appliance is involved, stop and call me. That is the immune system again."}, {"label": "IT support desk", "notes": "ZUBIA: IT support desk. The user cannot log in after a password reset. The tool checks whether the account is locked and which device is trying.\nZUBIA: It says: clear the lockout and have them sign in again. Live chat, without waiting on a supervisor.\nZUBIA: Stop line: a login from a new location goes to the lead. One context, many applications.\nZUBIA: So what does the junior get from all this?"}, {"label": "What the junior gets", "notes": "ZUBIA: Answers without pulling the expert away. Repeated discussions drop. Work continues.\nZUBIA: This is performance support at the moment of the task. It is apprenticeship, every day. Continuous learning and growth.\nZUBIA: Is there research behind this? Yes."}, {"label": "Research", "notes": "ZUBIA: A study of 5,179 customer support agents. An AI tool built from top agents' conversations raised productivity 34% for the newest agents, with little change for the most experienced.\nZUBIA: This was a customer support chat tool, not ours. It matches tonight's idea: capture what the best people do, and the newest people gain the most.\nZUBIA: If asked: the average gain across everyone was 14%.\nZUBIA: Building the tool is half the job. Marcos, how do teams actually adopt it?"}, {"label": "Section: Adoption", "notes": "MARCOS: Thank you, Zubia."}, {"label": "Adoption (Marcos)", "notes": "MARCOS: Prosci studied 1,107 professionals across frontline employees, team leaders, and executives. 63% of AI implementation challenges stem from human factors, not technical limitations. That is 6 in 10.\nMARCOS: Building the tool is the easy part. Getting people to use it is the hard part.\nMARCOS: So who sets the pace?"}, {"label": "Managers set the pace", "notes": "MARCOS: Gallup, May 2026. Employees whose manager strongly supports their team's use of AI are 1.7 times as likely to use it a few times a week or more. Only 36% strongly agree their manager does.\nMARCOS: Competent teams often know how to use the tool. Accountability is what makes the difference. Track adoption: how many days a week people use it.\nMARCOS: Our working benchmark is five days a week for three to four weeks. That is a working number, not a study result.\nMARCOS: We coach managers to support their team, and coach the team to use the tool daily.\nMARCOS: And fit with the work matters just as much."}, {"label": "Fit with the work", "notes": "MARCOS: Gallup, February 2026. Among employees who strongly agree that AI fits the systems and processes they use at work, 88% use AI frequently. Among those who do not strongly agree, 55%. Two separate groups.\nMARCOS: Design around the job, not around the tool. A tool built for how a person works is the one they keep using.\nMARCOS: Which brings us to one rule."}, {"label": "Build around the job", "notes": "MARCOS: Start from the task, then pick the tool. Do not start by picking a tool and then looking for a task.\nZUBIA: The expert's knowledge becomes a tool the whole team can use. That only works when the knowledge is captured the right way before the tool is built.\nMARCOS: Zubia, bring it home."}, {"label": "Safe from the start", "notes": "ZUBIA: We promised to close on safety. The immune system is built in from the start, not added after.\nZUBIA: Private models on your own machine. Remember the founders who leak data to public tools? Your expert's rules never go there.\nZUBIA: Sensitive fields are marked and masked before anything is analyzed.\nZUBIA: A person approves what matters. Every decision is logged with a record you can check. One switch stops every agent.\nZUBIA: Rules go back for re-approval when the model, the data, or the business changes.\nZUBIA: AI automates the workflow once it is written down. It does not replace the expertise that built it."}, {"label": "Recap", "notes": "ZUBIA: Let us put the whole story together. We pick the task and run the Zone check. We capture it in five layers. The tacit knowledge joins the rest of the context. The chat tool answers as the expert would. The team adopts it.\nZUBIA: The expert's knowledge becomes a tool the whole team can use."}, {"label": "Close", "notes": "ZUBIA: Remember the person who just knows? The one who answered questions on vacation?\nZUBIA: Her rules now run the routine work. Her judgment is protected. The junior learns from her every day, even when she is out.\nZUBIA: Next time, she takes the vacation.\nMARCOS: [Marcos closes with his own reason for doing this work, in his own words.]\nZUBIA: Thank you. If you missed the quiz, the link is on the slide. SPIN will share the slides."}, {"label": "Questions", "notes": "ZUBIA: We would love your questions."}]; var i=0, t0=Date.now(), fs=24, linked=false, lastSeq=null, remoteOk=false; if(window.innerWidth<600) fs=19;
