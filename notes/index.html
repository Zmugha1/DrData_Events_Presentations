<script>
(function(){
 var D=[{"label": "Title", "notes": "ZUBIA: Good evening. Quick show of hands. Who has watched The Mandalorian?\nZUBIA: When someone asks why they do something, they say, \"This is the way.\"\nZUBIA: That is a rule with no explanation attached. They follow it, they cannot say why, and the new member learns it by watching.\nZUBIA: Your best person has a way too. Ask why they did it like that, and you get, \"That is how we do it here.\" That is tacit knowledge.\nZUBIA: Tonight has one idea. The person who just knows can hand off the routine and keep the judgment.\nZUBIA: Every example tonight is one task, start to finish.\nZUBIA: The title has the word agents in it, so let me define it once. In the title, an agent is an AI system that takes steps on a task. It does more than answer. It checks, does, and hands off to the next step. The five layers sit between the expert and that system.\nZUBIA: Later you will see Layer 3, called Agents. That is the part of the system that runs the steps. The title uses the word for the finished system. Layer 3 uses it for the step-running part. Tonight's example is a chat tool."}, {"label": "Speakers", "notes": "ZUBIA: I am Zubia Mughal, Dr. Data. I have built and installed 12 private AI systems across 10 industries since March 2026.\nZUBIA: Marcos, introduce yourself.\nMARCOS: [Marcos introduces himself in two sentences, in his own words.]\nZUBIA: Marcos and I come at this from two sides. I build the systems. Marcos helps teams actually use them."}, {"label": "Agenda", "notes": "ZUBIA: Six parts. Who holds the knowledge. Why it matters now. What the finished chat tool does. How we capture it. What it looks like in use. And how teams adopt it.\nZUBIA: Questions come at the end. There is one phone quiz in the middle, so keep your phones close.\nZUBIA: Let us start with the who."}, {"label": "One person who just knows", "notes": "ZUBIA: Every team has one person who just knows. That person holds the tribal knowledge, the secret sauce, and the judgment. Picture that person on your own team.\nZUBIA: Raise your hand if you are that person on your team.\nZUBIA: Keep it up if you answered work questions on your last vacation.\nZUBIA: That person has two jobs."}, {"label": "Decide and train", "notes": "ZUBIA: That person is trusted to decide, and is required to train everyone else. Two jobs, and the second one never ends. Every new hire, every question, every day.\nZUBIA: And the business has one need. Marcos, what does that look like in a franchise?"}, {"label": "Work the same way", "notes": "MARCOS: A franchise works because every location makes the same food. A burger in Milwaukee should taste the same as one in Madison.\nMARCOS: Zubia, what does a business with one expert do?\nZUBIA: A business with one expert needs the same consistency. Same answers, same standards, whether the expert is in the room or not.\nZUBIA: So why does this matter for AI, and why now?"}, {"label": "Section: The Why", "notes": "ZUBIA: The why comes first: why the expert's knowledge is the missing piece."}, {"label": "Knowledge walks out", "notes": "ZUBIA: Michael Polanyi wrote in The Tacit Dimension, 1966, page 4: \"We can know more than we can tell.\" Tacit knowledge is known, but never written down.\nZUBIA: Picture the person who spots a bad estimate at a glance and cannot tell you the rule they used. That is tacit knowledge.\nZUBIA: Marcos has a story about this.\nMARCOS: I read a book called Clone, about a person who built AI tools to clone himself and cut hours and days of mundane work. That is the idea tonight, done in a safe way.\nZUBIA: Marcos, where does that knowledge go when it leaves?"}, {"label": "Where knowledge leaves", "notes": "MARCOS: Knowledge leaves in five ways. People retire. Companies downsize. Consultants finish a project and walk out with what they learned. Teams stop writing things down. And businesses get sold or passed on.\nMARCOS: A consultant comes in for three months, six months, or a year, and leaves with the knowledge.\nMARCOS: Zubia, can you get it back?\nZUBIA: Yes. It is spread everywhere. Once it is organized into five layers, you can build an AI system that helps. Marcos, what are people doing in the meantime?\nMARCOS: Pouring business knowledge into public tools. Zubia has the numbers."}, {"label": "Founders share data", "notes": "ZUBIA: Startups.co.uk and Sage surveyed more than 400 UK founders, owners, and executives. The report is The Startup AI Paradox, July 2026.\nZUBIA: The article says 90% of SMEs using AI worry that private data is used to train global models, yet half are leaking sensitive data anyway.\nZUBIA: Half said they shared sensitive company information with public AI tools in the past month. For over a quarter, it is a weekly habit.\nZUBIA: It is a UK survey. The behavior is the point. People are putting business knowledge into public tools, the wrong way.\nZUBIA: Small businesses cannot hide behind size and funding the way large companies can.\nZUBIA: Marcos, what happens when companies do adopt AI?"}, {"label": "Jobs not redesigned", "notes": "MARCOS: Deloitte's State of AI in the Enterprise 2026 surveyed 3,235 director-level to C-suite leaders in 24 countries, in August and September 2025.\nMARCOS: 84% of the companies have not redesigned jobs around AI. Deloitte says many focus on building AI fluency and leave the work itself as it was.\nMARCOS: Put simply, most companies add AI to the old way of working. That is why a tool needs the expert's way of working built into it.\nMARCOS: The same report names the biggest barrier."}, {"label": "Skills are the barrier", "notes": "MARCOS: Same report, page 14. Deloitte asked the leaders what stands in the way of integrating AI into existing workflows.\nMARCOS: Their top answer: insufficient worker skills. The report gives no percentage for this one. It is the leaders' ranking.\nMARCOS: Whoever uses the tool has to know the work. So the knowledge has to be captured before it can be taught, to people or to machines.\nMARCOS: Zubia, so how do you capture it?"}, {"label": "Context engineering", "notes": "ZUBIA: Prompt engineering means you word each request. Context engineering means you build what the tool knows before anyone asks.\nZUBIA: Gartner's First Take of July 28, 2025 is titled Lead the Shift to Context Engineering as Prompt Engineering Fades. Its line: context engineering is in, and prompt engineering is out.\nZUBIA: Gartner's Avivah Litan followed on October 6, 2025 with an article headlined Context Engineering Is the New Prompt Engineering. Its lead: it is time to prioritize context over prompts, with context-aware architectures, dynamic data, and reimagined human-AI interfaces.\nZUBIA: Anthropic's engineering team wrote on September 29, 2025 that they view context engineering as the natural progression of prompt engineering. Two different organizations, same direction.\nZUBIA: Engineering here means organizing in layers. The tool grabs this first, then that, then listens to you. Remember Marcos's burger? A franchise recipe works the same way.\nZUBIA: The numbers on the slide come from a separate Gartner press release, May 11, 2026, headlined Lack of Semantics Causes Inaccurate AI Agents and Wasted Spending. Gartner predicts that by 2027, organizations that prioritize semantics in their AI-ready data will see up to 80% better accuracy from agentic AI and up to 60% lower costs.\nZUBIA: Semantics is the agreed meaning of your business terms and data. Capturing your expert supplies part of that. Our five layers are our own method. Gartner did not say they produce those numbers.\nZUBIA: It is a prediction. The release cites no survey behind it. Treat it as direction.\nZUBIA: Where are companies using AI most today?"}, {"label": "Gartner heat map", "notes": "ZUBIA: This graphic is Gartner's, shown unaltered. It shows where companies use generative AI most, by industry.\nZUBIA: Two uses sit closest to tonight: knowledge management and search, and conversational AI. Finding what the business knows, and asking it questions.\nZUBIA: That is why we use a chat tool as our example tonight.\nZUBIA: Gartner groups what people need from AI into three verbs."}, {"label": "Ask Act Tell", "notes": "ZUBIA: Ask, Act, Tell. Ask is what we want to know. Act is decisions and actions. Tell is insights and communication.\nZUBIA: A well-built system can prepare you for a meeting, answer a question, or give you a report to hand to someone else. Semantics sits at the center where the three overlap.\nZUBIA: Gartner's three verbs leave out stop. We add it. Stop is the human in the loop: the tool stops and checks with the supervisor. It comes back in a few minutes."}, {"label": "Section: The What", "notes": "ZUBIA: So what is context made of?"}, {"label": "Context equation", "notes": "ZUBIA: Here is what context is made of. Intent times everything the chat tool is given equals context. Building all of it on purpose is context engineering.\nZUBIA: The model brings general knowledge. Your systems bring data, state, and history.\nZUBIA: Semantic structures give every business term one agreed meaning. Active client. Closed job. The same meaning everywhere. Gartner puts semantics at the center of its picture.\nZUBIA: Gartner's own framework lists tacit knowledge as one of the six. It has no system behind it. It lives in the expert's head. The rest of tonight is about that box.\nZUBIA: The five layers are how we get tacit knowledge out of the expert. How we talk here. How we do it here. What happens next. Where the lines are. How we check the work.\nZUBIA: The layers also write down meaning. The expert's words, including the words they never use, and the expert's rules and lines. That feeds semantics too.\nZUBIA: Three sentences to hold on to. Context engineering is the whole equation. Semantics is one term in it, the shared meaning of your terms. The five layers fill the tacit term, and the words and rules we capture feed semantics too."}, {"label": "Capture to context", "notes": "ZUBIA: We ask the expert five kinds of questions. How we talk here. How we do it here. What happens next. Where the lines are. How we check the work.\nZUBIA: The output is context in the expert's own words, approved by the expert, and rechecked when conditions change.\nZUBIA: Before we capture a task's layers, we run a Zone check on that task. That is Step 3 of the how. You will place yourself in a Zone with the quiz in a few minutes.\nZUBIA: Where does each layer go in the chat tool? Think of a body."}, {"label": "Five parts of chat tool", "notes": "ZUBIA: Think of the chat tool as a body. The expert fills five parts of it.\nZUBIA: Prompts are the voice. How we talk here, the words we use and the words we never use.\nZUBIA: Skills are muscle memory. Trained steps, done in the expert's order, without thinking.\nZUBIA: Layer 3 is called Agents. In the title, the word means the whole system. Here it means one part, the part that runs the steps. Agents are the nervous system. They sequence what happens next, so nothing gets dropped.\nZUBIA: Contracts are the immune system. They know what to reject and when to stop.\nZUBIA: Evaluation is the senses. They notice when something is off.\nZUBIA: The brain is the model. It stays general, and it is the only part you can swap. Everything that makes it yours lives in the other five.\nZUBIA: Here is the body at work on a real call. Marcos, walk us through it."}, {"label": "Chat tool answers", "notes": "MARCOS: A junior at a property management company gets the call. He opens the chat tool, and he never has to find the expert.\nMARCOS: Zubia, what is the chat tool doing while he waits?\nZUBIA: We will call this the water call. A tenant says there is water under the sink. It stays with us for the rest of the night.\nZUBIA: The chat tool reads the expert's context. It checks, does, and says what the expert would. It stops where the expert stops.\nZUBIA: Each row came from a layer. The check and the steps from Skills. The booking from Agents. The wording from Prompts. The stop from Contracts.\nZUBIA: Before the answer leaves, Evaluation checks it against the expert's standard. It can send the work back.\nZUBIA: In the chat tool the verbs read: check, do, say, stop. Check is ask, do is act, say is tell. Stop is the one Gartner's three leave out. It is the human in the loop: the tool stops and checks with the supervisor. That is the difference between a generic chatbot and a tool built on your expert.\nZUBIA: And once you have this context, it feeds more than one tool."}, {"label": "One context many tools", "notes": "ZUBIA: Five layers build one context. One context feeds many tools.\nZUBIA: I come from the training industry. This knowledge trains people. It also trains machines to help people.\nZUBIA: A chat tool uses all five layers. An AI application leans on layers 3 and 4. A training course leans on layers 1, 2, and 5.\nZUBIA: Now the how: four steps to capture what your expert knows."}, {"label": "Section: The How", "notes": "ZUBIA: Four steps. Step 1, list the tasks. Step 2, pick the right ones. Then you place yourself with the quiz. Step 3, the Zone check places each task. Step 4, the five layers."}, {"label": "Step 1 List", "notes": "ZUBIA: Think about a new hire's first month. What do you teach them? What to do next. What not to touch. What success looks like.\nZUBIA: For each task, write down how often it happens, how much it matters, how hard it is, and where mistakes happen.\nZUBIA: A property management office triages a maintenance call. Daily. High importance. Medium difficulty. The mistake is missing hidden water damage.\nZUBIA: Approve a vendor invoice. Weekly. Medium importance. Low difficulty. The mistake is paying the same bill twice.\nZUBIA: It sounds simple. Writing it down in this detail is the work.\nZUBIA: You cannot build everything at once. So which tasks go first?"}, {"label": "Step 2 Pick", "notes": "ZUBIA: Put the tasks on a risk and frequency matrix. Start with frequent and lower risk.\nZUBIA: Frequent and high risk: the expert decides and the tool brings sources. Rare and high risk stays with the expert. Rare and lower risk comes later.\nZUBIA: Before we place a task in a Zone, I want you to place yourself."}, {"label": "Section: Place yourself", "notes": "ZUBIA: Answer for how you actually work today. Be honest. There are no wrong answers.\nZUBIA: Your answers are anonymous. You see your own result on your phone. The screen shows only the room's totals.\nZUBIA: Phones out. Here is the code."}, {"label": "Scan to start the quiz", "notes": "ZUBIA: Scan the code or type the link. Twelve questions: eight about how you work with AI, four about your work. Your answers are anonymous.\nZUBIA: Watch the bars. This is the room, live.\nZUBIA: Those eight questions touched four of the five layers: how you write, how you do the work, where the line sits, and how you check it.\nZUBIA: Let us see where this room landed."}, {"label": "Four Zones", "notes": "ZUBIA: [n] percent of this room is Below the Zone. You know the rules, and you still do the work by hand. Reflexes are what we hand to the machine. The mode is Encode.\nZUBIA: [n] percent is Inside. You and AI work in harmony. That is skilled judgment, and we protect it. The mode is Assist: AI gathers and drafts, you decide.\nZUBIA: [n] percent is Above. You lean on AI for knowledge you do not have yet. Fair, as long as you see its sources. The mode is Research.\nZUBIA: [n] percent is Oscillating. You are learning. Some days you decide. Some days you lean on AI. Clumsy at first, then smoother. That is a good place to be. The mode is Learn.\nZUBIA: A new hire starts Above, oscillates as he learns, and ends up Inside. We will watch one do it in a few minutes.\nZUBIA: Look at your own phone. Your mix matters more than your label. Work rarely sits in one Zone.\nZUBIA: The quiz placed you. Now we place a task, with the expert."}, {"label": "Step 3 Zone check", "notes": "ZUBIA: Same four Zones. Now we use them on one task, with the expert in the room.\nZUBIA: Below means the expert can state the rule, and does it the same way every time. Encode it.\nZUBIA: Inside is the expert's judgment. The tool gathers and drafts. The expert decides. Assist it.\nZUBIA: Above goes past what the expert can call with confidence. The tool brings cited research. Research it.\nZUBIA: Oscillating means the expert's answer is still forming. The tool shows its reasoning and asks for a reason. Learn it.\nZUBIA: Every Zone gets built, each in its own mode. Zones expire and get rechecked, because the work, the staff, and the business change.\nZUBIA: The Zone does one more job. It tells the chat tool how to behave."}, {"label": "Zone sets the mode", "notes": "ZUBIA: Encode runs the expert's rule. It never changes the rule.\nZUBIA: Assist gathers, drafts, and shows past cases. It never makes the judgment call.\nZUBIA: Research brings cited sources and says what it does not know. It never presents a conclusion as a decision.\nZUBIA: Learn shows its reasoning and examples, and asks the person to decide and say why. It never decides silently.\nZUBIA: The Zone tells the chat tool how far it may go. The five layers tell it what to know.\nZUBIA: Now the part I want you to take home. The water call. Two people. Watch the junior move through the modes."}, {"label": "Same call two Zones", "notes": "ZUBIA: The water call sits in two Zones, depending on who takes it.\nZUBIA: For the expert, it is routine. She has handled it hundreds of times. Below the Zone. Encode: her steps run, in her order. She gets her time back.\nZUBIA: For the junior, it is past his skills today. He has handled it twice. He starts Above the Zone. In Research mode the chat tool brings her rules and past cases, and says what it does not know.\nZUBIA: Then he oscillates. Some days he decides. Some days he leans on the tool. In Learn mode the chat tool shows her reasoning, and he decides and says why.\nZUBIA: Over time his calls hold steady. He is Inside the Zone, and the chat tool moves to Assist. It gathers and drafts. He decides.\nZUBIA: He upskills while he uses the chat tool. That is apprenticeship, every day, even when she is out.\nZUBIA: One chat tool serves both of them, built on her rules.\nZUBIA: So what goes into her rules? Five things. The same five you teach a new hire."}, {"label": "Section: Five layers", "notes": "ZUBIA: You know how far the chat tool may go. Now, what it needs to know."}, {"label": "Five layers defined", "notes": "ZUBIA: Five layers. Each one is a question you ask the expert, a part of the body, and a part of the chat tool.\nZUBIA: Layer 1, Prompts. How do we talk here? The voice. In the chat tool, its voice and the words it never uses.\nZUBIA: Layer 2, Skills. How do we do it here? Muscle memory. In the chat tool, the steps and rules it can run.\nZUBIA: Layer 3, Agents. What happens next? The nervous system. In the chat tool, the sequence and the hand-offs between steps.\nZUBIA: Layer 4, Contracts. Where are the lines? The immune system. In the chat tool, approvals, limits, privacy, and stop.\nZUBIA: Layer 5, Evaluation. How do we check the work? The senses. In the chat tool, checks against the expert's standard.\nZUBIA: Now we build the body, one layer at a time, with the water call."}, {"label": "Layer 1 Talk", "notes": "ZUBIA: Layer 1, Prompts: how we talk here. The junior calls the manager: \"Tenant says water under the sink. What do I do?\"\nZUBIA: The expert says: \"We never tell a tenant it is an emergency. We say we are sending someone today.\"\nZUBIA: The tool sounds like you. Include the words you never use. In the body, this is the voice.\nZUBIA: The voice is right. Now the steps."}, {"label": "Layer 2 Do", "notes": "ZUBIA: Layer 2, Skills: how we do it here. Is it the supply line or the drain? Is the water spreading? Shut off the supply valve. Book the plumber for today.\nZUBIA: In the body, this is muscle memory. Trained steps, in order, without thinking.\nZUBIA: The steps are done. What happens next?"}, {"label": "Layer 3 Next", "notes": "ZUBIA: Layer 3, Agents: what happens next. Plumber booked. Tenant told. Ticket logged. Follow up tomorrow.\nZUBIA: New hires fix the problem and forget the follow-up. The expert knows the whole chain. The tool proposes each next move so nothing is dropped.\nZUBIA: In the body, this is the nervous system. Layer 3 means the part that runs the steps. It is one part of the system, not the whole.\nZUBIA: And where does the tool stop?"}, {"label": "Layer 4 Lines", "notes": "ZUBIA: Layer 4, Contracts: where the lines are. Four answers: do it, do it smaller, bring it to me, stop.\nZUBIA: Ceiling damage is the line here. The expert inspects it personally. Approvals expire, so each one has an end date and gets reviewed.\nZUBIA: In the body, this is the immune system. This is where the fourth verb lives. Stop.\nZUBIA: In the chat tool, stop means a person steps in. The tool stops and checks with the supervisor. That is the human in the loop.\nZUBIA: Last layer. How do we know it stays right?"}, {"label": "Layer 5 Check", "notes": "ZUBIA: Layer 5, Evaluation: how we check the work. You check a new hire's work for the first few months. The tool gets the same treatment.\nZUBIA: If an answer drifts from the expert's, it is blocked and fixed before it reaches anyone. The tool never continues silently.\nZUBIA: In the body, these are the senses. The whole body is lit. That is the chat tool. Five layers, built from one expert.\nZUBIA: One rule ties all five together."}, {"label": "Who decides", "notes": "ZUBIA: Prompts, Skills, and Agents may propose. Only Contracts may authorize. Evaluation may block.\nZUBIA: The check layer may say no at any time. That is why the tool cannot talk itself into something risky. Suggesting and approving are separate jobs.\nZUBIA: That rule is also what keeps the tool safe."}, {"label": "Safe from the start", "notes": "ZUBIA: One rule ties the five layers together. It is also how the tool stays safe.\nZUBIA: A person approves what matters. The expert decides what the tool may do alone.\nZUBIA: When the tool reaches a line, it stops and checks with the supervisor. That is the human in the loop. Stop is the verb Gartner's three leave out.\nZUBIA: Approvals have an end date. Each one is reviewed before it expires.\nZUBIA: Rules are rechecked when the model, the data, or the business changes.\nZUBIA: AI automates the workflow once it is written down. The expertise stays with the expert.\nZUBIA: Now three more jobs, same pattern: check, do, say, stop."}, {"label": "Section: In Use", "notes": "ZUBIA: Three more jobs, same pattern: check, do, say, stop."}, {"label": "Estimator", "notes": "ZUBIA: Estimator. The client wants to move a window. How do I price it? The tool checks whether the framing is already up.\nZUBIA: It says: price it as a change order with a labor and material split. This change affects cost and schedule, and approval is needed before work.\nZUBIA: Stop line: if it touches the structure, bring it to the estimator.\nZUBIA: For the senior estimator, this is routine. Below the Zone. Encode. For a new estimator it starts Above, and the chat tool brings the sources. As he learns, it shows why the split matters."}, {"label": "Energy assessor", "notes": "ZUBIA: Energy assessor. The house came back high on air leakage. Do I recommend sealing first? The tool checks the blower door reading and attic access.\nZUBIA: It lists the sealing steps in order and gives a plan the homeowner can follow.\nZUBIA: Stop line: if a combustion appliance is involved, stop and call me. That is the immune system again."}, {"label": "IT support desk", "notes": "ZUBIA: IT support desk. The user cannot log in after a password reset. The tool checks whether the account is locked and which device is trying.\nZUBIA: It says: clear the lockout and have them sign in again. Live chat, without waiting on a supervisor.\nZUBIA: Stop line: a login from a new location goes to the lead. One context, many applications.\nZUBIA: So what does the junior get from all this?"}, {"label": "What the junior gets", "notes": "ZUBIA: Answers without pulling the expert away. Repeated discussions drop. Work continues.\nZUBIA: This is performance support at the moment of the task. It is apprenticeship, every day. Continuous learning and growth.\nZUBIA: Is there research behind this? Yes."}, {"label": "Research", "notes": "ZUBIA: Marcos, what does research say about AI that supports the people doing the work?\nMARCOS: This study is by Brynjolfsson, Li, and Raymond, in the Quarterly Journal of Economics, 2025. A generative AI assistant was rolled out in stages to 5,179 customer chat support analysts at a Fortune 500 software company. It suggested replies in real time. The paper calls these analysts agents.\nMARCOS: On average, analysts resolved 14% more issues per hour.\nMARCOS: For novice and low-skilled analysts the gain was 34%. For experienced and highly skilled analysts the effect was minimal.\nMARCOS: The authors describe suggestive evidence that the tool spreads what stronger performers do to newer analysts and helps them gain experience faster. They also report better customer sentiment, with fewer requests to escalate to a manager. Fewer analysts left, mostly among those with under six months of tenure.\nMARCOS: That matches tonight's idea. The newest people gain the most when the way the best people work is built into the tool.\nMARCOS: This was a customer support chat tool built by other people. It is outside evidence. It says nothing about our systems.\nMARCOS: Building the tool is half the job. The other half is adoption."}, {"label": "Section: Adoption", "notes": "MARCOS: That brings us to adoption."}, {"label": "Adoption (Marcos)", "notes": "MARCOS: Prosci studied 1,107 professionals: frontline employees, team leaders, and executives.\nMARCOS: Their headline: 63% of AI implementation challenges stem from human factors.\nMARCOS: The biggest single piece Prosci names is user proficiency, 38% of the failure points.\nMARCOS: Building the tool is the easy part. Getting people to use it is the hard part.\nMARCOS: So what helps people use it?"}, {"label": "Managers and AI use", "notes": "MARCOS: Gallup's AI indicator, as of May 2026, looks at employees in organizations that have put AI in place.\nMARCOS: Only 36% strongly agree their manager supports their team's use of AI.\nMARCOS: Employees who do strongly agree are 1.7 times as likely to use AI a few times a week or more.\nMARCOS: Gallup shows a link. It does not show that manager support causes the use.\nMARCOS: We coach managers to support their team, and coach the team to use the tool.\nMARCOS: And fit with the work matters just as much."}, {"label": "Fit with the work", "notes": "MARCOS: Gallup surveyed 23,717 employed U.S. adults from February 4 to 19, 2026. The margin of error is plus or minus 0.9 points. Gallup published it April 12.\nMARCOS: Take the employees in organizations that make AI available. Among those who strongly agree the AI tools integrate well with the systems and processes they use at work, 88% use AI a few times a week or more. Among those who do not strongly agree, 55%.\nMARCOS: Two separate groups. The numbers do not add to 100.\nMARCOS: It shows a link between fit and use. It does not prove cause.\nMARCOS: Design around the job. Pick the tool after.\nMARCOS: Which brings us to one rule."}, {"label": "Build around the job", "notes": "MARCOS: Start from the task. Then pick the tool. That order is the whole rule.\nMARCOS: Zubia, bring it home.\nZUBIA: The expert's knowledge becomes a tool the whole team can use. That works when the knowledge is captured the right way before the tool is built.\nZUBIA: Let us put the whole story together."}, {"label": "Recap", "notes": "ZUBIA: Let us put the whole story together. Four steps, then adoption.\nZUBIA: Step 1, list the tasks. Step 2, pick the right ones. Step 3, the Zone check places each task. Step 4, the five layers fill in what the expert knows, and the chat tool answers from them.\nZUBIA: Then the team adopts it. That was Marcos's part.\nZUBIA: The expert's knowledge becomes a tool the whole team can use."}, {"label": "Close", "notes": "ZUBIA: Remember the person who just knows? The one who answered questions on vacation?\nZUBIA: Her rules now run the routine work. Her judgment is protected. The junior learns from her every day, even when she is out.\nZUBIA: Next time, she takes the vacation.\nZUBIA: Marcos, why do you do this work?\nMARCOS: [Marcos closes with his own reason for doing this work, in his own words.]\nZUBIA: Thank you. If you missed the quiz, the link is on the slide. SPIN will share the slides."}, {"label": "Questions", "notes": "ZUBIA: We would love your questions."}]; var i=0, t0=Date.now(), fs=24, linked=false, lastSeq=null, remoteOk=false; if(window.innerWidth<600) fs=19;
 var $=function(x){return document.getElementById(x)};
 var KS="fyz-notes-key"; try{ $("key").value=localStorage.getItem(KS)||""; }catch(e){}

 function show(){ var d=D[i]||{label:"",notes:""};

  var box=$("notes"); box.textContent="";

   if(!line.trim()) return; var m=/^(ZUBIA|MARCOS):\s*(.*)$/.exec(line); var row=el("div","ln");
   if(m){ var chip=el("span","tag "+m[1], m[1]); row.appendChild(chip); row.appendChild(el("span","txt",m[2])); }
   else row.appendChild(el("span","txt",line));
   box.appendChild(row); });
  var n=D[i+1]; $("next").textContent=""; if(n){var b=el("b","", "Next: "+n.label); $("next").appendChild(b);}
  document.documentElement.style.setProperty("--fs",fs+"px"); }
 function setStatus(t,warn){ $("status").textContent=t; $("status").className="status"+(warn?" warn":""); }
 var bc=null;
 try{ bc=new BroadcastChannel("fyz-deck");
  bc.onmessage=function(e){ if(e.data&&typeof e.data.slide==="number"){ i=Math.min(e.data.slide,D.length-1); linked=true; setStatus("Linked to the deck in this browser"); show(); } };
  bc.postMessage({hello:true});
 }catch(e){}
 function keyVal(){ return $("key").value.trim(); }
 function goTo(n){ n=Math.max(0,Math.min(D.length-1,n)); i=n; show();
  if(bc){ try{ bc.postMessage({goto:n}); }catch(e){} }
  var k=keyVal();
  if(k){ fetch("/api/live/host/remote",{method:"POST",headers:{"content-type":"application/json","x-host-key":k},body:JSON.stringify({slide:n})}).then(function(r){ remoteOk=r.ok; if(r.status===401) setStatus("Wrong host key",true); else if(r.status===503) setStatus("Host key is not set on the server",true); else if(r.ok) setStatus(linked?"Linked to the deck in this browser":"Controlling the deck through the server"); }).catch(function(){ setStatus("No connection to the server",true); }); }
  else if(!linked) setStatus("Enter the host key to control the deck from this device",true); }
 function poll(){ if(linked||document.hidden) return;
  fetch("/api/live/remote/state",{cache:"no-store"}).then(function(r){return r.json()}).then(function(s){ if(!s.fresh){ if(!remoteOk) setStatus(keyVal()?"The deck has not reported in the last 30 minutes. Open it with ?remote=1.":"The deck has not reported in the last 30 minutes. Enter the host key to control it.",true); return; } if(typeof s.slide==="number"&&s.total>0){ if(lastSeq===null||s.slide!==i){ i=Math.min(s.slide,D.length-1); show(); } lastSeq=s.seq; if(!keyVal()) setStatus("Following the deck. Enter the host key to control it."); else if(!remoteOk) setStatus("Following the deck through the server"); } }).catch(function(){ setStatus("No connection to the server",true); }); }
 setTimeout(function(){ if(!linked){ setStatus("Not linked in this browser. Using the server. The deck must be open with ?remote=1",true); } },2500);
 setInterval(poll,2500); poll();
 $("prev").onclick=function(){ goTo(i-1); }; $("first").onclick=function(){ goTo(0); }; $("nx").onclick=function(){ goTo(i+1); };
 $("sm").onclick=function(){ fs=Math.max(16,fs-2); show(); }; $("lg").onclick=function(){ fs=Math.min(60,fs+2); show(); };

 setInterval(function(){ var s=Math.floor((Date.now()-t0)/1000), m=Math.floor(s/60); $("clock").textContent=(m<10?"0":"")+m+":"+(s%60<10?"0":"")+(s%60); },1000);
