<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Presenter remote | Ask, Act, Tell Dashboards</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/live/live.css">
<style>
 body{padding:16px 5vw 120px;min-height:100vh}
 .top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:12px;gap:16px;flex-wrap:wrap}
 .clock{font-size:26px;font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums;text-align:right}
 .status{font-size:13px;color:var(--slate);text-align:right}
 .status.warn{color:var(--coral)}
 .eyebrow{color:var(--teal);font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:14px;margin-top:18px}
 h1{color:var(--navy);font-size:30px;margin:6px 0 14px;line-height:1.2}
 .ln{display:flex;gap:12px;align-items:baseline;margin:0 0 14px;max-width:70ch}
 .tag{flex:0 0 auto;font-size:12px;font-weight:800;letter-spacing:.08em;padding:3px 8px;border-radius:6px;background:var(--teal-soft);color:var(--navy);min-width:64px;text-align:center}
 
 .tag.KEVIN{background:#C1272D;color:#fff}
 .ln.KEVIN .txt{font-weight:700;color:#8a1c20}
 
 .txt{font-size:var(--fs,24px);line-height:1.45;color:var(--ink)}
 .next{margin-top:24px;padding-top:14px;border-top:1px solid var(--line);color:var(--slate);font-size:15px}
 .next b{color:var(--navy)}
 .bar{position:fixed;left:0;right:0;bottom:0;background:var(--white);border-top:1px solid var(--line);padding:10px 5vw calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px;align-items:center}
 .bar button{font:inherit;font-size:18px;font-weight:700;padding:16px 10px;border-radius:12px;border:2px solid var(--navy);background:var(--white);color:var(--navy);flex:1}
 .bar button.go{background:var(--navy);color:var(--white);flex:2}
 .bar button:active{opacity:.7}
 .tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
 .tools button,.tools input{font:inherit;font-size:14px;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--white);color:var(--navy)}
</style></head><body>
<div class="top"><div class="brand"><img src="/live/mascot.png" alt=""><div><div class="name">Dr. Data Decision Intelligence</div><div class="tag2" style="font-size:11px;letter-spacing:.12em;color:var(--teal);font-weight:600;text-transform:uppercase">Presenter notes</div></div></div>
<div><div class="clock" id="clock">00:00</div><div class="status" id="status">Waiting for the deck</div></div></div>
<div class="eyebrow" id="pos"></div><h1 id="title"></h1><div id="notes"></div>
<div class="next" id="next"></div>
<div class="tools"><button id="sm" type="button">Smaller text</button><button id="lg" type="button">Larger text</button><button id="rst" type="button">Reset timer</button></div>
<div class="bar"><button id="first" type="button">First slide</button><button id="prev" type="button">Back</button><button id="nx" class="go" type="button">Next slide</button></div>
<script>
(function(){
 var D=[{"label": "01 Title", "notes": "ZUBIA: Good afternoon. I have one idea for you today. A dashboard is worth the decisions it helps you make.\nZUBIA: Before I show you any dashboards, let me tell you why we are talking about them at all."}, {"label": "02 Why we are talking", "notes": "ZUBIA: Before any dashboards, three problems I hear from owners every week.\nZUBIA: One. The numbers live in six places. A simple question like did Friday make money takes an hour and still ends in a guess.\nZUBIA: Two. Customers drift away. Regulars at a bar, past clients of an agent, leads nobody called back. The owner finds out weeks later.\nZUBIA: Three. Business data is going into public AI tools, often without anyone deciding it should.\nZUBIA: Ask the room: Which one of these sounds like your week? Hands up for one, two or three.\nZUBIA: Transition: The third one has a number behind it."}, {"label": "03 Where the data goes", "notes": "ZUBIA: Startups.co.uk and Sage surveyed more than 400 UK founders, owners and executives. The report is The Startup AI Paradox, July 2026.\nZUBIA: Half said they shared sensitive company information with public AI tools in the past month.\nZUBIA: It is a UK survey, and Sage helped run it. The behavior is the point. Business data is going into public tools every day.\nKEVIN: Invite Kevin in. \"Kevin, you see this in client offices. What does it look like when staff paste business data into a free AI tool?\" One or two sentences from him, then continue.\nZUBIA: Transition: That is why I build private systems on the owner's own data. Let me introduce myself."}, {"label": "04 Who you are hearing from", "notes": "ZUBIA: I am Zubia Mughal, Dr. Data.\nZUBIA: I build private AI systems for small and medium businesses, on the business's own data.\nZUBIA: I have built and installed 12 private AI systems across 10 industries since March 2026.\nZUBIA: Today I will walk those three problems through one story, about a bar and grill owner named Jane. First, I need your phones for one minute."}, {"label": "05 Scan to join", "notes": "ZUBIA: Take out your phone and scan this code.\nZUBIA: You are joining the loyalty card for a demo venue called Test Bar. A first name is enough.\nZUBIA: I delete this demo list after today's session.\nZUBIA: Mary Jane is our bartender today. Show her the card code on your phone, and she confirms a purchase.\nZUBIA: Keep your phone handy. We come back to this list later, and you will see yourselves on the screen.\nZUBIA: Transition: While you scan, let me introduce Jane."}, {"label": "06 Section: Numbers in six places", "notes": "ZUBIA: Story: Jane owns a neighborhood bar and grill. Forty seats, a busy Friday fish fry, trivia on Thursdays.\nZUBIA: Every Monday morning she sits down with a coffee and one question."}, {"label": "07 Did the fish fry make money?", "notes": "ZUBIA: Her question is simple. Did Friday's fish fry make money?\nZUBIA: Sales are in the point of sale. Hours are in the schedule app. The cost of the cod is on a supplier invoice in a folder.\nZUBIA: Reviews are on Google. Her guests are in an email list. Everything else is in a spreadsheet her manager started two years ago.\nZUBIA: Forty-five minutes later Jane is still guessing. Each app answers part of the question.\nZUBIA: Ask the room: How many of you open more than three apps to answer one question about your business? Show of hands.\nZUBIA: Transition: So what did Jane do?"}, {"label": "08 Six places, one table", "notes": "ZUBIA: Jane pulled the six places into one table. One row per sale: date, guest, item, price, cost.\nZUBIA: Each sale joins to the supplier price on item and date. Now margin is a column.\nZUBIA: Did the fish fry make money? Sixty-two percent margin on the cod. One look. These rows are sample data.\nZUBIA: Every number keeps a link back to where it came from. When her accountant asks where a number came from, she can show him.\nZUBIA: Transition: The table answered one question. But a table full of numbers is still not a decision."}, {"label": "09 Section: One decision", "notes": "ZUBIA: Here is where I want you to work with me.\nZUBIA: Ask the room: Think of one decision you make every week in your business. A price, a staffing level, an order, a promotion. Hold onto it. We will build a dashboard around it together."}, {"label": "10 One decision per dashboard", "notes": "ZUBIA: Story: Jane's supplier just raised the price of chicken wings. Her decision: do we raise the menu price?\nZUBIA: Every dashboard I build starts with four things. The decision. The number it needs. Who decides. By when.\nZUBIA: For Jane: raise the chicken wing price? The number is chicken wing margin after this week's supplier price. The general manager decides. By Friday.\nZUBIA: Ask the room: Now take your decision. What one number would settle it? Who in your business makes the call? Take ten seconds.\nZUBIA: Ask two people to share. Repeat each answer back in the four parts: decision, number, who, when.\nZUBIA: If a chart on a screen has no decision attached, cut it.\nZUBIA: Transition: Gartner has a simple way to describe what that screen should do."}, {"label": "11 Ask, Act, Tell", "notes": "ZUBIA: Gartner describes three jobs for a useful screen. Ask, Act, Tell.\nZUBIA: Ask: what happened? Act: what do we do about it? Tell: who needs to know?\nZUBIA: Where the three overlap is the one decision you just picked.\nZUBIA: Take Jane's chicken wings. Ask: wing margin fell from 68 to 63 percent. Act: raise the price 75 cents. Tell: Jane gets one sentence on Monday.\nZUBIA: We add a fourth: a safety button. If the margin drops below a line Jane set, the screen pauses and Jane decides the next step. Nothing changes on its own.\nZUBIA: Transition: Here is that chicken wing decision on one screen."}, {"label": "12 One dashboard: Ask, Act, Tell, Safety button", "notes": "ZUBIA: Here is Jane's screen for one decision: the chicken wing price. Sample numbers.\nZUBIA: Ask. Chicken wing margin was 68 percent last month. This week it is 63 percent. The supplier raised a 10 piece order from 3.90 to 4.40. That is 13 percent.\nZUBIA: Act. The screen proposes one action. Raise chicken wings from 12 dollars to 12.75, which brings margin back to 65 percent. The general manager approves or holds it, by Friday.\nZUBIA: Tell. On Monday Jane gets one sentence, written from the same numbers.\nZUBIA: Safety button. Jane set two lines. Margin below 60 percent, or a price change over 10 percent, and the screen pauses. Jane decides the next step. It is a safety valve, so nobody is surprised when they do the books.\nZUBIA: Ask the room: Picture your decision on a screen like this. What would the Ask box show?\nZUBIA: Transition: That solved Jane's first problem. Her second problem was harder to see."}, {"label": "13 Section: Guests who drift away", "notes": "ZUBIA: Story: Joe came to Jane's every Thursday for trivia. Four years. Same seat, same beer.\nZUBIA: Then he stopped coming. Five weeks went by before anyone noticed."}, {"label": "14 Every scan is a row of data", "notes": "ZUBIA: Jane had no way to see it. Joe paid cash. He was a familiar face with no record.\nZUBIA: A loyalty card changes that. Every time a guest scans, the venue records who they are, when they came, and how often.\nZUBIA: The guest agreed to join, and the date they agreed is stored. No payment card details are collected.\nZUBIA: That is a guest list the venue owns. A marketing team pays for this kind of data. Jane builds it at the bar.\nZUBIA: Ask the room: Who here has a regular who stopped coming, and you only noticed later?\nZUBIA: Transition: You have been building one of these lists for the last twenty minutes. Let us look."}, {"label": "15 Jane's guest screen", "notes": "ZUBIA: This is the loyalty list you just joined, as Jane sees it for her own bar every morning. Sample numbers.\nZUBIA: Ask. Who has not been back in 30 days? Seven regulars. Joe is one of them: 14 visits, last seen October 1.\nZUBIA: Act. The screen drafts one win-back offer. Your next visit earns a clear tote with our logo. Jane approves or holds it.\nZUBIA: Tell. The bartenders get one line for Thursday: Joe may be in, greet him by name.\nZUBIA: Safety button. Only guests who agreed to join get a message. Jane approves every one. A second offer to the same guest within 30 days pauses the screen.\nZUBIA: Your names from today are on the real version of this list. Mary Jane confirmed your purchases.\nZUBIA: Transition: So what does Jane decide from this list?"}, {"label": "16 Four decisions the guest list answers", "notes": "ZUBIA: Here is what Jane decides from that list.\nZUBIA: Who are our regulars? Thank them by name, and give them first look at a new special.\nZUBIA: Who has not been back in 30 days? Joe gets a win-back offer the week he drifts.\nZUBIA: Which night brings new sign-ups? Put the promotion money behind that night.\nZUBIA: Which reward brings guests back? Change it each quarter, and compare return visits.\nZUBIA: Ask the room: Which one of these would you want on your screen Monday morning? Quick show of hands for each.\nZUBIA: Transition: Jane runs a bar. Most of you do not. Let me show you the same screen in two other businesses."}, {"label": "17 Section: Same screen, your industry", "notes": "ZUBIA: Jane runs a bar. Most of you do not. The same four jobs work in any business.\nZUBIA: Here are two more: a home builder and a real estate agent."}, {"label": "18 Builder screen", "notes": "ZUBIA: Tom builds custom homes. His weekly question: is this job still making money, and what changes on the next bid?\nZUBIA: Ask. Electrical came in 13 percent over budget on the last job. 18,000 budgeted, 20,400 actual. Copper wire prices are up 27 percent over the past year. That is a public number from the federal producer price index.\nZUBIA: Act. The screen proposes raising the electrical allowance on the next bid to 20,400. Tom approves or holds it before Thursday's bid.\nZUBIA: Tell. The estimator gets one sentence with the reason.\nZUBIA: Safety button. Tom set the line: any cost line more than 1,000 dollars or 10 percent over budget pauses the bid. Tom signs off before it goes out.\nZUBIA: Ask the room: Builders and trades in the room, which line on your jobs runs over most often?\nZUBIA: Transition: Now a real estate agent."}, {"label": "19 Agent screen", "notes": "ZUBIA: Kate is a real estate agent. She is out showing properties most of the day. Her question: did every new lead get a hello?\nZUBIA: Ask. Three leads came in while she was out. One home valuation request, two contact forms.\nZUBIA: Act. If nobody replies in 15 minutes, a welcome email goes out in Kate's words, with her signature. When the lead calls back, they are already warm. The screen tells Kate who to call first.\nZUBIA: Tell. Once a month her past clients get the market numbers for their county, from public data, with an opt-out.\nZUBIA: Safety button. Kate approved the welcome email once. Anything about price or an offer pauses, and Kate answers herself.\nZUBIA: Ask the room: Agents in the room, how long does a new lead wait when you are at a showing?\nZUBIA: Transition: Three businesses, one method."}, {"label": "20 One method, many industries", "notes": "ZUBIA: Three businesses, one method. Ask, Act, Tell, and a safety button where a person decides.\nZUBIA: We build this for law firms, clinical practices, energy assessors, coaches, consultants, restoration companies and event planners too.\nZUBIA: Ask the room: Whatever your business, which of these four boxes would you fill first?\nZUBIA: Transition: All of this puts your data in one place. That makes it valuable. So who can get to it?"}, {"label": "21 Section: Keeping it safe", "notes": "ZUBIA: Now Jane has her sales, her costs and her guest list in one place. That makes it valuable.\nZUBIA: Who can get to it?\nKEVIN: Invite Kevin to stand with you for the next two slides."}, {"label": "22 A person approves the message", "notes": "ZUBIA: The system drafts the win-back message to Joe. Jane reads it and approves it before it goes out.\nZUBIA: Every approval is logged with the time. That log is her record of what she decided, and when.\nKEVIN: \"Kevin, who should be able to log in to a list like this?\" Let him answer in a sentence or two.\nZUBIA: Remember the third problem from the start: data going into public tools. Jane's data stays in her own system.\nZUBIA: Transition: Keeping it there takes two jobs."}, {"label": "23 Two jobs, two partners", "notes": "ZUBIA: Two jobs keep Jane's dashboard working.\nZUBIA: My job: put her numbers in one table, build the screen around her decisions, and track her guests.\nZUBIA: Kevin's job: keep it safe. Brew City PC provides managed IT, cybersecurity and technology infrastructure.\nKEVIN: \"Kevin, anything you want them to listen for in your talk?\" Then: Let me pull it together.\nZUBIA: Kevin covers questions like these: who can log in, what happens when a laptop is lost, and how the data is backed up. You will hear that from him next.\nZUBIA: Transition: Let me pull it together."}, {"label": "24 Summary", "notes": "ZUBIA: Here is what I hope you take home.\nZUBIA: Put the numbers in one table, so one question gets one answer.\nZUBIA: Build one dashboard per decision: Ask, Act, Tell, and a safety button where a person decides.\nZUBIA: Watch your customers, so drift shows up the week it starts. Bar, builder or agent, it is the same method.\nZUBIA: Keep a person in charge of every message, and keep the data safe. That last part is Kevin's talk.\nZUBIA: Transition: Now my offer."}, {"label": "25 Close", "notes": "ZUBIA: Bring me the decision you thought about today. At the networking hour we can sketch your screen together: the Ask, the Act, the Tell and the safety button.\nZUBIA: Scan this, or find me after. Mary Jane has my details too.\nZUBIA: Thank you.\nKEVIN: Hand over to Kevin. \"Kevin, they are all yours.\""}]; var i=0, t0=Date.now(), fs=24, linked=false, lastSeq=null, remoteOk=false; if(window.innerWidth<600) fs=19;
 var $=function(x){return document.getElementById(x)};
 function el(t,c,x){var n=document.createElement(t); if(c)n.className=c; if(x!==undefined)n.textContent=x; return n;}
 function show(){ var d=D[i]||{label:"",notes:""};
  $("pos").textContent="Slide "+(i+1)+" of "+D.length; $("title").textContent=d.label;
  var box=$("notes"); box.textContent="";
  (d.notes||"No notes for this slide.").split("\n").forEach(function(line){
   if(!line.trim()) return; var m=/^(ZUBIA|KEVIN):\s*(.*)$/.exec(line); var row=el("div","ln"+(m?" "+m[1]:""));
   if(m){ var chip=el("span","tag "+m[1], m[1]); row.appendChild(chip); row.appendChild(el("span","txt",m[2])); }
   else row.appendChild(el("span","txt",line));
   box.appendChild(row); });
  var n=D[i+1]; $("next").textContent=""; if(n){var b=el("b","", "Next: "+n.label); $("next").appendChild(b);}
  document.documentElement.style.setProperty("--fs",fs+"px"); }
 function setStatus(t,warn){ $("status").textContent=t; $("status").className="status"+(warn?" warn":""); }
 var bc=null;
 try{ bc=new BroadcastChannel("cd-deck");
  bc.onmessage=function(e){ if(e.data&&typeof e.data.slide==="number"){ i=Math.min(e.data.slide,D.length-1); linked=true; setStatus("Linked to the deck in this browser"); show(); } };
  bc.postMessage({hello:true});
 }catch(e){}
 function goTo(n){ n=Math.max(0,Math.min(D.length-1,n)); i=n; show();
  if(bc){ try{ bc.postMessage({goto:n}); }catch(e){} }
  fetch("/api/live/deck/goto",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({slide:n})}).then(function(r){ setStatus(r.ok?"Controlling the deck":"Could not reach the deck",!r.ok); }).catch(function(){ setStatus("No connection to the server",true); }); }
 function poll(){ if(lastSeq!==null||document.hidden) return;
  fetch("/api/live/deck/state",{cache:"no-store"}).then(function(r){return r.json()}).then(function(s){ lastSeq=s.seq; if(typeof s.cmd==="number"){ i=Math.min(s.cmd,D.length-1); show(); } setStatus("Ready. Tap Next slide."); }).catch(function(){ setStatus("No connection to the server",true); }); }
 poll();
 $("prev").onclick=function(){ goTo(i-1); }; $("first").onclick=function(){ goTo(0); }; $("nx").onclick=function(){ goTo(i+1); };
 $("sm").onclick=function(){ fs=Math.max(16,fs-2); show(); }; $("lg").onclick=function(){ fs=Math.min(60,fs+2); show(); };
 $("rst").onclick=function(){ t0=Date.now(); };
 document.addEventListener("keydown",function(e){ if(e.key==="ArrowRight") $("nx").click(); if(e.key==="ArrowLeft") $("prev").click(); });
 setInterval(function(){ var s=Math.floor((Date.now()-t0)/1000), m=Math.floor(s/60); $("clock").textContent=(m<10?"0":"")+m+":"+(s%60<10?"0":"")+(s%60); },1000);
 show();
})();
</script></body></html>
