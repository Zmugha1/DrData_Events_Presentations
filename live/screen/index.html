<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Find Your Zone | Live screen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/live/live.css">
<style>
  table.steps { width: 100%; border-collapse: collapse; margin-top: 2vh; font-size: 2.2vh; }
  table.steps th, table.steps td { text-align: left; padding: 1.1vh 1vw; border-bottom: 1px solid var(--line); }
  table.steps td + td, table.steps th + th { text-align: center; }
  html, body { height: 100%; overflow: hidden; }
  .stage { height: 100vh; display: grid; grid-template-rows: auto 1fr auto; padding: 2.2vh 4vw 1.6vh; gap: 1.6vh; }
  header { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); padding-bottom: 1.4vh; }
  header .brand img { width: 5.2vh; height: 5.2vh; }
  header .brand .name { font-size: 2vh; }
  header .brand .tag { font-size: 1.3vh; }
  .joined { text-align: right; color: var(--navy); }
  .joined b { font-size: 4vh; font-weight: 800; display: block; line-height: 1; }
  .joined span { font-size: 1.6vh; color: var(--slate); text-transform: uppercase; letter-spacing: 0.1em; }
  main { display: flex; flex-direction: column; justify-content: center; min-height: 0; }
  .eyebrow { color: var(--teal); font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; font-size: 2.2vh; }
  h1.big { font-size: 7vh; color: var(--navy); line-height: 1.08; margin: 1vh 0 1.2vh; font-weight: 800; }
  .qtext { font-size: 4.6vh; color: var(--navy); font-weight: 700; line-height: 1.2; margin: 1.2vh 0 3vh; max-width: 88vw; }
  .opt { position: relative; display: grid; grid-template-columns: 6.4vh 1fr auto; align-items: center; gap: 2vh; border: 2px solid var(--line); background: var(--white); border-radius: 1.6vh; margin-bottom: 1.6vh; padding: 1.6vh 2vh; overflow: hidden; }
  .opt .bar { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--teal-soft); transition: width 0.5s ease; z-index: 0; }
  .opt.lead .bar { background: #b9e9e9; }
  .opt > * { position: relative; z-index: 1; }
  .opt .letter { width: 5.2vh; height: 5.2vh; border-radius: 50%; background: var(--navy); color: var(--white); font-weight: 800; font-size: 2.6vh; display: grid; place-items: center; }
  .opt .t { font-size: 3vh; color: var(--ink); line-height: 1.25; }
  .opt .n { font-size: 3.4vh; font-weight: 800; color: var(--navy); text-align: right; min-width: 14vh; }
  .opt .n small { font-size: 2vh; font-weight: 600; color: var(--slate); margin-left: 0.8vh; }
  .meta { color: var(--slate); font-size: 2.2vh; margin-top: 2vh; }
  .lobby { display: grid; grid-template-columns: 1fr auto; gap: 6vw; align-items: center; }
  .qr { background: var(--white); border: 2px solid var(--line); border-radius: 2vh; padding: 2.4vh; }
  .qr svg { display: block; width: 44vh; height: 44vh; }
  .url { font-size: 4vh; font-weight: 800; color: var(--navy); margin-top: 2vh; word-break: break-all; }
  .zones { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2vw; margin-top: 2.4vh; }
  .zcard { background: var(--white); border: 2px solid var(--line); border-radius: 2vh; padding: 3vh 2.4vw; }
  .zcard .zn { font-size: 2.2vh; letter-spacing: 0.12em; font-weight: 700; color: var(--teal); }
  .zcard .zm { font-size: 2.2vh; font-weight: 600; color: var(--navy); margin-top: 0.6vh; }
  .zcard .zc { font-size: 10vh; font-weight: 800; color: var(--navy); line-height: 1; margin: 1.2vh 0 0.4vh; }
  .zcard .zp { font-size: 2.6vh; color: var(--slate); }
  .zcard.top { border-color: var(--navy); }
  .jobs { margin-top: 3vh; display: flex; flex-wrap: wrap; gap: 1.4vh 1.6vw; font-size: 2.6vh; color: var(--navy); }
  .jobs span { background: var(--white); border: 2px solid var(--line); border-radius: 99px; padding: 0.8vh 1.8vh; }
  .jobs b { font-weight: 800; }
  footer { display: flex; align-items: center; justify-content: space-between; color: var(--slate); font-size: 1.6vh; min-height: 4vh; }
  #emails { position: fixed; inset: 0; background: rgba(45,68,89,.55); display: none; align-items: center; justify-content: center; z-index: 50; }
  #emails.show { display: flex; }
  #emails .box { background: var(--white); color: var(--navy); border-radius: 1.4vh; padding: 3vh 3.4vh; width: min(92vw, 900px); max-height: 88vh; overflow: auto; font-size: 2vh; }
  #emails h2 { margin: 0 0 1.4vh; font-size: 3vh; }
  #emails input[type=password] { font: inherit; padding: 1.2vh; border: 2px solid var(--line); border-radius: 0.8vh; width: 100%; box-sizing: border-box; margin: 1vh 0; }
  #emails button { font: inherit; padding: 1.1vh 1.8vh; border-radius: 0.8vh; border: 1px solid var(--navy); background: var(--white); color: var(--navy); margin: 0.6vh 0.8vh 0.6vh 0; cursor: pointer; }
  #emails button.go { background: var(--navy); color: var(--white); }
  #emails table { border-collapse: collapse; width: 100%; margin-top: 1.4vh; }
  #emails th, #emails td { text-align: left; padding: 0.8vh 1vh; border-bottom: 1px solid var(--line); font-size: 1.9vh; word-break: normal; }
  #emails td:first-child { word-break: break-all; }
  #emails .note { color: #4A5E70; margin: 0.8vh 0; }
  #emails .err { color: #B3261E; margin: 0.8vh 0; }
  .ctl { display: flex; gap: 1vh; align-items: center; opacity: 0.0; transition: opacity 0.25s; }
  .ctl.show, footer:hover .ctl { opacity: 1; }
  .ctl button, .ctl input { font: inherit; font-size: 1.7vh; padding: 0.8vh 1.4vh; border-radius: 0.8vh; border: 1px solid var(--line); background: var(--white); color: var(--navy); }
  .ctl button.go { background: var(--navy); color: var(--white); border-color: var(--navy); }
  .msg { color: var(--coral); font-weight: 600; }
  .hint { color: var(--slate); }
    body.qmode footer { display: none; }
</style>
</head>
<body>
<div class="stage">
  <header>
    <div class="brand"><img src="/live/mascot.png" alt="Dr. Data mascot"><div><div class="name">Dr. Data Decision Intelligence</div><div class="tag">Find Your Zone, live</div></div></div>
    <div class="joined"><b id="joined">0</b><span>in the room</span></div>
  </header>
  <main id="main"></main>
  <footer>
    <div class="hint" id="hint">Press C for controls. Arrow keys move between questions.</div>
    <div class="ctl" id="ctl">
      <span class="msg" id="msg"></span>
      <input id="key" type="hidden">
      <button id="back" type="button">Back</button>
      <button id="next" type="button" class="go">Next</button>
      <button id="lobby" type="button">Lobby</button>
      <button id="results" type="button">Results</button>
      <button id="export" type="button">Export emails</button>
      <button id="reset" type="button">New session</button>
    </div>
  </footer>
</div>
<div id="emails"><div class="box">
  <h2>Emails from this session</h2>
  <div id="em-ask"><div class="note">Enter the export key (HOST_KEY from Netlify).</div>
  <input id="em-key" type="password" autocomplete="off" placeholder="Export key"><div><button id="em-go" class="go" type="button">Show emails</button><button id="em-close" type="button">Close</button></div></div>
  <div id="em-out" style="display:none"></div>
  <div class="err" id="em-err"></div>
</div></div>
<script src="/live/qrcode.js"></script>
<script>
(function () {
  "use strict";
  var main = document.getElementById("main"), joinedEl = document.getElementById("joined");
  var ctl = document.getElementById("ctl"), keyIn = document.getElementById("key"), msg = document.getElementById("msg");
  var quiz = null, state = null, zones = null, hideT = null, lastSig = "";
  var AT = (function () { var m = /[?&]at=(\d+)/.exec(location.search); return m ? Number(m[1]) : null; })();
  var LETTERS = "ABCDEFG";
  // ?e=<id> runs one event's quiz. No id: the original Find Your Zone quiz.
  var EV = (/[?&]e=([a-z0-9-]{1,40})(&|$)/.exec(location.search) || [])[1] || "";
  function withEv(p) { return EV ? p + (p.indexOf("?") >= 0 ? "&" : "?") + "e=" + EV : p; }
  var joinUrl = location.origin + "/join" + (EV ? "?e=" + EV : "");
  try { keyIn.value = sessionStorage.getItem("fyz-host") || ""; } catch (e) {}

  function el(tag, cls, text) { var n = document.createElement(tag); if (cls) n.className = cls; if (text !== undefined) n.textContent = text; return n; }
  function getJSON(p, h) { return fetch("/api/live/" + withEv(p), { headers: h || {} }).then(function (r) { if (r.status === 410) window.__liveOff = true; return r.json().then(function (j) { j._status = r.status; return j; }); }); }
  function post(p, body) { return fetch("/api/live/" + withEv(p), { method: "POST", headers: { "content-type": "application/json", "x-host-key": keyIn.value }, body: JSON.stringify(body || {}) }).then(function (r) { return r.json().then(function (j) { j._status = r.status; return j; }); }); }
  function flash(t) { msg.textContent = t; ctl.classList.add("show"); clearTimeout(hideT); hideT = setTimeout(function () { ctl.classList.remove("show"); msg.textContent = ""; }, 4000); }

  function qrSvg(text) {
    var qr = qrcode(0, "M"); qr.addData(text); qr.make();
    var n = qr.getModuleCount(), m = 2, size = n + m * 2, d = "";
    for (var r = 0; r < n; r++) for (var c = 0; c < n; c++) if (qr.isDark(r, c)) d += "M" + (c + m) + " " + (r + m) + "h1v1h-1z";
    var ns = "http://www.w3.org/2000/svg", s = document.createElementNS(ns, "svg");
    s.setAttribute("viewBox", "0 0 " + size + " " + size); s.setAttribute("role", "img"); s.setAttribute("aria-label", "QR code to join the quiz");
    var bg = document.createElementNS(ns, "rect"); bg.setAttribute("width", size); bg.setAttribute("height", size); bg.setAttribute("fill", "#ffffff"); s.appendChild(bg);
    var p = document.createElementNS(ns, "path"); p.setAttribute("d", d); p.setAttribute("fill", "#2d4459"); p.setAttribute("shape-rendering", "crispEdges"); s.appendChild(p);
    return s;
  }

  function renderLobby() {
    var wrap = el("div", "lobby"), left = el("div");
    left.appendChild(el("div", "eyebrow", "Join the quiz"));
    left.appendChild(el("h1", "big", "Scan to find your zone"));
    var stepped = quiz.questions[0] && quiz.questions[0].parts;
    left.appendChild(el("p", "meta", stepped ? quiz.questions.length + " steps of one job. Three quick questions each. Answer on your phone." : "Twelve questions. Answer on your phone. Results appear here as the room answers."));
    left.appendChild(el("div", "url", joinUrl.replace(/^https?:\/\//, "")));
    var qrBox = el("div", "qr"); qrBox.appendChild(qrSvg(joinUrl));
    wrap.appendChild(left); wrap.appendChild(qrBox);
    main.replaceChildren(wrap);
  }

  function renderSteps() {
    var s = state.step, q = quiz.questions[s], frag = document.createDocumentFragment();
    frag.appendChild(el("div", "eyebrow", q.label));
    frag.appendChild(el("div", "qtext", q.q));
    q.parts.forEach(function (pt, i) {
      var row = el("div", "opt");
      row.appendChild(el("div", "letter", String(i + 1)));
      row.appendChild(el("div", "t", pt.q));
      frag.appendChild(row);
    });
    frag.appendChild(el("div", "meta", (state.answered || 0) + " of " + Math.max(state.answered || 0, state.joined) + " answered all three"));
    main.replaceChildren(frag);
  }

  function renderStepResults() {
    var frag = document.createDocumentFragment(), z = zones;
    frag.appendChild(el("div", "eyebrow", "The room"));
    frag.appendChild(el("h1", "big", "Where each step landed"));
    var t = el("table", "steps"), h = el("tr");
    ["Step", "Below · Encode", "Inside · Assist", "Above · Research"].forEach(function (c) { h.appendChild(el("th", "", c)); });
    t.appendChild(h);
    (z ? z.steps : []).forEach(function (s) {
      var r = el("tr");
      r.appendChild(el("td", "", s.name));
      ["below", "inside", "above"].forEach(function (k) { r.appendChild(el("td", "", String(s.zones[k] || 0))); });
      t.appendChild(r);
    });
    frag.appendChild(t);
    frag.appendChild(el("div", "meta", z ? z.complete + (z.complete === 1 ? " person" : " people") + " answered at least one step. Each person sees their own Zone map on their phone." : "Waiting for results"));
    main.replaceChildren(frag);
  }

  function renderQuestion() {
    if (quiz.questions[state.step] && quiz.questions[state.step].parts) { renderSteps(); return; }
    var s = state.step, q = quiz.questions[s], counts = state.counts || [], total = counts.reduce(function (a, b) { return a + b; }, 0);
    var max = Math.max.apply(null, counts.concat([0]));
    var frag = document.createDocumentFragment();
    frag.appendChild(el("div", "eyebrow", "Question " + (s + 1) + " of " + quiz.questions.length + (q.part === 2 ? "  |  To tailor your result" : "")));
    frag.appendChild(el("div", "qtext", q.q));
    q.opts.forEach(function (t, i) {
      var row = el("div", "opt" + (max > 0 && counts[i] === max ? " lead" : ""));
      var bar = el("div", "bar"); bar.style.width = total ? Math.round((counts[i] / total) * 100) + "%" : "0%";
      row.appendChild(bar);
      row.appendChild(el("div", "letter", LETTERS[i]));
      row.appendChild(el("div", "t", t));
      var n = el("div", "n", String(counts[i] || 0)); n.appendChild(el("small", "", total ? Math.round(((counts[i] || 0) / total) * 100) + "%" : "0%"));
      row.appendChild(n);
      frag.appendChild(row);
    });
    frag.appendChild(el("div", "meta", total + " of " + Math.max(total, state.joined) + " answered"));
    main.replaceChildren(frag);
  }

  function renderResults() {
    if ((zones && zones.steps) || (quiz.questions[0] && quiz.questions[0].parts)) { renderStepResults(); return; }
    var frag = document.createDocumentFragment();
    frag.appendChild(el("div", "eyebrow", "The room"));
    frag.appendChild(el("h1", "big", "Where the room landed"));
    var z = zones || { zones: { below: 0, inside: 0, above: 0, oscillating: 0 }, complete: 0, joined: state.joined, jobs: {}, emails: 0 };
    var order = ["below", "inside", "above", "oscillating"], names = { below: "BELOW THE ZONE", inside: "INSIDE THE ZONE", above: "ABOVE THE ZONE", oscillating: "OSCILLATING" }, modes = { below: "Encode", inside: "Assist", above: "Research", oscillating: "Learn" };
    var max = Math.max(z.zones.below, z.zones.inside, z.zones.above, z.zones.oscillating || 0);
    var grid = el("div", "zones");
    order.forEach(function (k) {
      var c = el("div", "zcard" + (max > 0 && z.zones[k] === max ? " top" : ""));
      c.appendChild(el("div", "zn", names[k]));
      c.appendChild(el("div", "zm", "AI mode: " + modes[k]));
      c.appendChild(el("div", "zc", String(z.zones[k] || 0)));
      c.appendChild(el("div", "zp", z.complete ? Math.round(((z.zones[k] || 0) / z.complete) * 100) + "% of " + z.complete + " who answered" : "Waiting for results"));
      grid.appendChild(c);
    });
    frag.appendChild(grid);
    var jobs = el("div", "jobs");
    Object.keys(z.jobs || {}).sort(function (a, b) { return z.jobs[b] - z.jobs[a]; }).forEach(function (j) {
      var s = el("span"); s.appendChild(el("b", "", String(z.jobs[j]))); s.appendChild(document.createTextNode("  " + j)); jobs.appendChild(s);
    });
    if (Object.keys(z.jobs || {}).length) { frag.appendChild(el("div", "meta", "First job to automate, for people Below the Zone")); frag.appendChild(jobs); }
    frag.appendChild(el("div", "meta", "Work rarely sits in one Zone. Each person sees their own Zone and mix on their own phone."));
    main.replaceChildren(frag);
  }

  function render() {
    var sig = JSON.stringify([state.step, state.counts, state.joined, state.answered, zones && zones.zones, zones && zones.jobs, zones && zones.complete]);
    joinedEl.textContent = String(state.joined);
    // On a deck slide, show nothing until the quiz is on this slide's own step, so no other screen flashes.
    if (AT != null && state.step !== AT) { main.replaceChildren(); lastSig = ""; return; }
    if (sig === lastSig) return; lastSig = sig;
    if (state.step === -1) renderLobby();
    else if (state.step === quiz.resultsStep) renderResults();
    else renderQuestion();
  }

  function tick() {
    if (!quiz) { getJSON("quiz").then(function (j) { quiz = j; tick(); }); return; }
    getJSON("state").then(function (s) {
      state = s;
      if (s.step === quiz.resultsStep) {
        return getJSON("host/zones").then(function (z) { if (!z.error) zones = z; render(); });
      }
      render();
    }).catch(function () {});
  }

  function go(step) {
    post("host/goto", { step: step }).then(function (j) {
      if (j.error) { flash(j.error); return; }
      state = j; if (j.step !== quiz.resultsStep) zones = null; lastSig = ""; render(); tick();
    });
  }
  function cur() { return state ? state.step : -1; }
  document.getElementById("next").onclick = function () { go(Math.min(cur() + 1, quiz.resultsStep)); };
  document.getElementById("back").onclick = function () { go(Math.max(cur() - 1, -1)); };
  document.getElementById("lobby").onclick = function () { go(-1); };
  document.getElementById("results").onclick = function () { go(quiz.resultsStep); };
  document.getElementById("reset").onclick = function () {
    if (!confirm("Start a new session? Everyone must rejoin and the current answers are closed.")) return;
    post("host/reset").then(function (j) { if (j.error) { flash(j.error); return; } zones = null; state = j; lastSig = ""; render(); });
  };
  var emEl = document.getElementById("emails"), emKey = document.getElementById("em-key"), emErr = document.getElementById("em-err"), emOut = document.getElementById("em-out"), emAsk = document.getElementById("em-ask");
  function emOpen() { emErr.textContent = ""; emOut.style.display = "none"; emOut.textContent = ""; emAsk.style.display = ""; emKey.value = keyIn.value || ""; emEl.classList.add("show"); setTimeout(function () { emKey.focus(); }, 50); }
  document.getElementById("export").onclick = emOpen;
  document.getElementById("em-close").onclick = function () { emEl.classList.remove("show"); };
  function emLoad() {
    var k = emKey.value.trim(); emErr.textContent = ""; if (!k) { emErr.textContent = "Enter the key first."; return; }
    fetch("/api/live/" + withEv("host/export?format=json"), { headers: { "x-host-key": k } }).then(function (r) {
      return r.json().then(function (j) { return { ok: r.ok, j: j }; });
    }).then(function (x) {
      if (!x.ok) { emErr.textContent = x.j.error || "Could not load emails."; return; }
      try { sessionStorage.setItem("fyz-host", k); keyIn.value = k; } catch (e) {}
      var rows = x.j.rows || [], text = rows.map(function (r) { return r.email; }).join("\n");
      emAsk.style.display = "none"; emOut.style.display = ""; emOut.textContent = "";
      var n = document.createElement("div"); n.className = "note";
      n.textContent = rows.length + " with consent, out of " + x.j.total + " who joined." + (x.j.withheld ? " " + x.j.withheld + " gave an email without consent and are not shown." : "");
      emOut.appendChild(n);
      var b1 = document.createElement("button"); b1.type = "button"; b1.className = "go"; b1.textContent = "Copy all emails";
      b1.onclick = function () { var done = function () { b1.textContent = "Copied"; }; if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(text).then(done, function () { ta.select(); }); } else { ta.select(); document.execCommand && document.execCommand("copy"); done(); } };
      var b2 = document.createElement("button"); b2.type = "button"; b2.textContent = "Close"; b2.onclick = function () { emEl.classList.remove("show"); };
      emOut.appendChild(b1); emOut.appendChild(b2);
      var ta = document.createElement("textarea"); ta.readOnly = true; ta.value = text; ta.style.cssText = "width:100%;height:12vh;margin-top:1vh;font:inherit;box-sizing:border-box"; emOut.appendChild(ta);
      var t = document.createElement("table"), h = document.createElement("tr");
      ["Email", "Zone", "First job"].forEach(function (c) { var th = document.createElement("th"); th.textContent = c; h.appendChild(th); }); t.appendChild(h);
      rows.forEach(function (r) { var tr = document.createElement("tr"); [r.email, r.zone, r.firstJob].forEach(function (c) { var td = document.createElement("td"); td.textContent = c || ""; tr.appendChild(td); }); t.appendChild(tr); });
      emOut.appendChild(t);
    }).catch(function () { emErr.textContent = "No connection to the server."; });
  }
  document.getElementById("em-go").onclick = emLoad;
  emKey.addEventListener("keydown", function (e) { if (e.key === "Enter") emLoad(); });
  if (/[?&]emails=1/.test(location.search)) emOpen();
  document.addEventListener("keydown", function (e) {
    if (e.target === keyIn || e.target === emKey) return;
    if (e.key === "c" || e.key === "C") { ctl.classList.toggle("show"); }
    else if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); document.getElementById("next").click(); }
    else if (e.key === "ArrowLeft") { document.getElementById("back").click(); }
  });
  keyIn.addEventListener("keydown", function (e) { if (e.key === "Enter") { try { sessionStorage.setItem("fyz-host", keyIn.value); } catch (x) {} flash("Key saved for this tab."); keyIn.blur(); } });

  // Embedded in the deck: no host key, no hint, no reset or export. Arrow keys still move the quiz.
  try { if (window.self !== window.top) { ["key", "reset", "export", "hint"].forEach(function (id) { var n = document.getElementById(id); if (n) n.style.display = "none"; }); } } catch (e) {}

  // Deck mode: /screen?at=N sits on one slide. N is a question (0 to 11) or the results step (12).
  // The quiz moves to N when this slide becomes the active slide, so the deck's own arrows drive the quiz.
  if (AT !== null) {
    document.body.classList.add("qmode");
    var deck = null, wasActive = false;
    try { deck = window.parent.document.querySelector("deck-stage"); } catch (e) {}
    function isActive() { try { var sec = window.frameElement && window.frameElement.closest("section"); return sec ? sec.hasAttribute("data-deck-active") : true; } catch (e) { return true; } }
    // Hold off the 2s network poll while this slide is not showing.
    window.__fyzSkip = function () { return !isActive(); };
    setInterval(function () {
      var a = isActive();
      if (a && !wasActive) { post("host/goto", { step: AT }).then(function (j) { if (!j.error) { state = j; if (j.step !== quiz.resultsStep) zones = null; lastSig = ""; if (quiz) render(); tick(); } }); }
      wasActive = a;
    }, 300);
    document.addEventListener("keydown", function (e) {
      if (!deck) return;
      if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); e.stopImmediatePropagation(); deck.next(); }
      else if (e.key === "ArrowLeft") { e.preventDefault(); e.stopImmediatePropagation(); deck.prev(); }
    }, true);
  }

  tick();
  // Poll every 2s while visible, every 10s if the tab is hidden.
